name: Generate and publish people sitemaps

# The hourly heart of the /people sitemap band (see the sharding rationale in
# src/lib/sitemap-entries.ts): one corpus walk emits all 64 shard files
# (scripts/generate-sitemaps.ts --people-shards-out, the gated generator) and
# syncs them to s3://gp-marketing-sitemaps/sitemap/people/.
#
# Generation runs, and its fail-closed gates are checked, BEFORE any AWS
# credential exists in the job -- a bad corpus walk (wrong shard count, a
# shard over the URL ceiling, the total floor tripped, malformed XML) never
# reaches a step that can touch S3, and nothing already published is ever
# removed (no `--delete` is ever passed to `aws s3 sync`).
#
# workflow_dispatch accepts an optional single `shard` so the takedown path
# can refresh one file within minutes instead of waiting for the whole band.
# It shares the hourly cron's concurrency group so a dispatched takedown
# queues behind an in-flight run instead of racing it.
#
# gp-api reads authenticate with this run's GitHub Actions OIDC token
# (audience `gp-api`, no stored secret), which gp-api accepts only from this
# workflow: prod allowlists it at refs/heads/develop, dev at any ref. The
# token is fetched in the step right before generation and handed to that
# step alone as GP_API_SERVICE_TOKEN (src/lib/electionApiAuth.ts).
#
# workflow_dispatch with `dev_dry_run` reads from dev gp-api instead, never
# configures AWS or publishes, reports no failure to Grafana, and uploads the
# shards as a workflow artifact. It has its own concurrency group so it can
# never displace a pending scheduled run.

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      shard:
        description: 'Single shard (0-63) to regenerate; empty regenerates all 64'
        type: string
        default: ''
      dev_dry_run:
        description: 'Read from dev gp-api and upload the shards as an artifact; nothing is published to S3'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ inputs.dev_dry_run == true && 'generate-people-sitemaps-dev-dry-run' || 'generate-people-sitemaps' }}
  cancel-in-progress: false

env:
  GP_API_BASE_URL: ${{ inputs.dev_dry_run == true && 'https://gp-api-dev.goodparty.org' || 'https://gp-api.goodparty.org' }}
  # getBaseUrl() (src/lib/siteBaseUrl.ts) writes this into every emitted <loc>.
  # It already falls back to the production host with nothing set, but this
  # keeps that fallback explicit rather than implicit, and keeps the shard
  # emitter's local-host refusal gate (runPeopleShardsOut) meaningful.
  NEXT_PUBLIC_SITE_URL: https://goodparty.org
  # Job level so both `if:` conditions and `run:` steps can read it as a real
  # shell variable ($SHARD) instead of interpolating `${{ inputs.shard }}`
  # directly into script text.
  SHARD: ${{ inputs.shard }}
  # `inputs.dev_dry_run` is null on the hourly cron, which the `== true`
  # comparison turns into 'false'.
  DEV_DRY_RUN: ${{ inputs.dev_dry_run == true }}

jobs:
  generate-and-publish:
    name: Generate and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Validate shard input
        if: env.SHARD != ''
        run: |
          set -euo pipefail
          if ! [[ "$SHARD" =~ ^[0-9]+$ ]] || [ "$SHARD" -ge 64 ]; then
            echo "::error::shard must be an integer in [0, 64), got '$SHARD'"
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # GitHub signs this per request; it is masked before it can reach the
      # log and passed only to the generate step's env. GitHub does not
      # document the lifetime: its docs' example claims show 5 minutes, real
      # tokens have shown far longer. Fetching it here, immediately before the
      # ~1 minute walk, keeps it inside even the 5-minute case. If a walk ever
      # outlasts it, gp-api 401s, every gp-api read in the walk throws, and the
      # run fails before anything is published.
      - name: Fetch gp-api OIDC token
        id: gp-api-token
        run: |
          set -euo pipefail
          token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=gp-api" | jq -r '.value')
          if [ -z "$token" ] || [ "$token" = "null" ]; then
            echo "::error::GitHub returned no OIDC token for audience gp-api"
            exit 1
          fi
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Generate people shards
        id: generate-shards
        env:
          GP_API_SERVICE_TOKEN: ${{ steps.gp-api-token.outputs.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/people-shards"
          if [ -n "$SHARD" ]; then
            bun run scripts/generate-sitemaps.ts --people-shards-out "$RUNNER_TEMP/people-shards" --shard "$SHARD"
          else
            bun run scripts/generate-sitemaps.ts --people-shards-out "$RUNNER_TEMP/people-shards"
          fi

      - name: Summarize dry-run shards
        if: env.DEV_DRY_RUN == 'true'
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/people-shards"
          shard_count=$(find "$dir" -name '*.xml' | wc -l | tr -d ' ')
          total_urls=0
          {
            echo "### Dev dry run: people shards from $GP_API_BASE_URL"
            echo
            echo "| Shard | URLs |"
            echo "| --- | --- |"
            for f in $(find "$dir" -name '*.xml' | sort -V); do
              urls=$( (grep -o '<loc>' "$f" || true) | wc -l | tr -d ' ')
              total_urls=$((total_urls + urls))
              echo "| $(basename "$f" .xml) | $urls |"
            done
            echo
            echo "**$shard_count shard file(s), $total_urls URLs total.** Nothing was published to S3."
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload dry-run shards
        if: env.DEV_DRY_RUN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: people-shards-dev-dry-run-${{ github.run_id }}
          path: ${{ runner.temp }}/people-shards
          if-no-files-found: error
          retention-days: 7

      # Everything above this line can fail without an AWS credential ever
      # existing in the job. A dev dry run stops here. SITEMAPS_PUBLISHER_ROLE_ARN (task 01) may not be
      # set yet on a fresh merge -- skip publishing rather than fail loudly on
      # a known, temporary gap; the "Note" step below makes that visible.
      - name: Configure AWS credentials
        id: configure-aws
        if: env.DEV_DRY_RUN != 'true' && vars.SITEMAPS_PUBLISHER_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.SITEMAPS_PUBLISHER_ROLE_ARN }}
          aws-region: us-west-2

      - name: Publish all shards
        id: publish-full
        if: env.DEV_DRY_RUN != 'true' && vars.SITEMAPS_PUBLISHER_ROLE_ARN != '' && env.SHARD == ''
        run: |
          aws s3 sync "$RUNNER_TEMP/people-shards" s3://gp-marketing-sitemaps/sitemap/people/ \
            --content-type application/xml \
            --cache-control "public, max-age=300" \
            --exact-timestamps

      - name: Publish single shard
        id: publish-shard
        if: env.DEV_DRY_RUN != 'true' && vars.SITEMAPS_PUBLISHER_ROLE_ARN != '' && env.SHARD != ''
        run: |
          aws s3 cp "$RUNNER_TEMP/people-shards/$SHARD.xml" \
            "s3://gp-marketing-sitemaps/sitemap/people/$SHARD.xml" \
            --content-type application/xml \
            --cache-control "public, max-age=300"

      - name: Note publisher role not configured yet
        if: env.DEV_DRY_RUN != 'true' && vars.SITEMAPS_PUBLISHER_ROLE_ARN == ''
        run: echo "::notice::SITEMAPS_PUBLISHER_ROLE_ARN is not set (task 01 pending) -- shards were generated and gate-validated but not published"

      # Pushes one error line to Grafana Cloud Loki; a Grafana alert on these
      # stream labels and fields files a Bugs-board ticket, so keep them stable.
      # --fail-with-body exits non-zero on any rejected push (a revoked token,
      # a token without logs:write) and prints Loki's reason. Runs regardless
      # of which prior step failed -- `if: failure()` overrides the default
      # "only run after success" behavior. A dev dry run never reports. Until
      # the Grafana variables and secret are set, it warns and skips instead.
      - name: Report failure to Grafana
        if: failure() && env.DEV_DRY_RUN != 'true'
        env:
          LOKI_URL: ${{ vars.GRAFANA_LOKI_URL }}
          LOKI_USER: ${{ vars.GRAFANA_LOKI_USER }}
          LOKI_TOKEN: ${{ secrets.GRAFANA_LOKI_PUSH_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FAILING_STEP: >-
            ${{
              steps.gp-api-token.outcome == 'failure' && 'Fetch gp-api OIDC token'
              || steps.generate-shards.outcome == 'failure' && 'Generate people shards'
              || steps.configure-aws.outcome == 'failure' && 'Configure AWS credentials'
              || steps.publish-full.outcome == 'failure' && 'Publish all shards'
              || steps.publish-shard.outcome == 'failure' && 'Publish single shard'
              || 'unknown step'
            }}
        run: |
          set -euo pipefail
          if [ -z "$LOKI_URL" ] || [ -z "$LOKI_USER" ] || [ -z "$LOKI_TOKEN" ]; then
            echo "::warning::GRAFANA_LOKI_URL, GRAFANA_LOKI_USER or GRAFANA_LOKI_PUSH_TOKEN is not set -- this failure at '${FAILING_STEP}' was not reported to Grafana"
            exit 0
          fi
          line=$(jq -cn \
            --arg failing_step "$FAILING_STEP" \
            --arg run_url "$RUN_URL" \
            '{level: "error", msg: "generate-people-sitemaps failed", failing_step: $failing_step, run_url: $run_url}')
          jq -n \
            --arg ts "$(date +%s%N)" \
            --arg line "$line" \
            '{streams: [{stream: {service_name: "gp-marketing", deployment_environment_name: "prod", job: "generate-people-sitemaps"}, values: [[$ts, $line]]}]}' \
            | curl -sS --fail-with-body --max-time 30 -X POST "${LOKI_URL%/}/loki/api/v1/push" \
                -u "$LOKI_USER:$LOKI_TOKEN" \
                -H 'Content-Type: application/json' \
                --data @-
          echo "Reported failure at '${FAILING_STEP}' to Grafana Loki"

	 * ================================================================== */
	SCREENS['voter-sent'] = function () {
		var v = state.voter;
		return '<div class="page narrow screen">' +
			'<div class="stack-lg">' +
				'<div class="card pad-lg">' +
					'<div class="stack" style="align-items:center;text-align:center">' +
						'<span class="ok-mark">' + icon('check', 30) + '</span>' +
						'<h1 class="h-xl">Request received!</h1>' +
						'<p class="lede" style="text-align:center">Your request for ' + esc(SPINE.fullName) + ' to complete their profile has been recorded.</p>' +

						'<div class="card" style="width:100%;text-align:left;background:var(--surface-2)">' +
							'<div class="summary-row"><span class="summary-k">Candidate</span><span class="summary-v">' + esc(SPINE.fullName) + '</span></div>' +
							'<div class="summary-row"><span class="summary-k">Request</span><span class="summary-v">Complete their public profile</span></div>' +
							'<div class="summary-row"><span class="summary-k">Status</span><span class="summary-v"><span class="pill pill-green">' + icon('check', 12) + ' Request received</span></span></div>' +
						'</div>' +

						'<div class="notice notice-blue" style="text-align:left;width:100%">' + icon('mail', 20, 'notice-ico') +
							'<div class="notice-body">We will email <b>' + esc(v.email) + '</b> if this profile is completed. ' +
							'You will not hear from us otherwise.</div></div>' +

						'<button class="btn btn-primary btn-lg" data-go="profile">Back to ' + esc(SPINE.firstName) + '’s profile ' + icon('arrow', 15) + '</button>' +
					'</div>' +
				'</div>' +
				protoNote('Prototype. Nothing was sent, and we are not claiming the candidate was notified.') +
			'</div>' +
		'</div>';
	};

	/* ================================================================== *
	 * Validation helpers
	 * ================================================================== */
	function setErr(id, msg) {
		var el = document.getElementById('err-' + id);
		if (!el) return;
		el.innerHTML = icon('alert', 13) + '<span>' + esc(msg) + '</span>';
		el.hidden = false;
		var input = document.getElementById(id);
		if (input) input.setAttribute('aria-invalid', 'true');
	}

	function clearErr(id) {
		var el = document.getElementById('err-' + id);
		if (el) { el.hidden = true; el.textContent = ''; }
		var input = document.getElementById(id);
		if (input) input.removeAttribute('aria-invalid');
	}

	function focusFirstError() {
		var el = document.querySelector('[aria-invalid="true"]');
		if (!el) {
			var firstErr = document.querySelector('.err:not([hidden])');
			if (firstErr) {
				var box = firstErr.previousElementSibling && firstErr.previousElementSibling.querySelector('input');
				el = box || firstErr;
			}
		}
		if (el && el.focus) el.focus();
		if (el && el.scrollIntoView) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
	}

	function validEmail(v) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.trim()); }

	function busy(btn, label) {
		if (!btn) return function () {};
		var original = btn.innerHTML;
		btn.disabled = true;
		btn.innerHTML = '<span class="spinner"></span><span>' + esc(label) + '</span>';
		return function () { btn.disabled = false; btn.innerHTML = original; };
	}

	function setPath(obj, path, value) {
		var parts = path.split('.');
		var ref = obj;
		for (var i = 0; i < parts.length - 1; i++) ref = ref[parts[i]];
		ref[parts[parts.length - 1]] = value;
	}

	/* ---------------- editor helpers ---------------- */

	function findIssue(id) {
		for (var i = 0; i < state.draft.issues.length; i++) {
			if (state.draft.issues[i].id === id) return state.draft.issues[i];
		}
		return null;
	}

	function setCounter(id, used, max) {
		var el = document.getElementById(id);
		if (!el) return;
		el.textContent = used + ' / ' + max;
		el.className = 'counter' + (used > max ? ' over' : '');
	}

	/* Keeps the sidebar progress honest while typing, without re-rendering
	   the form underneath the caret. */
	function updateProgress() {
		var count = addedCount();
		var added = sectionsAdded();
		var bar = document.querySelector('.prog-bar span');
		if (bar) bar.style.width = (count / 3 * 100) + '%';
		var pb = document.querySelector('.prog-bar');
		if (pb) pb.setAttribute('aria-valuenow', String(count));
		var head = document.querySelector('.prog-head .faint');
		if (head) head.textContent = count + ' of 3';
		document.querySelectorAll('.prog-row').forEach(function (row, i) {
			row.classList.toggle('is-on', !!added[i]);
			var tick = row.querySelector('.prog-tick');
			if (tick) tick.innerHTML = added[i] ? icon('check', 12) : '';
		});
	}

	/* Draft autosave. The indicator is the whole point: it is how the screen
	   says "this is private and already kept" without a banner per field. */
	var saveTimer = null;
	function setSaveState(html) {
		var el = document.getElementById('saveState');
		if (el) el.innerHTML = html;
	}

	function commitDraft() {
		state.draft.saved = true;
		state.draft.savedAt = Date.now();
		setSaveState(icon('check', 13) + '<span>Draft saved</span>');
		updateProgress();
	}

	function markDirty() {
		updateProgress();
		setSaveState('<span class="spinner spinner-xs"></span><span>Saving\u2026</span>');
		clearTimeout(saveTimer);
		saveTimer = setTimeout(commitDraft, 650);
	}

	/* ================================================================== *
	 * Render + wiring
	 * ================================================================== */
	function render() {
		state.screen = current();
		// Already signed in? The account screen has nothing left to ask.
		// `replace` keeps it out of history so Back never bounces off it.
		if (state.screen === 'account' && state.account.loggedIn) {
			location.replace('#edit');
			return;
		}
		var fn = SCREENS[state.screen] || SCREENS.profile;
		document.getElementById('app').innerHTML = fn();
		renderSteps();
		updateRail();
		wire();
		renderPanel();
		if (focusHeading) {
			focusHeading = false;
			var h = document.querySelector('#app h1, #app h2');
			if (h) { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }); }
		}
		if (pendingFocus) {
			var target = document.getElementById(pendingFocus);
			pendingFocus = null;
			if (target) { target.focus(); target.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
		}
	}

	function wire() {
		var app = document.getElementById('app');

		// plain navigation
		app.querySelectorAll('[data-go]').forEach(function (b) {
			b.addEventListener('click', function () { go(b.getAttribute('data-go')); });
		});

		// choose a path: selecting a card only records the choice
		app.querySelectorAll('[data-path]').forEach(function (r) {
			r.addEventListener('change', function () {
				state.path = r.getAttribute('data-path');
				app.querySelectorAll('.choice-card').forEach(function (c) {
					c.classList.toggle('is-on', c.contains(r));
				});
				var cont = document.getElementById('pathContinue');
				if (cont) cont.disabled = false;
				var hint = document.getElementById('pathHint');
				if (hint) hint.hidden = true;
			});
		});

		var pathContinue = document.getElementById('pathContinue');
		if (pathContinue) pathContinue.addEventListener('click', function () {
			if (!state.path) return;
			go(state.path === 'candidate' ? (state.account.loggedIn ? 'edit' : 'account') : 'voter-review');
		});

		// two-way binding; typing is never lost moving backward or forward
		app.querySelectorAll('[data-model]').forEach(function (el) {
			el.addEventListener('input', function () {
				setPath(state, el.getAttribute('data-model'), el.value);
				if (el.id) clearErr(el.id);
				if (el.id === 'why' || el.id === 'about') {
					state.draft.touched = true;
					var max = el.id === 'why' ? LIMITS.why : LIMITS.about;
					setCounter('c-' + el.id, el.value.length, max);
					markDirty();
				}
				if (el.getAttribute('data-model').indexOf('draft.') === 0) state.draft.touched = true;
			});
		});

		// ---- account ----
		app.querySelectorAll('[data-mode]').forEach(function (t) {
			t.addEventListener('click', function () { state.account.mode = t.getAttribute('data-mode'); render(); });
		});

		var termsBox = app.querySelector('[data-terms]');
		if (termsBox) termsBox.addEventListener('change', function () {
			state.account.terms = termsBox.checked;
			termsBox.closest('.check').classList.toggle('is-on', termsBox.checked);
			clearErr('terms');
		});

		var ssoGoogle = document.getElementById('ssoGoogle');
		if (ssoGoogle) ssoGoogle.addEventListener('click', function () {
			var restore = busy(ssoGoogle, 'Connecting');
			setTimeout(function () {
				restore();
				state.account.loggedIn = true;
				state.path = 'candidate';
				toast('Signed in with Google');
				location.replace('#edit');
			}, 1100);
		});

		var pwToggle = document.getElementById('pwToggle');
		if (pwToggle) pwToggle.addEventListener('click', function () {
			var inp = document.getElementById('password');
			var showing = inp.type === 'text';
			inp.type = showing ? 'password' : 'text';
			pwToggle.innerHTML = icon(showing ? 'eye' : 'eyeOff', 17);
			pwToggle.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
		});

		var accountSubmit = document.getElementById('accountSubmit');
		if (accountSubmit) accountSubmit.addEventListener('click', function () {
			var a = state.account, ok = true;
			if (a.mode === 'signup') {
				if (!a.firstName.trim()) { setErr('firstName', 'Enter your first name.'); ok = false; }
				if (!a.lastName.trim()) { setErr('lastName', 'Enter your last name.'); ok = false; }
			}
			if (!a.email.trim()) { setErr('email', 'Enter your email address.'); ok = false; }
			else if (!validEmail(a.email)) { setErr('email', 'That does not look like an email address.'); ok = false; }
			if (!a.password) { setErr('password', 'Enter a password.'); ok = false; }
			else if (a.mode === 'signup' && a.password.length < 8) { setErr('password', 'Use at least 8 characters.'); ok = false; }
			if (a.mode === 'signup' && !a.terms) { setErr('terms', 'Agree to the terms to create an account.'); ok = false; }
			if (!ok) { focusFirstError(); return; }

			var restore = busy(accountSubmit, a.mode === 'signup' ? 'Creating your account' : 'Signing in');
			setTimeout(function () {
				restore();
				state.account.loggedIn = true;
				state.path = 'candidate';
				toast(a.mode === 'signup' ? 'Account created' : 'Signed in');
				// Replace, not push: you cannot go back to creating an account
				// once you have one, so #account leaves the history stack.
				location.replace('#edit');
			}, 1100);
		});

		// ---- edit ----
		app.querySelectorAll('[data-issue-title]').forEach(function (el) {
			el.addEventListener('input', function () {
				var issue = findIssue(el.getAttribute('data-issue-title'));
				if (!issue) return;
				issue.title = el.value;
				state.draft.touched = true;
				setCounter('c-it-' + issue.id, el.value.length, LIMITS.issueTitle);
				clearErr('it-' + issue.id);
				clearErr('issues');
				updateProgress();
				markDirty();
			});
		});

		app.querySelectorAll('[data-issue-position]').forEach(function (el) {
			el.addEventListener('input', function () {
				var issue = findIssue(el.getAttribute('data-issue-position'));
				if (!issue) return;
				issue.position = el.value;
				state.draft.touched = true;
				setCounter('c-ip-' + issue.id, el.value.length, LIMITS.issuePosition);
				clearErr('ip-' + issue.id);
				markDirty();
			});
		});

		var addIssue = document.getElementById('addIssue');
		if (addIssue) addIssue.addEventListener('click', function () {
			if (state.draft.issues.length >= MAX_ISSUES) return;
			var issue = newIssue();
			state.draft.issues.push(issue);
			state.draft.touched = true;
			pendingFocus = 'it-' + issue.id;
			render();
		});

		app.querySelectorAll('[data-remove-issue]').forEach(function (b) {
			b.addEventListener('click', function () {
				var id = b.getAttribute('data-remove-issue');
				state.draft.issues = state.draft.issues.filter(function (i) { return i.id !== id; });
				state.draft.touched = true;
				markDirty();
				render();
			});
		});

		function saveDraft(btn, then) {
			var restore = busy(btn, 'Saving');
			setTimeout(function () {
				restore();
				commitDraft();
				then();
			}, 700);
		}

		var skipEdit = document.getElementById('skipEdit');
		if (skipEdit) skipEdit.addEventListener('click', function () {
			// Skipping still keeps the work: the draft is committed either way.
			commitDraft();
			state.draft.skipped = addedCount() < 3;
			toast('Draft saved. You can finish this any time.', 'lock');
			go('pledge');
		});

		var editContinue = document.getElementById('editContinue');
		if (editContinue) editContinue.addEventListener('click', function () {
			var ok = true;
			if (state.draft.why.length > LIMITS.why) {
				setErr('why', 'That is ' + state.draft.why.length + ' characters. Trim it to ' + LIMITS.why + ' or fewer.'); ok = false;
			}
			if (state.draft.about.length > LIMITS.about) {
				setErr('about', 'That is ' + state.draft.about.length + ' characters. Trim it to ' + LIMITS.about + ' or fewer.'); ok = false;
			}
			state.draft.issues.forEach(function (i) {
				if (issueRowIsBlank(i)) return;
				if (!i.title.trim()) { setErr('it-' + i.id, 'Give this issue a name, or remove it.'); ok = false; }
				else if (i.title.length > LIMITS.issueTitle) { setErr('it-' + i.id, 'Keep the name under ' + LIMITS.issueTitle + ' characters.'); ok = false; }
				if (i.position.length > LIMITS.issuePosition) { setErr('ip-' + i.id, 'That is ' + i.position.length + ' characters. Trim it to ' + LIMITS.issuePosition + ' or fewer.'); ok = false; }
			});
			if (!ok) { focusFirstError(); return; }

			saveDraft(editContinue, function () {
				state.draft.skipped = false;
				go('pledge');
			});
		});

		// ---- role (shared by pledge and verify) ----
		app.querySelectorAll('[data-role]').forEach(function (r) {
			r.addEventListener('change', function () {
				state.role = r.getAttribute('data-role');
				clearErr('role');
				focusHeading = true;
				render();
			});
		});

		var changeRole = document.getElementById('changeRole');
		if (changeRole) changeRole.addEventListener('click', function () {
			state.role = null;
			state.pledge.consentRequested = false;
			focusHeading = true;
			render();
		});

		// ---- pledge ----
		var fullPledgeToggle = document.getElementById('fullPledgeToggle');
		if (fullPledgeToggle) fullPledgeToggle.addEventListener('click', function () {
			state.pledge.fullOpen = !state.pledge.fullOpen;
			var body = document.getElementById('fullPledgeBody');
			if (body) body.hidden = !state.pledge.fullOpen;
			fullPledgeToggle.setAttribute('aria-expanded', String(state.pledge.fullOpen));
			var chev = fullPledgeToggle.querySelector('.disclosure-chev');
			if (chev) chev.classList.toggle('is-open', state.pledge.fullOpen);
		});

		var pledgeAgree = app.querySelector('[data-pledge-all]');
		if (pledgeAgree) pledgeAgree.addEventListener('change', function () {
			setAllPledge(pledgeAgree.checked);
			pledgeAgree.closest('.check').classList.toggle('is-on', pledgeAgree.checked);
			clearErr('pledgeAgree');
		});

		var requestConsent = document.getElementById('requestConsent');
		if (requestConsent) requestConsent.addEventListener('click', function () {
			var restore = busy(requestConsent, 'Sending');
			setTimeout(function () {
				restore();
				state.pledge.consentRequested = true;
				toast('We will ask ' + SPINE.firstName + ' to sign the pledge.');
				render();
			}, 900);
		});

		var pledgeSubmit = document.getElementById('pledgeSubmit');
		if (pledgeSubmit) pledgeSubmit.addEventListener('click', function () {
			var ok = true;
			if (!allPledgeAgreed()) { setErr('pledgeAgree', 'Agree to the pledge before continuing.'); ok = false; }
			var sig = state.pledge.signature.trim();
			if (!sig) { setErr('sig', 'Sign with your full name.'); ok = false; }
			else if (sig.toLowerCase() !== SPINE.fullName.toLowerCase()) { setErr('sig', 'The signature must match ' + SPINE.fullName + ' exactly.'); ok = false; }
			if (!ok) { focusFirstError(); return; }

			var restore = busy(pledgeSubmit, 'Recording your pledge');
			setTimeout(function () {
				restore();
				state.pledge.taken = true;
				state.pledge.takenOn = 'November 10, 2026';
				toast('Pledge recorded', 'star');
				go('verify');
			}, 1100);
		});

		// ---- verify ----
		app.querySelectorAll('[data-sim-verify]').forEach(function (b) {
			b.addEventListener('click', function () {
				state.verify.status = b.getAttribute('data-sim-verify');
				state.verify.submitted = state.verify.status !== 'unverified';
				render();
			});
		});

		var verifySubmit = document.getElementById('verifySubmit');
		if (verifySubmit) verifySubmit.addEventListener('click', function () {
			if (!state.role) { setErr('role', 'Tell us which one you are first.'); focusFirstError(); return; }
			var restore = busy(verifySubmit, 'Submitting');
			setTimeout(function () {
				restore();
				state.verify.submitted = true;
				state.verify.status = 'pending';
				render();
			}, 1200);
		});

		var restartVerify = document.getElementById('restartVerify');
		if (restartVerify) restartVerify.addEventListener('click', function () {
			state.verify.status = 'unverified';
			render();
		});

		// ---- publish ----
		var publishBtn = document.getElementById('publishBtn');
		if (publishBtn) publishBtn.addEventListener('click', function () {
			if (!canPublish()) return;
			var moderated = state.publish.moderation;
			var restore = busy(publishBtn, moderated ? 'Submitting' : 'Publishing');
			setTimeout(function () {
				restore();
				if (moderated) {
					state.publish.submittedForReview = true;
				} else {
					state.publish.published = true;
					state.publish.submittedForReview = false;
				}
				go('done');
			}, 1400);
		});

		// ---- voter ----
		var resetMessage = document.getElementById('resetMessage');
		if (resetMessage) resetMessage.addEventListener('click', function () {
			state.voter.message = VOTER_DEFAULT_MESSAGE;
			var ta = document.getElementById('vMessage');
			if (ta) ta.value = VOTER_DEFAULT_MESSAGE;
			clearErr('vMessage');
			toast('Suggested message restored');
		});

		function validateVoter() {
			var v = state.voter, ok = true;
			if (!v.message.trim()) { setErr('vMessage', 'Write a message, or reset it to the suggested one.'); ok = false; }
			if (!v.firstName.trim()) { setErr('vFirst', 'Enter your first name.'); ok = false; }
			if (!v.lastName.trim()) { setErr('vLast', 'Enter your last name.'); ok = false; }
			if (!v.email.trim()) { setErr('vEmail', 'Enter your email address.'); ok = false; }
			else if (!validEmail(v.email)) { setErr('vEmail', 'That does not look like an email address.'); ok = false; }
			return ok;
		}

		var voterContinue = document.getElementById('voterContinue');
		if (voterContinue) voterContinue.addEventListener('click', function () {
			if (!validateVoter()) { focusFirstError(); return; }
			go('voter-confirm');
		});

		var sendRequest = document.getElementById('sendRequest');
		if (sendRequest) sendRequest.addEventListener('click', function () {
			// Guard against a double tap queueing two requests.
			if (state.voter.sending || state.voter.sent) return;
			state.voter.sending = true;
			var restore = busy(sendRequest, 'Sending');
			setTimeout(function () {
				restore();
				state.voter.sending = false;
				state.voter.sent = true;
				go('voter-sent');
			}, 1300);
		});

		// non-navigating demo links
		app.querySelectorAll('[data-noop]').forEach(function (a) {
			a.addEventListener('click', function (e) {
				e.preventDefault();
				toast('Not part of this prototype yet.', 'info');
			});
		});
	}

	/* ------------------------------------------------------------------ *
	 * Prototype control panel. Jumps to any screen and forces the states
	 * that are otherwise only reachable by playing the flow through.
	 * Presentation scaffolding — none of this is product behaviour.
	 * ------------------------------------------------------------------ */

	var SAMPLE = {
		why: 'I have spent twelve years as a nurse in north Minneapolis. I am running because the people I care for every day cannot afford to wait ' +
			'for either party to act, and because this district deserves someone who answers to it rather than to a caucus.',
		about: 'Born and raised in Minneapolis. Twelve years at North Memorial, six of them as a union steward. I serve on the board of a ' +
			'neighbourhood housing trust and coach youth basketball on weekends.',
		issues: [
			{ id: 'sample-1', title: 'Healthcare costs', position: 'Cap out-of-pocket costs and expand clinic hours so working people can be seen outside a weekday shift.' },
			{ id: 'sample-2', title: 'Housing affordability', position: 'Back construction of mixed-income housing near transit, and fund legal aid for tenants facing eviction.' },
			{ id: 'sample-3', title: 'Campaign finance reform', position: 'Refuse corporate PAC money and publish every donation above twenty-five dollars.' }
		]
	};

	var PANEL_SCREENS = [
		['profile', 'Candidate profile (entry)'],
		['path', 'Choose a path'],
		['account', 'Create an account'],
		['edit', 'Profile editor'],
		['pledge', 'People First Pledge'],
		['verify', 'Verify access'],
		['preview', 'Review and publish'],
		['done', 'Published'],
		['voter-review', 'Voter: write request'],
		['voter-confirm', 'Voter: review and send'],
		['voter-sent', 'Voter: confirmation']
	];

	function fillSample(on) {
		if (on) {
			state.draft.why = SAMPLE.why;
			state.draft.about = SAMPLE.about;
			state.draft.issues = SAMPLE.issues.map(function (i) { return { id: i.id, title: i.title, position: i.position }; });
			state.draft.saved = true;
			state.draft.touched = true;
		} else {
			state.draft.why = '';
			state.draft.about = '';
			state.draft.issues = [];
			state.draft.saved = false;
			state.draft.touched = false;
		}
	}

	function setPledge(on) {
		state.pledge.taken = on;
		state.pledge.takenOn = on ? 'November 10, 2026' : null;
		setAllPledge(on);
		state.pledge.signature = on ? SPINE.fullName : '';
		if (on && !state.role) state.role = 'candidate';
	}

	function panelToggles() {
		return [
			{
				label: 'Account', opts: [
					{ k: 'signed-out', label: 'Signed out', on: !state.account.loggedIn },
					{ k: 'signed-in', label: 'Signed in', on: state.account.loggedIn }
				]
			},
			{
				label: 'Claiming as', opts: [
					{ k: 'role-none', label: 'Not set', on: !state.role },
					{ k: 'role-candidate', label: 'Candidate', on: state.role === 'candidate' },
					{ k: 'role-rep', label: 'Manager', on: state.role === 'rep' }
				]
			},
			{
				label: 'Pledge', opts: [
					{ k: 'pledge-off', label: 'Not taken', on: !state.pledge.taken },
					{ k: 'pledge-on', label: 'Recorded', on: state.pledge.taken }
				]
			},
			{
				label: 'Verification', opts: [
					{ k: 'v-unverified', label: 'Not submitted', on: state.verify.status === 'unverified' },
					{ k: 'v-pending', label: 'Pending', on: state.verify.status === 'pending' },
					{ k: 'v-approved', label: 'Approved', on: state.verify.status === 'approved' },
					{ k: 'v-more-info', label: 'More info', on: state.verify.status === 'more-info' }
				]
			},
			{
				label: 'Profile content', opts: [
					{ k: 'content-empty', label: 'Incomplete', on: addedCount() === 0 },
					{ k: 'content-full', label: 'Completed', on: addedCount() > 0 }
				]
			},
			{
				label: 'Publishing', opts: [
					{ k: 'pub-direct', label: 'Publishes directly', on: !state.publish.moderation },
					{ k: 'pub-review', label: 'Needs moderation', on: state.publish.moderation }
				]
			},
			{
				label: 'Published', opts: [
					{ k: 'live-off', label: 'Not published', on: !state.publish.published },
					{ k: 'live-on', label: 'Published', on: state.publish.published }
				]
			}
		];
	}

	function renderPanel() {
		var host = document.getElementById('protoPanel');
		if (host.hidden) return;
		var cur = state.screen;
		host.innerHTML =
			'<div class="pp-head">' +
				'<div><p class="pp-title">Prototype controls</p>' +
				'<p class="pp-sub">Presentation aids. None of this is a production feature.</p></div>' +
				'<button type="button" class="pp-close" id="ppClose" aria-label="Close prototype controls">' + icon('x', 16) + '</button>' +
			'</div>' +
			'<div class="pp-body">' +
				'<p class="pp-label">Jump to a screen</p>' +
				'<div class="pp-screens">' + PANEL_SCREENS.map(function (r) {
					return '<button type="button" class="pp-screen' + (cur === r[0] ? ' is-on' : '') + '" data-pp-go="' + r[0] + '">' + esc(r[1]) + '</button>';
				}).join('') + '</div>' +
				panelToggles().map(function (g) {
					return '<div class="pp-group"><p class="pp-label">' + esc(g.label) + '</p><div class="pp-row">' +
						g.opts.map(function (o) {
							return '<button type="button" class="sim-btn' + (o.on ? ' is-on' : '') + '" data-pp-set="' + o.k + '">' + esc(o.label) + '</button>';
						}).join('') + '</div></div>';
				}).join('') +
				'<button type="button" class="btn btn-outline btn-sm pp-reset" id="ppReset">Reset the prototype</button>' +
			'</div>';

		host.querySelectorAll('[data-pp-go]').forEach(function (b) {
			b.addEventListener('click', function () { go(b.getAttribute('data-pp-go')); });
		});
		host.querySelectorAll('[data-pp-set]').forEach(function (b) {
			b.addEventListener('click', function () { applyPanel(b.getAttribute('data-pp-set')); });
		});
		document.getElementById('ppClose').addEventListener('click', togglePanel);
		document.getElementById('ppReset').addEventListener('click', function () {
			location.hash = 'profile';
			location.reload();
		});
	}

	function applyPanel(k) {
		switch (k) {
			case 'signed-out': state.account.loggedIn = false; break;
			case 'signed-in': state.account.loggedIn = true; state.path = 'candidate'; break;
			case 'role-none': state.role = null; break;
			case 'role-candidate': state.role = 'candidate'; break;
			case 'role-rep': state.role = 'rep'; state.pledge.taken = false; break;
			case 'pledge-off': setPledge(false); break;
			case 'pledge-on': setPledge(true); break;
			case 'v-unverified': state.verify.status = 'unverified'; break;
			case 'v-pending': state.verify.status = 'pending'; break;
			case 'v-approved': state.verify.status = 'approved'; break;
			case 'v-more-info': state.verify.status = 'more-info'; break;
			case 'content-empty': fillSample(false); break;
			case 'content-full': fillSample(true); break;
			case 'pub-direct': state.publish.moderation = false; break;
			case 'pub-review': state.publish.moderation = true; break;
			case 'live-off': state.publish.published = false; state.publish.submittedForReview = false; break;
			case 'live-on':
				state.publish.published = true;
				state.verify.status = 'approved';
				if (addedCount() === 0) fillSample(true);
				break;
		}
		render();
	}

	function togglePanel() {
		var host = document.getElementById('protoPanel');
		var fab = document.getElementById('protoFab');
		host.hidden = !host.hidden;
		fab.setAttribute('aria-expanded', String(!host.hidden));
		fab.classList.toggle('is-open', !host.hidden);
		renderPanel();
	}

	document.getElementById('protoFab').addEventListener('click', togglePanel);

	/* ---------------- theme toggle ---------------- */
	document.getElementById('themeBtn').addEventListener('click', function () {
		var root = document.documentElement;
		var now = root.getAttribute('data-theme');
		var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
		var isDark = now === 'dark' || (!now && systemDark);
		root.setAttribute('data-theme', isDark ? 'light' : 'dark');
	});

	/* ---------------- boot ---------------- */
	if (!location.hash || VALID.indexOf(location.hash.slice(1)) < 0) {
		if (location.hash) { location.replace('#profile'); }
	}
	render();
})();
</script>

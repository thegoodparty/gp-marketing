<title>Claim Your Profile</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Open+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout concept: a fixed candidate rail pins Jordan Avery's identity to every
   screen; one centred column below it carries a single focused action per step. */
:root {
	--font-display: 'Outfit', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
	--font-body: 'Open Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;

	--bg: hsl(33 60% 97%);
	--surface: hsl(0 0% 100%);
	--surface-2: hsl(33 40% 98%);
	--surface-3: hsl(220 20% 96%);
	--fg: hsl(222 47% 11%);
	--fg-muted: hsl(220 14% 42%);
	--fg-faint: hsl(220 12% 56%);
	--border: hsl(220 16% 88%);
	--border-strong: hsl(220 14% 76%);

	--navy: hsl(220 58% 10%);
	--navy-2: hsl(224 59% 19%);
	--navy-3: hsl(220 58% 35%);
	--on-navy: hsl(0 0% 100%);
	--on-navy-muted: hsl(214 40% 78%);

	--accent: hsl(221 83% 53%);
	--accent-hover: hsl(221 83% 46%);
	--accent-soft: hsl(212 100% 96%);
	--accent-border: hsl(214 67% 82%);
	--on-accent: hsl(0 0% 100%);

	--gold: hsl(43 81% 51%);
	--gold-soft: hsl(44 100% 89%);
	--gold-fg: hsl(39 86% 25%);
	--gold-border: hsl(44 100% 57%);

	--red: hsl(349 83% 47%);
	--red-soft: hsl(0 100% 95%);
	--red-border: hsl(0 100% 84%);

	--green: hsl(159 46% 42%);
	--green-soft: hsl(151 45% 91%);
	--green-border: hsl(153 44% 79%);

	--lavender-soft: hsl(269 100% 93%);
	--lavender: hsl(262 71% 55%);

	--claim-g1: hsl(0 0% 100%);
	--claim-g2: hsl(0 100% 95%);
	--claim-g3: hsl(213 97% 87%);
	--claim-border: hsl(214 67% 82%);
	--claim-fg: hsl(222 47% 11%);
	--gp-red: hsl(349 83% 47%);
	--gp-blue: hsl(218 100% 38%);
	--ring: hsl(221 83% 53% / 0.35);
	--shadow-sm: 0 1px 3px hsl(222 47% 11% / 0.08), 0 1px 2px hsl(222 47% 11% / 0.04);
	--shadow-md: 0 4px 14px hsl(222 47% 11% / 0.08), 0 2px 4px hsl(222 47% 11% / 0.04);
	--shadow-lg: 0 18px 40px hsl(222 47% 11% / 0.14), 0 4px 10px hsl(222 47% 11% / 0.06);

	--r-sm: 8px;
	--r-md: 12px;
	--r-lg: 16px;
	--r-xl: 24px;
	--r-2xl: 32px;
	--rail-h: 68px;
}

@media (prefers-color-scheme: dark) {
	:root:not([data-theme="light"]) {
		color-scheme: dark;
		--bg: hsl(222 50% 7%);
		--surface: hsl(222 42% 11%);
		--surface-2: hsl(222 40% 13%);
		--surface-3: hsl(222 36% 17%);
		--fg: hsl(210 30% 96%);
		--fg-muted: hsl(214 20% 72%);
		--fg-faint: hsl(214 15% 58%);
		--border: hsl(222 28% 22%);
		--border-strong: hsl(222 24% 32%);
		--navy: hsl(222 52% 9%);
		--navy-2: hsl(224 48% 16%);
		--navy-3: hsl(220 50% 30%);
		--on-navy: hsl(0 0% 100%);
		--on-navy-muted: hsl(214 32% 74%);
		--accent: hsl(217 92% 66%);
		--accent-hover: hsl(217 92% 74%);
		--accent-soft: hsl(222 44% 18%);
		--accent-border: hsl(220 40% 34%);
		--on-accent: hsl(222 60% 8%);
		--gold: hsl(44 90% 62%);
		--gold-soft: hsl(40 40% 18%);
	--gold-fg: hsl(44 90% 72%);
		--gold-border: hsl(42 60% 36%);
		--red: hsl(352 76% 62%);
		--red-soft: hsl(350 40% 18%);
		--red-border: hsl(350 42% 36%);
		--green: hsl(153 48% 55%);
		--green-soft: hsl(165 32% 15%);
		--green-border: hsl(162 32% 30%);
		--lavender-soft: hsl(262 36% 22%);
		--lavender: hsl(266 90% 78%);
		--claim-g1: hsl(222 42% 15%);
	--claim-g2: hsl(350 30% 17%);
	--claim-g3: hsl(216 45% 22%);
	--claim-border: hsl(220 40% 34%);
	--claim-fg: hsl(210 30% 96%);
	--ring: hsl(217 92% 66% / 0.4);
		--shadow-sm: 0 1px 3px hsl(0 0% 0% / 0.4);
		--shadow-md: 0 4px 14px hsl(0 0% 0% / 0.45);
		--shadow-lg: 0 18px 40px hsl(0 0% 0% / 0.55);
	}
}

:root[data-theme="dark"] {
	color-scheme: dark;
	--bg: hsl(222 50% 7%);
	--surface: hsl(222 42% 11%);
	--surface-2: hsl(222 40% 13%);
	--surface-3: hsl(222 36% 17%);
	--fg: hsl(210 30% 96%);
	--fg-muted: hsl(214 20% 72%);
	--fg-faint: hsl(214 15% 58%);
	--border: hsl(222 28% 22%);
	--border-strong: hsl(222 24% 32%);
	--navy: hsl(222 52% 9%);
	--navy-2: hsl(224 48% 16%);
	--navy-3: hsl(220 50% 30%);
	--on-navy: hsl(0 0% 100%);
	--on-navy-muted: hsl(214 32% 74%);
	--accent: hsl(217 92% 66%);
	--accent-hover: hsl(217 92% 74%);
	--accent-soft: hsl(222 44% 18%);
	--accent-border: hsl(220 40% 34%);
	--on-accent: hsl(222 60% 8%);
	--gold: hsl(44 90% 62%);
	--gold-soft: hsl(40 40% 18%);
	--gold-fg: hsl(44 90% 72%);
	--gold-border: hsl(42 60% 36%);
	--red: hsl(352 76% 62%);
	--red-soft: hsl(350 40% 18%);
	--red-border: hsl(350 42% 36%);
	--green: hsl(153 48% 55%);
	--green-soft: hsl(165 32% 15%);
	--green-border: hsl(162 32% 30%);
	--lavender-soft: hsl(262 36% 22%);
	--lavender: hsl(266 90% 78%);
	--claim-g1: hsl(222 42% 15%);
	--claim-g2: hsl(350 30% 17%);
	--claim-g3: hsl(216 45% 22%);
	--claim-border: hsl(220 40% 34%);
	--claim-fg: hsl(210 30% 96%);
	--gp-red: hsl(349 83% 60%);
	--gp-blue: hsl(218 92% 68%);
	--ring: hsl(217 92% 66% / 0.4);
	--shadow-sm: 0 1px 3px hsl(0 0% 0% / 0.4);
	--shadow-md: 0 4px 14px hsl(0 0% 0% / 0.45);
	--shadow-lg: 0 18px 40px hsl(0 0% 0% / 0.55);
}

* { box-sizing: border-box; }
/* `hidden` must beat any display rule we set ourselves, or a collapsed
   disclosure stays open because its own `display: flex` wins. */
[hidden] { display: none !important; }

body {
	margin: 0;
	background: var(--bg);
	color: var(--fg);
	font-family: var(--font-body);
	font-size: 16px;
	line-height: 1.5;
	-webkit-font-smoothing: antialiased;
}

body::before {
	content: "";
	position: fixed;
	inset: 0 0 auto;
	height: env(safe-area-inset-top, 0px);
	z-index: 60;
	background: var(--navy);
}

h1, h2, h3, h4 { font-family: var(--font-display); font-weight: 600; margin: 0; text-wrap: balance; line-height: 1.25; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }

:focus-visible { outline: 3px solid var(--ring); outline-offset: 2px; border-radius: 4px; }
h1:focus, h2:focus { outline: none; }

/* ---------- candidate rail (pinned to every screen) ---------- */
.rail {
	position: sticky;
	top: env(safe-area-inset-top, 0px);
	z-index: 50;
	background: var(--navy);
	color: var(--on-navy);
	border-bottom: 1px solid hsl(0 0% 100% / 0.1);
}
.rail-inner {
	max-width: 1180px;
	margin: 0 auto;
	min-height: var(--rail-h);
	display: flex;
	align-items: center;
	gap: 14px;
	padding-left: max(16px, env(safe-area-inset-left, 0px));
	padding-right: max(16px, env(safe-area-inset-right, 0px));
	padding-block: 10px;
}
.rail-mark {
	width: 42px; height: 42px; flex: none;
	border-radius: 999px;
	display: grid; place-items: center;
	font-family: var(--font-display);
	font-weight: 600; font-size: 15px;
	letter-spacing: 0.02em;
	background: linear-gradient(145deg, var(--navy-3), var(--navy-2));
	border: 2px solid hsl(0 0% 100% / 0.22);
	color: var(--on-navy);
}
.rail-mark.has-photo { background: var(--gold); color: var(--navy); border-color: var(--gold); }
.rail-id { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 1px; }
.rail-name { font-family: var(--font-display); font-weight: 600; font-size: 15px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rail-meta { font-size: 12.5px; color: var(--on-navy-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rail-right { display: flex; align-items: center; gap: 8px; flex: none; }
.rail-status {
	font-size: 11.5px; font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase;
	padding: 4px 10px; border-radius: 999px; white-space: nowrap;
	background: hsl(0 0% 100% / 0.1); color: var(--on-navy-muted); border: 1px solid hsl(0 0% 100% / 0.18);
}
.rail-status.is-draft { background: var(--gold-soft); color: hsl(39 86% 25%); border-color: var(--gold-border); }
.rail-status.is-live { background: var(--green-soft); color: hsl(170 66% 18%); border-color: var(--green-border); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .rail-status.is-draft { color: hsl(44 90% 72%); } :root:not([data-theme="light"]) .rail-status.is-live { color: hsl(153 48% 68%); } }
:root[data-theme="dark"] .rail-status.is-draft { color: hsl(44 90% 72%); }
:root[data-theme="dark"] .rail-status.is-live { color: hsl(153 48% 68%); }
.rail-theme {
	width: 34px; height: 34px; border-radius: 999px; display: grid; place-items: center;
	background: hsl(0 0% 100% / 0.08); border: 1px solid hsl(0 0% 100% / 0.18);
	color: var(--on-navy); cursor: pointer;
}
.rail-theme:hover { background: hsl(0 0% 100% / 0.16); }
@media (max-width: 620px) { .rail-meta-long { display: none; } }

/* ---------- step bar ---------- */
.steps { background: var(--surface); border-bottom: 1px solid var(--border); }
.steps-inner {
	max-width: 1180px; margin: 0 auto;
	display: flex; align-items: center; gap: 6px;
	padding-left: max(16px, env(safe-area-inset-left, 0px));
	padding-right: max(16px, env(safe-area-inset-right, 0px));
	padding-block: 10px;
	overflow-x: auto; scrollbar-width: none;
}
.steps-inner::-webkit-scrollbar { display: none; }
.step { display: flex; align-items: center; gap: 7px; flex: none; padding: 4px 2px; }
.step-dot {
	width: 21px; height: 21px; border-radius: 999px; flex: none;
	display: grid; place-items: center;
	font-size: 11px; font-weight: 700; font-family: var(--font-display);
	background: var(--surface-3); color: var(--fg-faint); border: 1px solid var(--border);
}
.step-label { font-size: 12.5px; color: var(--fg-faint); white-space: nowrap; font-weight: 500; }
.step.is-active .step-dot { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.step.is-active .step-label { color: var(--fg); font-weight: 600; }
.step.is-done .step-dot { background: var(--green); color: #fff; border-color: var(--green); }
.step.is-done .step-label { color: var(--fg-muted); }
.step-sep { width: 14px; height: 1px; background: var(--border-strong); flex: none; }

/* ---------- page shell ---------- */
.page {
	max-width: 1180px; margin: 0 auto;
	padding-left: max(16px, env(safe-area-inset-left, 0px));
	padding-right: max(16px, env(safe-area-inset-right, 0px));
	padding-block: 28px 72px;
}
.page.narrow { max-width: 760px; }
.page.mid { max-width: 940px; }

.stack { display: flex; flex-direction: column; gap: 18px; }
.stack-lg { display: flex; flex-direction: column; gap: 26px; }
.stack-sm { display: flex; flex-direction: column; gap: 10px; }

.screen { animation: enter 0.28s cubic-bezier(0.165, 0.84, 0.44, 1) both; }
@keyframes enter { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .screen { animation: none; } * { transition-duration: 0.01ms !important; } }

/* ---------- typography ---------- */
.eyebrow { font-family: var(--font-display); font-size: 12px; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; color: var(--fg-faint); }
.h-xl { font-size: clamp(28px, 5vw, 40px); }
.h-lg { font-size: clamp(24px, 4vw, 32px); }
.h-md { font-size: clamp(20px, 3vw, 24px); }
.h-sm { font-size: 17px; }
.lede { font-size: clamp(16px, 2vw, 18px); color: var(--fg-muted); max-width: 62ch; }
.muted { color: var(--fg-muted); font-size: 14.5px; }
.faint { color: var(--fg-faint); font-size: 13px; }

/* ---------- cards ---------- */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 22px; }
.card.pad-lg { padding: clamp(22px, 4vw, 34px); }
.card.flush { padding: 0; overflow: hidden; }
.card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; flex-wrap: wrap; }

/* ---------- buttons ---------- */
.btn {
	display: inline-flex; align-items: center; justify-content: center; gap: 8px;
	border-radius: 999px; border: 1px solid transparent; cursor: pointer;
	font-family: var(--font-body); font-weight: 600; font-size: 14px;
	padding: 0 22px; height: 44px; white-space: nowrap;
	transition: background-color 0.18s ease, color 0.18s ease, border-color 0.18s ease, transform 0.12s ease, opacity 0.18s ease;
}
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: var(--on-accent); }
.btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
.btn-navy { background: var(--navy-2); color: #fff; }
.btn-navy:hover:not(:disabled) { background: var(--navy-3); }
.btn-outline { background: transparent; color: var(--fg); border-color: var(--border-strong); }
.btn-outline:hover:not(:disabled) { background: var(--surface-3); }
.btn-ghost { background: transparent; color: var(--fg-muted); padding: 0 14px; }
.btn-ghost:hover:not(:disabled) { background: var(--surface-3); color: var(--fg); }
.btn-lg { height: 50px; font-size: 15px; padding: 0 28px; }
.btn-sm { height: 36px; font-size: 13px; padding: 0 16px; }
.btn-block { width: 100%; }
.btn-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn-row.end { justify-content: flex-end; }
.btn-row.split { justify-content: space-between; }
@media (max-width: 560px) {
	.btn-row.actions { flex-direction: column-reverse; align-items: stretch; }
	.btn-row.actions .btn { width: 100%; }
}

.spinner { width: 15px; height: 15px; border-radius: 999px; border: 2px solid currentColor; border-top-color: transparent; animation: spin 0.7s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- pills / chips ---------- */
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface-3); color: var(--fg-muted); white-space: nowrap; }
.pill-blue { background: var(--accent-soft); border-color: var(--accent-border); color: var(--accent); }
.pill-gold { background: var(--gold-soft); border-color: var(--gold-border); color: hsl(39 86% 28%); }
.pill-green { background: var(--green-soft); border-color: var(--green-border); color: hsl(170 66% 20%); }
.pill-red { background: var(--red-soft); border-color: var(--red-border); color: var(--red); }
.pill-lav { background: var(--lavender-soft); border-color: var(--lavender); color: var(--lavender); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .pill-gold { color: var(--gold); } :root:not([data-theme="light"]) .pill-green { color: var(--green); } }
:root[data-theme="dark"] .pill-gold { color: var(--gold); }
:root[data-theme="dark"] .pill-green { color: var(--green); }
.pill-row { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }

/* "proposal" marker for unconfirmed implementation detail */
.proposal {
	display: inline-flex; align-items: center; gap: 4px;
	font-size: 10.5px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase;
	padding: 2px 7px; border-radius: 4px;
	background: var(--lavender-soft); color: var(--lavender);
	border: 1px dashed var(--lavender);
	vertical-align: middle;
}

/* ---------- notices ---------- */
.notice { display: flex; gap: 11px; padding: 14px 16px; border-radius: var(--r-md); border: 1px solid var(--border); background: var(--surface-3); font-size: 14.5px; align-items: flex-start; }
.notice-ico { flex: none; width: 20px; height: 20px; margin-top: 1px; }
.notice-gold { background: var(--gold-soft); border-color: var(--gold-border); }
.notice-blue { background: var(--accent-soft); border-color: var(--accent-border); }
.notice-green { background: var(--green-soft); border-color: var(--green-border); }
.notice-red { background: var(--red-soft); border-color: var(--red-border); }
.notice b { font-weight: 700; }
.notice-body { min-width: 0; }

/* ---------- forms ---------- */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field-label { font-size: 13.5px; font-weight: 600; color: var(--fg); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.field-hint { font-size: 12.5px; color: var(--fg-faint); }
.input, .textarea, .select {
	width: 100%; background: var(--surface); color: var(--fg);
	border: 1px solid var(--border-strong); border-radius: var(--r-sm);
	padding: 11px 13px; font-size: 15px; font-family: var(--font-body);
	transition: border-color 0.15s ease, box-shadow 0.15s ease;
}
.input:focus, .textarea:focus, .select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--ring); }
.textarea { min-height: 128px; resize: vertical; line-height: 1.55; }
.input[aria-invalid="true"], .textarea[aria-invalid="true"] { border-color: var(--red); }
.input[aria-invalid="true"]:focus, .textarea[aria-invalid="true"]:focus { box-shadow: 0 0 0 3px hsl(349 83% 47% / 0.25); }
.input:disabled, .select:disabled { background: var(--surface-3); color: var(--fg-muted); cursor: not-allowed; }
.err { font-size: 12.5px; color: var(--red); font-weight: 600; display: flex; gap: 5px; align-items: center; }
.err[hidden] { display: none !important; }
.counter { font-size: 12px; color: var(--fg-faint); font-variant-numeric: tabular-nums; }
.counter.over { color: var(--red); font-weight: 600; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 620px) { .grid-2 { grid-template-columns: 1fr; } }

.locked {
	display: flex; align-items: center; gap: 10px;
	background: var(--surface-3); border: 1px solid var(--border);
	border-radius: var(--r-sm); padding: 11px 13px; font-size: 15px; color: var(--fg);
}
.locked-ico { flex: none; color: var(--fg-faint); }
.locked-val { min-width: 0; overflow-wrap: anywhere; }

.check { display: flex; gap: 12px; align-items: flex-start; cursor: pointer; padding: 14px; border: 1px solid var(--border); border-radius: var(--r-md); background: var(--surface); transition: border-color 0.15s ease, background-color 0.15s ease; }
.check:hover { border-color: var(--border-strong); }
.check.is-on { border-color: var(--accent); background: var(--accent-soft); }
.check input { margin: 0; width: 19px; height: 19px; flex: none; accent-color: var(--accent); margin-top: 2px; cursor: pointer; }
.check-body { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.check-title { font-weight: 600; font-size: 15px; font-family: var(--font-display); }
.check-sub { font-size: 13.5px; color: var(--fg-muted); line-height: 1.5; }

.radio-card { display: flex; gap: 12px; align-items: flex-start; cursor: pointer; padding: 16px; border: 1px solid var(--border); border-radius: var(--r-md); background: var(--surface); transition: border-color 0.15s ease, background-color 0.15s ease; }
.radio-card:hover { border-color: var(--border-strong); }
.radio-card.is-on { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 1px var(--accent); }
.radio-card input { margin: 0; width: 18px; height: 18px; flex: none; accent-color: var(--accent); margin-top: 3px; cursor: pointer; }

/* ---------- choose a path ---------- */
.selected-candidate {
	display: flex; align-items: center; gap: 12px;
	background: var(--surface); border: 1px solid var(--border);
	border-radius: var(--r-md); padding: 12px 16px;
}
.selected-mark {
	width: 40px; height: 40px; flex: none; border-radius: 999px;
	display: grid; place-items: center;
	font-family: var(--font-display); font-weight: 600; font-size: 14px; color: #fff;
	background: linear-gradient(145deg, var(--navy-3), var(--navy-2));
}
.selected-id { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.selected-name { font-family: var(--font-display); font-weight: 600; font-size: 16px; }
.selected-meta { font-size: 13.5px; color: var(--fg-muted); overflow-wrap: anywhere; }

.choice-card { padding: 18px; }
.choice-card .check-body { gap: 6px; }
.choice-card .check-title { font-size: 17px; }
.choice-who { font-size: 14px; font-weight: 600; color: var(--accent); }
.choice-card.is-on .choice-who { color: var(--accent); }
.choice-steps {
	list-style: none; margin: 8px 0 0; padding: 0;
	display: flex; flex-wrap: wrap; gap: 7px 10px;
}
.choice-steps li {
	display: flex; align-items: center; gap: 6px;
	font-size: 13px; color: var(--fg-muted);
	background: var(--surface-3); border: 1px solid var(--border);
	border-radius: 999px; padding: 4px 11px 4px 5px;
}
.choice-card.is-on .choice-steps li { background: var(--surface); border-color: var(--accent-border); }
.choice-step-n {
	width: 18px; height: 18px; flex: none; border-radius: 999px;
	display: grid; place-items: center;
	font-size: 11px; font-weight: 700; font-family: var(--font-display);
	background: var(--accent); color: var(--on-accent);
}

/* ---------- account screen ---------- */
.auth-grid { display: grid; grid-template-columns: 1fr; gap: 20px; align-items: start; }
@media (min-width: 900px) {
	.auth-grid { grid-template-columns: minmax(260px, 340px) minmax(0, 1fr); gap: 28px; }
	.auth-summary { position: sticky; top: calc(var(--rail-h) + 24px); }
}
.auth-summary { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

.auth-preview { display: flex; flex-direction: column; gap: 14px; }
.auth-person { display: flex; gap: 12px; align-items: center; min-width: 0; }
.auth-mark {
	width: 46px; height: 46px; flex: none; border-radius: 999px;
	display: grid; place-items: center; color: #fff;
	font-family: var(--font-display); font-weight: 600; font-size: 16px;
	background: linear-gradient(145deg, var(--navy-3), var(--navy-2));
}
.auth-person-id { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.auth-person-name { font-family: var(--font-display); font-weight: 600; font-size: 17px; }
.auth-person-office { font-size: 13.5px; color: var(--fg-muted); overflow-wrap: anywhere; line-height: 1.4; }
.auth-facts { margin: 0; display: flex; flex-direction: column; gap: 10px; padding-top: 12px; border-top: 1px solid var(--border); }
.auth-facts > div { display: flex; gap: 12px; align-items: center; justify-content: space-between; }
.auth-facts dt { font-size: 13px; color: var(--fg-faint); }
.auth-facts dd { margin: 0; font-size: 14px; font-weight: 600; text-align: right; }

.auth-next { display: flex; flex-direction: column; gap: 12px; }
.next-steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 11px; counter-reset: n; }
.next-steps li { display: flex; gap: 10px; align-items: flex-start; font-size: 14.5px; min-width: 0; }
.next-n {
	width: 22px; height: 22px; flex: none; border-radius: 999px;
	display: grid; place-items: center;
	font-family: var(--font-display); font-size: 12px; font-weight: 700;
	background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent-border);
}

.auth-form { min-width: 0; }
.sso-btn { gap: 10px; }
.sso-mark {
	width: 20px; height: 20px; flex: none; border-radius: 999px;
	display: grid; place-items: center;
	font-family: var(--font-display); font-weight: 700; font-size: 12px;
	background: var(--surface-3); color: var(--fg); border: 1px solid var(--border-strong);
}
.or-rule { display: flex; align-items: center; gap: 12px; color: var(--fg-faint); font-size: 13px; }
.or-rule::before, .or-rule::after { content: ""; height: 1px; background: var(--border); flex: 1; }

.pw-wrap { position: relative; }
.pw-wrap .input { padding-right: 46px; }
.pw-toggle {
	position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
	background: transparent; border: none; cursor: pointer; color: var(--fg-faint);
	width: 34px; height: 34px; display: grid; place-items: center; border-radius: 6px;
}
.pw-toggle:hover { color: var(--fg); background: var(--surface-3); }
.auth-forgot { font-size: 13px; margin-top: 2px; }
.terms-check { align-items: center; }
.terms-check .check-sub { color: var(--fg); }
.auth-switch { text-align: center; font-size: 14px; color: var(--fg-muted); }
.link-btn {
	background: none; border: none; padding: 0; cursor: pointer;
	color: var(--accent); font-weight: 600; font-size: inherit; text-decoration: underline;
	text-underline-offset: 3px;
}
.link-btn:hover { text-decoration: none; }

/* ---------- profile editor ---------- */
.edit-grid { display: grid; grid-template-columns: 1fr; gap: 20px; align-items: start; }
@media (min-width: 940px) {
	.edit-grid { grid-template-columns: minmax(250px, 310px) minmax(0, 1fr); gap: 28px; }
	.edit-side { position: sticky; top: calc(var(--rail-h) + 20px); }
}
.edit-side { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.edit-main { display: flex; flex-direction: column; gap: 20px; min-width: 0; }

.edit-person { display: flex; flex-direction: column; gap: 10px; }
.edit-district { font-size: 13.5px; color: var(--fg-muted); line-height: 1.4; }
.edit-status { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding-top: 12px; border-top: 1px solid var(--border); }

.edit-progress { display: flex; flex-direction: column; gap: 12px; }
.prog-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.prog-head .faint { font-variant-numeric: tabular-nums; }
.prog-bar { height: 6px; border-radius: 999px; background: var(--surface-3); overflow: hidden; }
.prog-bar span { display: block; height: 100%; border-radius: 999px; background: var(--accent); transition: width 0.35s var(--ease-smooth, cubic-bezier(0.165,0.84,0.44,1)); }
.prog-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.prog-row { display: flex; align-items: center; gap: 9px; font-size: 14px; color: var(--fg-faint); }
.prog-row.is-on { color: var(--fg); font-weight: 600; }
.prog-tick {
	width: 19px; height: 19px; flex: none; border-radius: 999px;
	display: grid; place-items: center;
	border: 1.5px solid var(--border-strong); background: var(--surface);
	color: #fff;
}
.prog-row.is-on .prog-tick { background: var(--green); border-color: var(--green); }
.save-state { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--fg-faint); padding-top: 10px; border-top: 1px solid var(--border); }
.save-state svg { flex: none; }
.spinner-xs { width: 11px; height: 11px; border-width: 1.5px; }

.edit-locked { display: flex; flex-direction: column; gap: 12px; }
.locked-list { margin: 0; display: flex; flex-direction: column; gap: 10px; }
.locked-list > div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.locked-list dt { font-size: 12px; color: var(--fg-faint); }
.locked-list dd { margin: 0; font-size: 13.5px; display: flex; align-items: flex-start; gap: 6px; min-width: 0; overflow-wrap: anywhere; }
.locked-list dd svg { flex: none; color: var(--fg-faint); margin-top: 3px; }

.edit-section { display: flex; flex-direction: column; gap: 14px; }
.section-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.public-chip { font-weight: 600; }
.section-guide { font-size: 14.5px; line-height: 1.55; max-width: 62ch; }
.textarea-lg { min-height: 170px; }
.textarea-sm { min-height: 84px; }

.issue-list-edit { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }
.issue-row {
	display: flex; flex-direction: column; gap: 12px;
	border: 1px solid var(--border); border-radius: var(--r-md);
	padding: 16px; background: var(--surface-2); min-width: 0;
}
.issue-row-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.issue-n { font-family: var(--font-display); font-size: 13px; font-weight: 600; color: var(--fg-faint); letter-spacing: 0.04em; text-transform: uppercase; }
.issue-remove {
	display: inline-flex; align-items: center; gap: 5px;
	background: transparent; border: none; cursor: pointer;
	color: var(--fg-faint); font-size: 13px; font-weight: 600;
	padding: 4px 8px; border-radius: 6px;
}
.issue-remove:hover { color: var(--red); background: var(--red-soft); }
.issue-add { display: flex; }
.issue-position { color: var(--fg-muted); font-size: 15px; }
.edit-actions { padding-top: 4px; }

/* ---------- pledge ---------- */
.claiming-chip {
	display: flex; align-items: center; gap: 11px;
	background: var(--surface); border: 1px solid var(--border);
	border-radius: var(--r-md); padding: 10px 14px;
}
.claiming-mark {
	width: 36px; height: 36px; flex: none; border-radius: 999px;
	display: grid; place-items: center; color: #fff;
	font-family: var(--font-display); font-weight: 600; font-size: 13px;
	background: linear-gradient(145deg, var(--navy-3), var(--navy-2));
}
.claiming-id { min-width: 0; display: flex; flex-direction: column; }
.claiming-name { font-family: var(--font-display); font-weight: 600; font-size: 15px; }
.claiming-meta { font-size: 12.5px; color: var(--fg-muted); overflow-wrap: anywhere; }

.pledge-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; }
.pledge-card {
	display: flex; flex-direction: column; gap: 9px; align-items: flex-start;
	background: var(--surface); border: 1px solid var(--border);
	border-radius: var(--r-lg); padding: 20px; min-width: 0;
}
.pledge-card .muted { font-size: 14px; }

.full-pledge { padding: 0; overflow: hidden; }
.disclosure {
	width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px;
	background: transparent; border: none; cursor: pointer; padding: 16px 20px;
	font-family: var(--font-display); font-weight: 600; font-size: 15px; color: var(--fg); text-align: left;
}
.disclosure:hover { background: var(--surface-3); }
.disclosure-label { display: inline-flex; align-items: center; gap: 9px; }
.disclosure-chev { display: grid; place-items: center; color: var(--fg-faint); transform: rotate(90deg); transition: transform 0.2s ease; }
.disclosure-chev.is-open { transform: rotate(-90deg); }
.disclosure-body { padding: 0 20px 20px; display: flex; flex-direction: column; gap: 16px; border-top: 1px solid var(--border); padding-top: 18px; }
.full-pillar { display: flex; flex-direction: column; gap: 7px; }
.full-pillar-title { display: flex; align-items: center; gap: 9px; font-family: var(--font-display); font-size: 16px; font-weight: 600; margin: 0; }
.full-pillar p { font-size: 15px; line-height: 1.6; color: var(--fg-muted); }

.heart-star { flex: none; display: block; }
.full-pledge-head { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
.mark-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.eligibility { background: var(--green-soft); border-color: var(--green-border); }
.agree-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.agree-list li { display: flex; gap: 9px; align-items: flex-start; font-size: 14.5px; }
.agree-list svg { flex: none; color: var(--green); margin-top: 3px; }
.agree-check { align-items: center; }
.agree-check .check-sub { color: var(--fg); font-weight: 500; }

/* ---------- verification ---------- */
.verify-summary { display: flex; flex-direction: column; gap: 14px; }
.verify-summary .auth-facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px 24px; }
.verify-summary .auth-facts > div { flex-direction: column; align-items: flex-start; gap: 3px; justify-content: flex-start; }
.verify-summary .auth-facts dd { text-align: left; }
.sim-box {
	border: 1.5px dashed var(--lavender); border-radius: var(--r-md);
	background: var(--lavender-soft); padding: 14px 16px;
	display: flex; flex-direction: column; gap: 9px;
}
.sim-title { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--lavender); }
.sim-sub { font-size: 13px; color: var(--fg-muted); }
.sim-row { display: flex; flex-wrap: wrap; gap: 7px; }
.sim-btn {
	background: var(--surface); border: 1px solid var(--border-strong); border-radius: 999px;
	padding: 6px 13px; font-size: 13px; font-weight: 600; color: var(--fg-muted); cursor: pointer;
	transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
}
.sim-btn:hover { border-color: var(--fg-faint); color: var(--fg); }
.sim-btn.is-on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

/* ---------- review and publish ---------- */
.review-frame { overflow: hidden; }
.review-bar {
	display: flex; align-items: center; gap: 9px; flex-wrap: wrap;
	padding: 11px 18px; background: var(--surface-3); border-bottom: 1px solid var(--border);
}
.review-bar-label { font-size: 13px; font-weight: 600; }
.review-url { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: var(--fg-faint); overflow-wrap: anywhere; }
.review-bar-pill { margin-left: auto; }
.review-hero {
	display: flex; gap: 16px; align-items: center; flex-wrap: wrap;
	padding: clamp(18px, 3vw, 26px); background: var(--navy); color: var(--on-navy);
}
.review-avatar {
	width: 62px; height: 62px; flex: none; border-radius: 999px;
	display: grid; place-items: center; color: #fff;
	font-family: var(--font-display); font-weight: 600; font-size: 20px;
	background: linear-gradient(145deg, var(--navy-3), var(--navy-2));
	border: 2px solid hsl(0 0% 100% / 0.22);
}
.review-hero-text { min-width: 0; }
.review-office { font-family: var(--font-display); font-weight: 500; font-size: 15px; }
.review-district { font-size: 13.5px; color: var(--on-navy-muted); }
.review-callout-wrap { background: var(--navy); padding: 0 clamp(18px, 3vw, 26px) clamp(18px, 3vw, 26px); }
.review-callout { font-size: 14px; }
.review-body { padding: clamp(18px, 3vw, 26px); display: flex; flex-direction: column; gap: 22px; }
.review-section { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
.review-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.url-code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; overflow-wrap: anywhere; }

/* ---------- voter ---------- */
.voter-card { display: flex; flex-direction: column; gap: 13px; }
.voter-card-tags { display: flex; flex-wrap: wrap; gap: 7px; padding-top: 12px; border-top: 1px solid var(--border); }
.missing-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 9px; }
.missing-list li { display: flex; gap: 10px; align-items: center; font-size: 15px; color: var(--fg-muted); }
.missing-list svg { flex: none; color: var(--red); }
.quoted {
	margin: 0; padding: 14px 16px; border-left: 3px solid var(--accent);
	background: var(--surface-2); border-radius: 0 var(--r-sm) var(--r-sm) 0;
	font-size: 15px; line-height: 1.6; font-style: italic; overflow-wrap: anywhere;
}

/* ---------- prototype panel ---------- */
#protoFab {
	position: fixed; z-index: 70;
	right: max(16px, env(safe-area-inset-right, 0px));
	bottom: calc(16px + env(safe-area-inset-bottom, 0px));
	display: inline-flex; align-items: center; gap: 8px;
	background: var(--lavender); color: #fff; border: none; cursor: pointer;
	border-radius: 999px; padding: 11px 18px; box-shadow: var(--shadow-lg);
	font-family: var(--font-body); font-size: 13.5px; font-weight: 700;
}
#protoFab:hover { filter: brightness(1.08); }
#protoFab.is-open { background: var(--navy-2); }
#protoPanel {
	position: fixed; z-index: 71;
	right: max(16px, env(safe-area-inset-right, 0px));
	left: max(16px, env(safe-area-inset-left, 0px));
	bottom: calc(68px + env(safe-area-inset-bottom, 0px));
	margin-left: auto; max-width: 340px;
	max-height: min(76vh, 620px); overflow-y: auto;
	background: var(--surface); border: 1px solid var(--border-strong);
	border-radius: var(--r-lg); box-shadow: var(--shadow-lg);
}
.pp-head { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; padding: 15px 16px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--surface); }
.pp-title { font-family: var(--font-display); font-weight: 600; font-size: 15px; }
.pp-sub { font-size: 12px; color: var(--fg-faint); line-height: 1.4; margin-top: 2px; }
.pp-close { background: transparent; border: none; cursor: pointer; color: var(--fg-faint); padding: 2px; border-radius: 5px; flex: none; }
.pp-close:hover { color: var(--fg); background: var(--surface-3); }
.pp-body { padding: 15px 16px; display: flex; flex-direction: column; gap: 15px; }
.pp-label { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--fg-faint); margin-bottom: 7px; }
.pp-screens { display: flex; flex-direction: column; gap: 4px; }
.pp-screen {
	text-align: left; background: transparent; border: 1px solid transparent; cursor: pointer;
	border-radius: var(--r-sm); padding: 7px 10px; font-size: 13.5px; color: var(--fg-muted);
}
.pp-screen:hover { background: var(--surface-3); color: var(--fg); }
.pp-screen.is-on { background: var(--accent-soft); border-color: var(--accent-border); color: var(--accent); font-weight: 600; }
.pp-row { display: flex; flex-wrap: wrap; gap: 6px; }
.pp-group .sim-btn { font-size: 12px; padding: 5px 11px; }
.pp-reset { width: 100%; }

/* ---------- tabs ---------- */
.tabs { display: flex; gap: 4px; background: var(--surface-3); padding: 4px; border-radius: 999px; width: fit-content; max-width: 100%; }
.tab { border: none; background: transparent; border-radius: 999px; padding: 9px 20px; font-size: 14px; font-weight: 600; color: var(--fg-muted); cursor: pointer; transition: background-color 0.18s ease, color 0.18s ease; }
.tab.is-on { background: var(--surface); color: var(--fg); box-shadow: var(--shadow-sm); }

/* ---------- profile page ---------- */
/* The page itself is the cream band; the hero and the cards sit on it. */
.profile-page { padding-block: 0 72px; }

.hero {
	position: relative;
	z-index: 2;
	background: var(--navy);
	color: var(--on-navy);
	border-radius: 0 0 var(--r-xl) var(--r-xl);
	margin-left: calc(max(16px, env(safe-area-inset-left, 0px)) * -1);
	margin-right: calc(max(16px, env(safe-area-inset-right, 0px)) * -1);
	overflow: hidden;
}
.hero::after {
	content: "";
	position: absolute; inset: 0;
	background: radial-gradient(ellipse 70% 80% at 50% 118%, hsl(220 58% 35% / 0.9) 0%, transparent 72%);
	pointer-events: none;
}
.hero-inner {
	position: relative; z-index: 1;
	max-width: 1180px; margin: 0 auto;
	display: flex; gap: clamp(18px, 4vw, 48px); align-items: center; flex-wrap: wrap;
	padding-left: max(16px, env(safe-area-inset-left, 0px));
	padding-right: max(16px, env(safe-area-inset-right, 0px));
	padding-block: clamp(24px, 3vw, 36px);
}
.hero-avatar {
	width: clamp(104px, 20vw, 190px); height: clamp(104px, 20vw, 190px);
	border-radius: 999px; flex: none; display: grid; place-items: center;
	font-family: var(--font-display); font-size: clamp(34px, 6vw, 60px); font-weight: 600;
	background: linear-gradient(150deg, var(--navy-3), var(--navy-2));
	border: 3px solid hsl(0 0% 100% / 0.22);
}
.hero-avatar.has-photo { background: linear-gradient(150deg, var(--gold), hsl(36 90% 56%)); color: var(--navy); border-color: hsl(0 0% 100% / 0.4); }
.hero-text { min-width: 0; flex: 1 1 300px; display: flex; flex-direction: column; gap: 20px; }
.hero-tag {
	display: inline-flex; align-items: center; border-radius: 6px;
	padding: 4px 10px; font-size: 13.5px; font-weight: 500;
	background: var(--gold-soft); color: var(--gold-fg); border: 1px solid var(--gold-border);
}
.hero-name-office { display: flex; flex-direction: column; gap: 3px; }
.hero-name { font-size: clamp(30px, 5.5vw, 50px); line-height: 1.15; }
.hero-office { font-family: var(--font-display); font-weight: 500; font-size: clamp(17px, 2.4vw, 22px); line-height: 1.45; }
.hero-district { font-size: clamp(15px, 1.8vw, 17px); color: var(--on-navy-muted); line-height: 1.45; }
.hero-callout {
	display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
	border: 1px solid hsl(0 0% 100% / 0.22); background: hsl(0 0% 100% / 0.07);
	border-radius: var(--r-sm); padding: 14px 16px; font-size: 15px; line-height: 1.5;
}
.hero-callout span:last-child { min-width: 0; flex: 1 1 220px; }
.hero-callout-mark { flex: none; width: 34px; height: 34px; display: grid; place-items: center; }

/* Content well: sticky sidebar, then a column of separate white cards. */
.profile-grid {
	max-width: 1180px; margin: 0 auto;
	display: grid; grid-template-columns: 1fr; gap: 24px;
	padding-block: 28px 0;
}
@media (min-width: 1000px) {
	.profile-grid { grid-template-columns: minmax(280px, 360px) minmax(0, 1fr); gap: 40px; align-items: start; }
	.profile-side { position: sticky; top: calc(var(--rail-h) + 24px); }
}
.profile-column { display: flex; flex-direction: column; gap: 24px; min-width: 0; }

.side-card {
	margin: 0; background: var(--surface); border: 1px solid var(--border);
	border-radius: var(--r-lg); padding: 24px;
	display: flex; flex-direction: column; gap: 20px;
}
.side-block { display: flex; flex-direction: column; gap: 6px; }
.side-label { font-family: var(--font-display); font-weight: 600; font-size: 16px; color: var(--fg); }
.side-value { margin: 0; display: flex; align-items: center; gap: 9px; font-size: 15px; color: var(--fg-muted); min-width: 0; }
.side-value svg { flex: none; color: var(--fg-faint); }
.side-value span { min-width: 0; overflow-wrap: anywhere; }

.profile-card { padding: 0; }
.profile-section { padding: 24px; display: flex; flex-direction: column; gap: 12px; }
.profile-section + .profile-section { border-top: 1px solid var(--border); }
.section-heading { font-size: clamp(24px, 3.4vw, 32px); line-height: 1.35; }
.section-subheading { font-size: clamp(20px, 2.6vw, 24px); line-height: 1.35; }

.placeholder-prompt { color: var(--fg-faint); font-style: italic; font-size: 16px; }
.authored-text { white-space: pre-wrap; font-size: 16px; line-height: 1.6; }
.authored-disclaimer { font-size: 12px; line-height: 1.35; color: var(--fg-faint); margin-top: 4px; }

.issue-list, .experience-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 11px; }
.issue-list li, .experience-list li { display: flex; gap: 10px; align-items: flex-start; font-size: 16px; min-width: 0; }
.issue-list svg { flex: none; color: var(--green); margin-top: 3px; }
.experience-list svg { flex: none; color: var(--fg-faint); margin-top: 3px; }
.experience-list span { min-width: 0; }

/* The claim callout: the live profile's gradient card, first in the column. */
.claim-card {
	display: flex; flex-direction: column; gap: 20px;
	border-radius: var(--r-xl); padding: clamp(22px, 4vw, 44px);
	background: radial-gradient(ellipse 139% 115% at 50% 0%, var(--claim-g1) 0%, var(--claim-g2) 50%, var(--claim-g3) 100%);
	border: 1px solid var(--claim-border);
	color: var(--claim-fg);
}
.claim-text { display: flex; flex-direction: column; gap: 14px; }
.claim-body { font-size: 16px; line-height: 1.5; }
.claim-cta { width: 100%; }
@media (min-width: 620px) { .claim-cta { width: fit-content; } }

.issue-chip { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; background: var(--accent-soft); border: 1px solid var(--accent-border); font-size: 14px; font-weight: 600; color: var(--fg); }
.issue-chip button { background: transparent; border: none; cursor: pointer; color: var(--fg-muted); display: grid; place-items: center; padding: 0; width: 16px; height: 16px; border-radius: 999px; }
.issue-chip button:hover { color: var(--red); }

.pledge-pillar { display: flex; gap: 14px; align-items: flex-start; padding: 16px; border-radius: var(--r-md); border: 1px solid var(--border); background: var(--surface); }
.pillar-ico { flex: none; width: 42px; height: 42px; border-radius: 999px; display: grid; place-items: center; }

.summary-row { display: flex; gap: 14px; justify-content: space-between; align-items: flex-start; padding: 13px 0; border-bottom: 1px solid var(--border); }
.summary-row:last-child { border-bottom: none; }
.summary-k { font-size: 13px; color: var(--fg-faint); flex: none; width: 128px; }
.summary-v { min-width: 0; flex: 1; font-size: 14.5px; overflow-wrap: anywhere; }

.ok-mark { width: 64px; height: 64px; border-radius: 999px; display: grid; place-items: center; background: var(--green-soft); border: 2px solid var(--green-border); color: var(--green); animation: pop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
@keyframes pop { from { transform: scale(0.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }

.skel { background: linear-gradient(90deg, var(--surface-3) 25%, var(--border) 50%, var(--surface-3) 75%); background-size: 200% 100%; animation: shim 1.4s ease-in-out infinite; border-radius: 6px; }
@keyframes shim { from { background-position: 200% 0; } to { background-position: -200% 0; } }

.divider { height: 1px; background: var(--border); border: none; margin: 0; }

.prototype-note {
	display: flex; gap: 10px; align-items: flex-start;
	font-size: 12.5px; color: var(--fg-faint); line-height: 1.5;
	border-top: 1px dashed var(--border-strong); padding-top: 14px; margin-top: 4px;
}

.map-stub { height: 140px; border-radius: var(--r-md); border: 1px solid var(--border); background:
	repeating-linear-gradient(45deg, var(--surface-3) 0 10px, var(--surface-2) 10px 20px); display: grid; place-items: center; color: var(--fg-faint); font-size: 13px; }

.toast {
	position: fixed; left: 50%; transform: translateX(-50%);
	bottom: calc(22px + env(safe-area-inset-bottom, 0px)); z-index: 80;
	background: var(--navy-2); color: #fff; border-radius: 999px;
	padding: 12px 22px; font-size: 14px; font-weight: 600; box-shadow: var(--shadow-lg);
	display: flex; gap: 9px; align-items: center; max-width: calc(100% - 32px);
	animation: toastin 0.3s cubic-bezier(0.165, 0.84, 0.44, 1) both;
}
@keyframes toastin { from { opacity: 0; transform: translate(-50%, 14px); } to { opacity: 1; transform: translate(-50%, 0); } }
</style>

	<span>Prototype</span>

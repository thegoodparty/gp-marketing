name: CI

on:
  pull_request:
    branches-ignore: [master]
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      # submodules: the AGENTS.md check runs a script from the ai-rules submodule.
      - uses: actions/checkout@v5
        with:
          submodules: true
          persist-credentials: false

      - name: Verify AGENTS.md is the source of truth
        run: bash ai-rules/scripts/agents-md-sync.sh --check

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

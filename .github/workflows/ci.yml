name: CI

on:
  pull_request:
    branches-ignore: [master]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Sanity contract tests
        run: bun run test:integration:contracts
        env:
          SANITY_TEST_DATASET: ${{ vars.SANITY_TEST_DATASET || 'production' }}
          # SANITY_TEST_TOKEN is optional — only needed for private datasets.
          SANITY_TEST_TOKEN: ${{ secrets.SANITY_TEST_TOKEN }}

  e2e:
    name: E2E & Visual regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only run when there is a base URL to test against.
    if: vars.E2E_BASE_URL != ''
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      - name: Run page health E2E tests
        run: bun run test:e2e
        env:
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
          SANITY_TEST_DATASET: ${{ vars.SANITY_TEST_DATASET || 'production' }}

      - name: Run visual regression tests
        run: bun run test:e2e:visual
        env:
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
          SANITY_TEST_DATASET: ${{ vars.SANITY_TEST_DATASET || 'production' }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 14

      - name: Upload visual diff artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs-${{ github.run_id }}
          path: |
            test-results/
            e2e/snapshots/
          retention-days: 14

  smoke:
    name: Post-deploy smoke crawl
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only runs on manual dispatch — never on PRs.
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Smoke crawl
        run: bun run smoke ${{ vars.SMOKE_BASE_URL || 'https://goodparty.org' }} --sample 100
        env:
          SMOKE_SAMPLE: ${{ vars.SMOKE_SAMPLE || '100' }}
          SMOKE_CONCURRENCY: ${{ vars.SMOKE_CONCURRENCY || '8' }}

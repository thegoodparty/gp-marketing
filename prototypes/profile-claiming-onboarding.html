<div id="protoPanel" hidden></div>

<script>
(function () {
	'use strict';

	/* ------------------------------------------------------------------ *
	 * Mock data. Jordan Avery is a fictional candidate for this prototype.
	 * The spine fields (name, office, district, affiliation) stand in for
	 * ETL-sourced, read-only data; the overlay fields are what a claimant
	 * would edit. Biography and issue fields start EMPTY on purpose — the
	 * profile is unclaimed and incomplete, and nothing is invented here.
	 * ------------------------------------------------------------------ */
	var SPINE = {
		firstName: 'Jordan',
		lastName: 'Avery',
		fullName: 'Jordan Avery',
		initials: 'JA',
		office: 'U.S. Congress',
		district: "Minnesota's 5th Congressional District",
		districtShort: 'MN-05',
		state: 'Minnesota',
		affiliation: 'Nonpartisan',
		electionDate: 'November 3, 2026',
		seat: 'U.S. House of Representatives',
		level: 'Federal',
		source: 'BallotReady / state filings'
	};

	var PLEDGE_PILLARS = [
		{
			key: 'independent',
			title: 'Independent',
			bg: 'var(--accent-soft)',
			fg: 'var(--accent)',
			icon: 'heart',
			body: 'They run and serve as nonpartisan, independent, or third-party candidates, not as Democrats or Republicans. They don’t accept endorsements from either major party.'
		},
		{
			key: 'people-powered',
			title: 'People-powered',
			bg: 'var(--gold-soft)',
			fg: 'var(--gold)',
			icon: 'users',
			body: 'They raise most of their funding from individuals, not from political action committees (PACs), lobbyists, unions, or corporations. Once elected, they focus on their constituents’ problems, not on themselves or special interests.'
		},
		{
			key: 'anti-corruption',
			title: 'Anti-Corruption',
			bg: 'var(--lavender-soft)',
			fg: 'var(--lavender)',
			icon: 'star',
			body: 'They commit to being open, transparent, and accountable about their donors, positions, and progress. They answer only to the people they serve, and they stay connected and responsive to their constituents.'
		}
	];

	/* The suggested request a voter sends. Editable, but this is the default. */
	var VOTER_DEFAULT_MESSAGE = 'I\u2019d like to learn more about your background, why you\u2019re running, and your priorities for the community. ' +
		'Please complete your GoodParty.org profile.';

	var ISSUE_OPTIONS = [
		'Healthcare costs', 'Housing affordability', 'Public education', 'Climate and energy',
		'Jobs and small business', 'Campaign finance reform', 'Public safety', 'Transit and infrastructure',
		'Veterans', 'Immigration', 'Food and agriculture', 'Broadband access'
	];

	/* ------------------------------------------------------------------ *
	 * State. Held in one object so that moving backward and forward
	 * through the flow never loses what was typed.
	 * ------------------------------------------------------------------ */
	var state = {
		screen: 'profile',
		path: null,
		busy: false,
		/* 'candidate' | 'rep' - who is claiming. Decided on the pledge screen,
		   because a representative cannot pledge on the candidate's behalf. */
		role: null,
		account: { mode: 'signup', firstName: '', lastName: '', email: '', password: '', terms: false, loggedIn: false },
		draft: { why: '', about: '', issues: [], touched: false, saved: false, skipped: false, savedAt: null },
		pledge: { agreed: {}, signature: '', taken: false, takenOn: null, consentRequested: false, fullOpen: false },
		/* status: unverified | pending | approved | more-info */
		verify: { method: null, phone: '', doc: '', submitted: false, status: 'unverified', note: '' },
		publish: { published: false, visitedPreview: false, moderation: false, submittedForReview: false },
		voter: { firstName: '', lastName: '', email: '', message: '', sent: false, sending: false },
		errors: {}
	};

	PLEDGE_PILLARS.forEach(function (p) { state.pledge.agreed[p.key] = false; });
	state.voter.message = VOTER_DEFAULT_MESSAGE;

	/* ------------------------------------------------------------------ *
	 * Icons
	 * ------------------------------------------------------------------ */
	var ICONS = {
		heart: '<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>',
		users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
		star: '<path d="m12 2 3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14l-5-4.87 6.91-1.01L12 2Z"/>',
		check: '<path d="M20 6 9 17l-5-5"/>',
		lock: '<rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
		eye: '<path d="M2 12s3.64-7 10-7 10 7 10 7-3.64 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>',
		eyeOff: '<path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c6.36 0 10 7 10 7a18.5 18.5 0 0 1-2.16 3.19m-6.72 1.67A10.45 10.45 0 0 1 12 19c-6.36 0-10-7-10-7a18.45 18.45 0 0 1 5.06-5.94"/><path d="m2 2 20 20"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>',
		info: '<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>',
		warn: '<path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/><path d="M12 9v4M12 17h.01"/>',
		alert: '<circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/>',
		user: '<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
		vote: '<path d="m9 12 2 2 4-4"/><path d="M5 7c0-1.1.9-2 2-2h10a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2Z"/>',
		arrow: '<path d="M5 12h14M12 5l7 7-7 7"/>',
		back: '<path d="M19 12H5M12 19l-7-7 7-7"/>',
		ext: '<path d="M7 17 17 7M7 7h10v10"/>',
		mail: '<rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>',
		phone: '<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.1 9.9a16 16 0 0 0 6 6l1.26-1.26a2 2 0 0 1 2.11-.45c.9.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92Z"/>',
		id: '<rect width="18" height="14" x="3" y="5" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M14 10h4M14 14h2M5 17c.5-1.5 2-2 4-2s3.5.5 4 2"/>',
		doc: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/>',
		pencil: '<path d="M17 3a2.83 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>',
		send: '<path d="M22 2 11 13M22 2l-7 20-4-9-9-4Z"/>',
		clock: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
		globe: '<circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10Z"/>',
		pin: '<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>',
		plus: '<path d="M12 5v14M5 12h14"/>',
		x: '<path d="M18 6 6 18M6 6l12 12"/>',
		save: '<path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/><path d="M17 21v-8H7v8M7 3v5h8"/>',
		shield: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/><path d="m9 12 2 2 4-4"/>',
		calendar: '<rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
		flag: '<path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1Z"/><path d="M4 22v-7"/>',
		briefcase: '<rect width="20" height="14" x="2" y="7" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>',
		building: '<rect width="16" height="20" x="4" y="2" rx="2"/><path d="M9 22v-4h6v4M8 6h.01M16 6h.01M8 10h.01M16 10h.01M8 14h.01M16 14h.01"/>',
		key: '<circle cx="7.5" cy="15.5" r="4.5"/><path d="m21 2-9.6 9.6M15.5 7.5l3 3L22 7l-3-3"/>'
	};

	function icon(name, size, cls) {
		var d = ICONS[name] || '';
		var s = size || 18;
		return '<svg class="' + (cls || '') + '" width="' + s + '" height="' + s + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
			'stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + d + '</svg>';
	}

	/* The Heart & Star: GoodParty.org's pledge mark. A red heart outline with
	   a solid blue star, as the live pledge explainer draws it. */
	function heartStar(size) {
		var s = size || 48;
		return '<svg class="heart-star" width="' + s + '" height="' + s + '" viewBox="0 0 24 24" fill="none" aria-hidden="true">' +
			'<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z" ' +
				'stroke="var(--gp-red)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>' +
			'<path d="M12 6 12.86 8.42 15.43 8.49 13.39 10.05 14.12 12.51 12 11.06 9.88 12.51 10.61 10.05 8.57 8.49 11.14 8.42Z" fill="var(--gp-blue)"/>' +
		'</svg>';
	}

	function esc(s) {
		return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
			return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
		});
	}

	/* ------------------------------------------------------------------ *
	 * Routing. The screen name lives in the hash so the browser's own back
	 * and forward buttons work; everything the user typed lives in `state`,
	 * so moving between screens never loses it.
	 * ------------------------------------------------------------------ */
	var SCREENS = {};
	var VALID = ['profile', 'path', 'account', 'edit', 'pledge', 'verify', 'preview', 'done', 'voter-review', 'voter-confirm', 'voter-sent'];

	function go(name) {
		if (location.hash.slice(1) === name) { render(); return; }
		location.hash = name;
	}

	function current() {
		var h = location.hash.slice(1);
		return VALID.indexOf(h) >= 0 ? h : 'profile';
	}

	window.addEventListener('hashchange', function () {
		state.screen = current();
		render();
		window.scrollTo({ top: 0, behavior: 'instant' in document.documentElement.style ? 'instant' : 'auto' });
	});

	/* ---------------- derived status ---------------- */

	/* The two gates on publishing, kept separate on purpose: a recorded pledge
	   is not authorization, and neither is a finished profile. */
	function pledgeSatisfied() {
		return state.pledge.taken || state.role === 'rep';
	}

	function accessVerified() {
		return state.verify.status === 'approved';
	}

	function canPublish() {
		return pledgeSatisfied() && accessVerified();
	}

	function verifyStatusMeta() {
		switch (state.verify.status) {
			case 'approved': return { label: 'Verified', cls: 'pill-green', icon: 'check' };
			case 'pending': return { label: 'In review', cls: 'pill-gold', icon: 'clock' };
			case 'more-info': return { label: 'More information needed', cls: 'pill-red', icon: 'alert' };
			default: return { label: 'Not verified', cls: 'pill-red', icon: 'alert' };
		}
	}

	function profileStatus() {
		if (state.publish.published) return { label: 'Claimed', cls: 'is-live' };
		if (state.pledge.taken || state.draft.saved || state.draft.touched || state.account.loggedIn) return { label: 'Draft — private', cls: 'is-draft' };
		return { label: 'Unclaimed', cls: '' };
	}

	var LIMITS = { why: 1000, about: 1500, issueTitle: 70, issuePosition: 300 };
	var MAX_ISSUES = 6;

	/* An issue row counts only once it has a title; rows left entirely blank
	   are dropped on save rather than nagged about. */
	function filledIssues() {
		return state.draft.issues.filter(function (i) { return i.title.trim(); });
	}

	function issueRowIsBlank(i) {
		return !i.title.trim() && !i.position.trim();
	}

	/* Three sections, each either added or not. Nothing here is required. */
	function sectionsAdded() {
		return [!!state.draft.why.trim(), filledIssues().length > 0, !!state.draft.about.trim()];
	}

	function addedCount() {
		return sectionsAdded().filter(Boolean).length;
	}

	function newIssue() {
		return { id: 'iss-' + (Date.now().toString(36)) + Math.random().toString(36).slice(2, 6), title: '', position: '' };
	}

	/* ---------------- chrome ---------------- */

	function updateRail() {
		var st = profileStatus();
		var el = document.getElementById('railStatus');
		el.textContent = st.label;
		el.className = 'rail-status ' + st.cls;
		var mark = document.getElementById('railMark');
		mark.textContent = SPINE.initials;
	}

	var CANDIDATE_STEPS = [
		{ id: 'account', label: 'Account' },
		{ id: 'edit', label: 'Profile' },
		{ id: 'pledge', label: 'Pledge' },
		{ id: 'verify', label: 'Verify' },
		{ id: 'preview', label: 'Publish' }
	];
	var VOTER_STEPS = [
		{ id: 'voter-review', label: 'Your request' },
		{ id: 'voter-confirm', label: 'Review and send' },
		{ id: 'voter-sent', label: 'Confirmation' }
	];

	function renderSteps() {
		var host = document.getElementById('stepBar');
		var scr = state.screen;
		var steps = null;
		if (CANDIDATE_STEPS.some(function (s) { return s.id === scr; }) || (scr === 'done' && state.path === 'candidate')) {
			steps = CANDIDATE_STEPS;
		} else if (VOTER_STEPS.some(function (s) { return s.id === scr; })) {
			steps = VOTER_STEPS;
		}
		if (!steps) { host.innerHTML = ''; return; }

		var activeIdx = steps.map(function (s) { return s.id; }).indexOf(scr);
		if (scr === 'done') activeIdx = steps.length;

		var html = steps.map(function (s, i) {
			var done = i < activeIdx;
			var active = i === activeIdx;
			var cls = 'step' + (active ? ' is-active' : done ? ' is-done' : '');
			var dot = done ? icon('check', 12) : String(i + 1);
			return '<div class="' + cls + '"><span class="step-dot">' + dot + '</span><span class="step-label">' + esc(s.label) + '</span></div>' +
				(i < steps.length - 1 ? '<span class="step-sep"></span>' : '');
		}).join('');

		host.innerHTML = '<nav class="steps" aria-label="Progress"><div class="steps-inner">' + html + '</div></nav>';
	}

	var toastTimer = null;
	function toast(msg, ico) {
		var host = document.getElementById('toastHost');
		host.innerHTML = '<div class="toast" role="status">' + icon(ico || 'check', 16) + '<span>' + esc(msg) + '</span></div>';
		clearTimeout(toastTimer);
		toastTimer = setTimeout(function () { host.innerHTML = ''; }, 3200);
	}

	function protoNote(text) {
		return '<p class="prototype-note">' + icon('info', 14) + '<span>' + text + '</span></p>';
	}

	/* ---------------- shared partials ---------------- */

	/* ------------------------------------------------------------------ *
	 * The public profile, rebuilt against the live /people/* page:
	 * a midnight hero band with the portrait straddling its lower edge,
	 * then a two-column content well — sticky sidebar on the left, a
	 * column of separate white cards on the right with the cream page
	 * showing through the gaps.
	 * ------------------------------------------------------------------ */

	function heroBlock() {
		var published = state.publish.published;
		var pledged = state.pledge.taken;

		var calloutText = pledged ?
			'This candidate took the <b>People First Pledge</b>, promising to serve people first, independent of both major parties and big-money interests.' :
			'This candidate has not yet taken the <b>People First Pledge</b> to serve people first, independent of both major parties and big-money interests.';

		return '<section class="hero">' +
			'<div class="hero-inner">' +
				'<div class="hero-avatar">' + SPINE.initials + '</div>' +
				'<div class="hero-text">' +
					'<div class="pill-row">' +
						'<span class="hero-tag">Candidate</span>' +
						(published ? '<span class="pill pill-green">Claimed</span>' : '') +
					'</div>' +
					'<div class="hero-name-office">' +
						'<h1 class="hero-name">' + esc(SPINE.fullName) + '</h1>' +
						'<p class="hero-office">' + esc(SPINE.office) + '</p>' +
						'<p class="hero-district">' + esc(SPINE.district) + '</p>' +
					'</div>' +
					'<div class="hero-callout">' +
						'<span class="hero-callout-mark" style="color:' + (pledged ? 'var(--gold)' : 'var(--on-navy-muted)') + '">' + icon('star', 26) + '</span>' +
						'<span>' + calloutText + '</span>' +
					'</div>' +
				'</div>' +
			'</div>' +
		'</section>';
	}

	/* The sidebar's rows, in the order the live profile card lists them:
	   Election Date, Political Affiliation, then the pledge row. */
	function sidebarBlock() {
		var pledged = state.pledge.taken;
		var rows = '';

		rows += '<div class="side-block">' +
			'<dt class="side-label">Election Date</dt>' +
			'<dd class="side-value">' + icon('calendar', 17) + '<span>' + esc(SPINE.electionDate) + '</span></dd>' +
		'</div>';

		rows += '<div class="side-block">' +
			'<dt class="side-label">Political Affiliation</dt>' +
			'<dd class="side-value">' + icon('flag', 17) + '<span>' + esc(SPINE.affiliation) + '</span></dd>' +
		'</div>';

		rows += '<div class="side-block">' +
			'<dt class="side-label">' + (pledged ? 'Took the People First Pledge' : 'People First Pledge') + '</dt>' +
			'<dd class="side-value">' +
				'<span style="color:' + (pledged ? 'var(--gold)' : 'var(--fg-faint)') + '">' + icon('star', 17) + '</span>' +
				'<span' + (pledged ? '' : ' style="color:var(--fg-faint)"') + '>' + (pledged ? 'Signed on November 10, 2026' : 'Not yet taken') + '</span>' +
			'</dd>' +
		'</div>';

		rows += '<div class="side-block"><dt class="side-label">Contact</dt>' +
			'<dd class="side-value" style="color:var(--fg-faint)">' + icon('mail', 17) + '<span>No contact details yet</span></dd></div>';

		return '<aside class="profile-side"><dl class="side-card">' + rows + '</dl></aside>';
	}

	/* A card holding one or two sections. The first heading is the large
	   one; a second section inside the same card steps down a size, the
	   way the live profile bundles Why with Campaign Issues. */
	function profileCard(sections) {
		return '<article class="card profile-card">' + sections.map(function (sec, i) {
			return '<section class="profile-section">' +
				'<h2 class="' + (i === 0 ? 'section-heading' : 'section-subheading') + '">' + esc(sec.heading) + '</h2>' +
				sec.content +
			'</section>';
		}).join('') + '</article>';
	}

	function placeholder(text) {
		return '<p class="placeholder-prompt">' + esc(text) + '</p>';
	}

	function authoredDisclaimer() {
		return '<p class="authored-disclaimer">These statements come from ' + esc(SPINE.fullName) +
			' and do not reflect any positions or stances on individual issues held by GoodParty.org.</p>';
	}

	/* ================================================================== *
	 * SCREEN 1 — the public candidate profile. Entry point for the whole
	 * prototype, and the place every path returns to.
	 * ================================================================== */
	SCREENS.profile = function () {
		var published = state.publish.published;
		var d = state.draft;
		var resumable = !published && (d.saved || state.account.loggedIn);

		/* ---- the claim callout, first in the card column ---- */
		var claimCard = '';
		if (!published) {
			claimCard = '<article class="claim-card">' +
				'<div class="claim-text">' +
					'<h2 class="section-heading">This profile is incomplete.</h2>' +
					'<p class="claim-body">Are you ' + esc(SPINE.fullName) + '? Claim your profile and share your top priorities with voters. ' +
					'Not ' + esc(SPINE.fullName) + '? Ask this candidate to complete their profile today.</p>' +
				'</div>' +
				'<button class="btn btn-navy btn-lg claim-cta" data-go="path">' +
					(resumable ? 'Continue where you left off' : 'Get started') + ' ' + icon('ext', 16) +
				'</button>' +
			'</article>';
		} else {
			claimCard = '<article class="card profile-card"><div class="profile-section">' +
				'<div class="card-head">' +
					'<div><h2 class="section-subheading">Your profile</h2>' +
					'<p class="muted" style="margin-top:4px">You claimed this page. Edits stay private until you publish them.</p></div>' +
					'<button class="btn btn-outline btn-sm" data-go="edit">' + icon('pencil', 14) + ' Edit profile</button>' +
				'</div>' +
			'</div></article>';
		}

		/* ---- banners ---- */
		var banner = '';
		if (published) {
			banner = '<div class="notice notice-green">' + icon('check', 20, 'notice-ico') +
				'<div class="notice-body"><b>Your profile is live.</b> Voters in ' + esc(SPINE.district) +
				' can now see your profile. Changes you make stay private until you publish them.</div></div>';
		} else if (resumable) {
			banner = '<div class="notice notice-gold">' + icon('clock', 20, 'notice-ico') +
				'<div class="notice-body"><b>You have an unfinished draft.</b> Nothing you have written is public yet.</div></div>';
		}

		/* ---- Why I'm Running + Campaign Issues (one card) ---- */
		var whyContent = published && d.why.trim() ?
			'<p class="authored-text">' + esc(d.why) + '</p>' :
			placeholder(SPINE.fullName + ' has not filled out this section yet.');

		var shownIssues = published ? filledIssues() : [];
		var issuesContent;
		if (shownIssues.length) {
			issuesContent = '<ul class="issue-list">' + shownIssues.map(function (i) {
				return '<li>' + icon('check', 16) + '<span><b>' + esc(i.title) + '</b>' +
					(i.position.trim() ? '<br><span class="issue-position">' + esc(i.position) + '</span>' : '') + '</span></li>';
			}).join('') + '</ul>' + authoredDisclaimer();
		} else {
			issuesContent = placeholder(SPINE.fullName + ' has not shared their top campaign issues yet.');
		}

		var platformCard = profileCard([
			{ heading: 'Why I’m Running for Office', content: whyContent },
			{ heading: 'Campaign Issues', content: issuesContent }
		]);

		/* ---- About Me + Recent Experience (one card) ---- */
		var aboutContent = published && d.about.trim() ?
			'<p class="authored-text">' + esc(d.about) + '</p>' + authoredDisclaimer() :
			placeholder(SPINE.fullName + ' has not filled out this section yet.');

		var experienceContent = '<ul class="experience-list">' +
			'<li>' + icon('briefcase', 17) +
				'<span><b>' + esc(SPINE.office) + '</b><br><span class="faint">' + esc(SPINE.district) + ' · ' + esc(SPINE.electionDate) + '</span></span>' +
			'</li>' +
		'</ul>';

		var aboutCard = profileCard([
			{ heading: 'About Me', content: aboutContent },
			{ heading: 'Recent Experience', content: experienceContent }
		]);

		/* ---- About this position ---- */
		var positionCard = profileCard([{
			heading: 'About This Position',
			content: '<p class="muted" style="color:var(--fg)">Members of the U.S. House of Representatives serve two-year terms and represent ' +
				'a single congressional district. ' + esc(SPINE.districtShort) + ' covers Minneapolis and several neighbouring communities.</p>'
		}]);

		/* ---- District Information ---- */
		var districtCard = profileCard([{
			heading: 'District Information',
			content: '<div class="map-stub">' + icon('pin', 20) + '<span style="margin-left:6px">' + esc(SPINE.districtShort) + ' voter density</span></div>' +
				'<p class="faint" style="margin-top:10px">Source: ' + esc(SPINE.source) + '</p>'
		}]);

		return '<div class="page profile-page screen">' +
			heroBlock() +
			'<div class="profile-grid">' +
				sidebarBlock() +
				'<div class="profile-column">' +
					(banner ? banner : '') +
					claimCard +
					platformCard +
					aboutCard +
					positionCard +
					districtCard +
					protoNote('Prototype. Jordan Avery is a fictional candidate and this page is not connected to GoodParty.org. Items marked <span class="proposal">Proposal</span> are design suggestions, not confirmed behaviour.') +
				'</div>' +
			'</div>' +
		'</div>';
	};

	/* ================================================================== *
	 * SCREEN 2 — choose a path. Two selectable cards and one Continue
	 * button; the profile being acted on is named at the top so there is
	 * never any doubt whose page this is.
	 * ================================================================== */
	SCREENS.path = function () {
		var chosen = state.path;

		var options = [
			{
				id: 'candidate',
				title: 'Claim this profile',
				who: 'I’m ' + SPINE.fullName + ' or someone authorized to manage this profile.',
				detail: 'Four short steps. You can stop and finish later.',
				steps: ['Create an account', 'Update the profile', 'Take the pledge', 'Verify your identity']
			},
			{
				id: 'voter',
				title: 'Ask ' + SPINE.fullName + ' to complete this profile',
				who: 'I’m a voter who wants to learn more about this candidate.',
				detail: 'You’ll send a request asking ' + SPINE.firstName + ' to add their background and campaign priorities. No account needed.',
				steps: null
			}
		];

		var cards = options.map(function (o) {
			var on = chosen === o.id;
			var steps = o.steps ?
				'<ol class="choice-steps">' + o.steps.map(function (st, i) {
					return '<li><span class="choice-step-n">' + (i + 1) + '</span>' + esc(st) + '</li>';
				}).join('') + '</ol>' : '';
			return '<label class="radio-card choice-card' + (on ? ' is-on' : '') + '">' +
				'<input type="radio" name="pathChoice" data-path="' + o.id + '"' + (on ? ' checked' : '') + '>' +
				'<span class="check-body">' +
					'<span class="check-title">' + esc(o.title) + '</span>' +
					'<span class="choice-who">' + esc(o.who) + '</span>' +
					'<span class="check-sub">' + esc(o.detail) + '</span>' +
					steps +
				'</span>' +
			'</label>';
		}).join('');

		return '<div class="page narrow screen">' +
			'<div class="stack-lg">' +

				'<div class="selected-candidate">' +
					'<span class="selected-mark">' + SPINE.initials + '</span>' +
					'<span class="selected-id">' +
						'<span class="selected-name">' + esc(SPINE.fullName) + '</span>' +
						'<span class="selected-meta">' + esc(SPINE.office) + ' · ' + esc(SPINE.district) + '</span>' +
					'</span>' +
				'</div>' +

				'<div class="stack-sm">' +
					'<h1 class="h-xl">How would you like to continue?</h1>' +
					'<p class="lede">Choose what you’d like to do with ' + esc(SPINE.fullName) + '’s profile.</p>' +
				'</div>' +

				'<div class="stack" role="radiogroup" aria-label="How would you like to continue?">' + cards + '</div>' +

				'<div class="stack-sm">' +
					'<div class="btn-row actions split">' +
						'<button class="btn btn-ghost" data-go="profile">' + icon('back', 15) + ' Back to profile</button>' +
						'<button class="btn btn-primary btn-lg" id="pathContinue"' + (chosen ? '' : ' disabled') + '>Continue ' + icon('arrow', 15) + '</button>' +
					'</div>' +
					'<p class="faint" id="pathHint"' + (chosen ? ' hidden' : '') + ' style="text-align:right">Choose an option to continue.</p>' +
				'</div>' +

				protoNote('Prototype. Nothing on either path creates an account, sends a request, or verifies anyone.') +
			'</div>' +
		'</div>';
	};

	/* ================================================================== *
	 * SCREEN 3 — create an account, or sign in. Two columns on desktop:
	 * the profile being claimed on the left, the form on the right.
	 * ================================================================== */
	SCREENS.account = function () {
		var a = state.account;
		var signup = a.mode === 'signup';

		/* ---------- left: what is being claimed, and what follows ---------- */
		var nextSteps = ['Update your profile.', 'Take the People First Pledge.', 'Verify your identity before publishing.'];

		var summary = '<aside class="auth-summary">' +
			'<div class="card auth-preview">' +
				'<p class="eyebrow">Claiming</p>' +
				'<div class="auth-person">' +
					'<span class="auth-mark">' + SPINE.initials + '</span>' +
					'<span class="auth-person-id">' +
						'<span class="auth-person-name">' + esc(SPINE.fullName) + '</span>' +
						'<span class="auth-person-office">' + esc(SPINE.office) + ' — ' + esc(SPINE.district) + '</span>' +
					'</span>' +
				'</div>' +
				'<dl class="auth-facts">' +
					'<div><dt>Affiliation</dt><dd>' + esc(SPINE.affiliation) + '</dd></div>' +
					'<div><dt>Profile status</dt><dd><span class="pill pill-gold">Unclaimed</span></dd></div>' +
				'</dl>' +
			'</div>' +

			'<div class="card auth-next">' +
				'<h2 class="h-sm">What happens next</h2>' +
				'<ol class="next-steps">' + nextSteps.map(function (t, i) {
					return '<li><span class="next-n">' + (i + 1) + '</span><span>' + esc(t) + '</span></li>';
				}).join('') + '</ol>' +
				'<p class="faint">Your changes stay private until you publish them.</p>' +
			'</div>' +
		'</aside>';

		/* ---------- right: the form ---------- */
		var nameFields = signup ?
			'<div class="grid-2">' +
				'<div class="field">' +
					'<label class="field-label" for="firstName">First name</label>' +
					'<input class="input" id="firstName" data-model="account.firstName" value="' + esc(a.firstName) + '" autocomplete="given-name">' +
					'<p class="err" id="err-firstName" hidden></p>' +
				'</div>' +
				'<div class="field">' +
					'<label class="field-label" for="lastName">Last name</label>' +
					'<input class="input" id="lastName" data-model="account.lastName" value="' + esc(a.lastName) + '" autocomplete="family-name">' +
					'<p class="err" id="err-lastName" hidden></p>' +
				'</div>' +
			'</div>' : '';

		var terms = signup ?
			'<label class="check terms-check' + (a.terms ? ' is-on' : '') + '">' +
				'<input type="checkbox" id="terms" data-terms' + (a.terms ? ' checked' : '') + '>' +
				'<span class="check-body"><span class="check-sub">I agree to GoodParty.org’s ' +
					'<a href="#account" data-noop="1">Terms of Service</a> and <a href="#account" data-noop="1">Privacy Policy</a>.</span></span>' +
			'</label>' +
			'<p class="err" id="err-terms" hidden></p>' : '';

		var forgot = signup ? '' :
			'<p class="auth-forgot"><a href="#account" data-noop="1">Forgot your password?</a></p>';

		var form = '<div class="card pad-lg auth-form">' +
			'<div class="stack">' +
				'<div class="stack-sm">' +
					'<h2 class="h-md">' + (signup ? 'Create your account' : 'Sign in') + '</h2>' +
					'<p class="muted">' + (signup ? 'Free, and takes a minute.' : 'Welcome back. Pick up where you left off.') + '</p>' +
				'</div>' +

				'<div class="stack-sm">' +
					'<button class="btn btn-outline btn-block sso-btn" id="ssoGoogle">' +
						'<span class="sso-mark">G</span> Continue with Google' +
					'</button>' +
					'<p class="faint" style="display:flex;align-items:center;gap:6px">' + icon('info', 13) +
						'<span>Single sign-on options are not confirmed yet. <span class="proposal">Proposal</span></span></p>' +
				'</div>' +

				'<div class="or-rule"><span>or</span></div>' +

				nameFields +

				'<div class="field">' +
					'<label class="field-label" for="email">Email</label>' +
					'<input class="input" id="email" type="email" data-model="account.email" value="' + esc(a.email) + '" autocomplete="email" placeholder="you@example.com">' +
					'<p class="err" id="err-email" hidden></p>' +
				'</div>' +

				'<div class="field">' +
					'<label class="field-label" for="password">Password</label>' +
					'<div class="pw-wrap">' +
						'<input class="input" id="password" type="password" data-model="account.password" value="' + esc(a.password) + '" autocomplete="' + (signup ? 'new-password' : 'current-password') + '">' +
						'<button type="button" id="pwToggle" class="pw-toggle" aria-label="Show password">' + icon('eye', 17) + '</button>' +
					'</div>' +
					(signup ? '<p class="field-hint">At least 8 characters.</p>' : '') +
					'<p class="err" id="err-password" hidden></p>' +
					forgot +
				'</div>' +

				terms +

				'<button class="btn btn-primary btn-lg btn-block" id="accountSubmit">' + (signup ? 'Create account' : 'Sign in') + '</button>' +

				'<p class="auth-switch">' +
					(signup ?
						'Already have an account? <button type="button" class="link-btn" data-mode="login">Sign in</button>' :
						'New to GoodParty.org? <button type="button" class="link-btn" data-mode="signup">Create an account</button>') +
				'</p>' +
			'</div>' +
		'</div>';

		return '<div class="page mid screen">' +
			'<div class="stack-lg">' +
				'<div class="stack-sm">' +
					'<button class="btn btn-ghost btn-sm" style="align-self:flex-start;margin-left:-14px" data-go="path">' + icon('back', 14) + ' Back</button>' +
					'<h1 class="h-xl">Claim your profile</h1>' +
					'<p class="lede">Create an account to update your information and share your priorities with voters.</p>' +
				'</div>' +

				'<div class="auth-grid">' + summary + form + '</div>' +

				protoNote('Prototype. No account is created and nothing is sent. Any email with a password of 8 or more characters will continue. Once signed in, returning to this screen goes straight to the profile editor.') +
			'</div>' +
		'</div>';
	};

	/* ================================================================== *
	 * SCREEN 4 — the profile editor. Everything editable sits on one
	 * screen in three sections. None of it is required to move on.
	 * ================================================================== */

	/* Set when a re-render should land the caret somewhere specific, so
	   adding an issue puts you straight in its title field. */
	var pendingFocus = null;
	/* Set when a choice swaps the whole view, so focus lands on the new
	   heading instead of being dropped on a button that no longer exists. */
	var focusHeading = false;

	function counterEl(id, used, max) {
		var over = used > max;
		return '<span class="counter' + (over ? ' over' : '') + '" id="' + id + '">' + used + ' / ' + max + '</span>';
	}

	function issueEditor(issue, index) {
		var titleUsed = issue.title.length;
		var posUsed = issue.position.length;
		return '<li class="issue-row" data-issue-row="' + issue.id + '">' +
			'<div class="issue-row-head">' +
				'<span class="issue-n">Issue ' + (index + 1) + '</span>' +
				'<button type="button" class="issue-remove" data-remove-issue="' + issue.id + '" aria-label="Remove issue ' + (index + 1) + '">' +
					icon('x', 14) + '<span>Remove</span>' +
				'</button>' +
			'</div>' +
			'<div class="field">' +
				'<label class="field-label" for="it-' + issue.id + '">Issue' +
					counterEl('c-it-' + issue.id, titleUsed, LIMITS.issueTitle) + '</label>' +
				'<input class="input" id="it-' + issue.id + '" data-issue-title="' + issue.id + '" value="' + esc(issue.title) + '" placeholder="Healthcare costs">' +
				'<p class="err" id="err-it-' + issue.id + '" hidden></p>' +
			'</div>' +
			'<div class="field">' +
				'<label class="field-label" for="ip-' + issue.id + '">Your position' +
					counterEl('c-ip-' + issue.id, posUsed, LIMITS.issuePosition) + '</label>' +
				'<textarea class="textarea textarea-sm" id="ip-' + issue.id + '" data-issue-position="' + issue.id + '" placeholder="What you would do about it.">' + esc(issue.position) + '</textarea>' +
				'<p class="err" id="err-ip-' + issue.id + '" hidden></p>' +
			'</div>' +
		'</li>';
	}

	SCREENS.edit = function () {
		var d = state.draft;
		var added = sectionsAdded();
		var count = addedCount();

		/* ---------------- left: who, status, progress ---------------- */
		var statusPill = state.publish.published ?
			'<span class="pill pill-green">Claimed</span>' :
			'<span class="pill pill-gold">' + icon('lock', 12) + ' Private draft</span>';

		var progressRows = [
			{ label: 'Why I’m Running', on: added[0] },
			{ label: 'Campaign Issues', on: added[1] },
			{ label: 'About Me', on: added[2] }
		].map(function (r) {
			return '<li class="prog-row' + (r.on ? ' is-on' : '') + '">' +
				'<span class="prog-tick">' + (r.on ? icon('check', 12) : '') + '</span>' +
				'<span>' + esc(r.label) + '</span>' +
			'</li>';
		}).join('');

		var sidebar = '<aside class="edit-side">' +
			'<div class="card edit-person">' +
				'<div class="auth-person">' +
					'<span class="auth-mark">' + SPINE.initials + '</span>' +
					'<span class="auth-person-id">' +
						'<span class="auth-person-name">' + esc(SPINE.fullName) + '</span>' +
						'<span class="auth-person-office">' + esc(SPINE.office) + '</span>' +
					'</span>' +
				'</div>' +
				'<p class="edit-district">' + esc(SPINE.district) + '</p>' +
				'<div class="edit-status">' +
					'<span class="faint">Profile status</span>' + statusPill +
				'</div>' +
			'</div>' +

			'<div class="card edit-progress">' +
				'<div class="prog-head">' +
					'<h2 class="h-sm">Your progress</h2>' +
					'<span class="faint">' + count + ' of 3</span>' +
				'</div>' +
				'<div class="prog-bar" role="progressbar" aria-valuenow="' + count + '" aria-valuemin="0" aria-valuemax="3" aria-label="Sections added">' +
					'<span style="width:' + (count / 3 * 100) + '%"></span>' +
				'</div>' +
				'<ul class="prog-list">' + progressRows + '</ul>' +
				'<p class="save-state" id="saveState">' + (d.saved ? icon('check', 13) + '<span>Draft saved</span>' : icon('lock', 13) + '<span>Saved privately as you type</span>') + '</p>' +
			'</div>' +

			'<div class="card edit-locked">' +
				'<h2 class="h-sm">From public records</h2>' +
				'<dl class="locked-list">' +
					'<div><dt>Office</dt><dd>' + icon('lock', 13) + esc(SPINE.office) + '</dd></div>' +
					'<div><dt>District</dt><dd>' + icon('lock', 13) + esc(SPINE.district) + '</dd></div>' +
					'<div><dt>Election</dt><dd>' + icon('lock', 13) + esc(SPINE.electionDate) + '</dd></div>' +
					'<div><dt>Affiliation</dt><dd>' + icon('lock', 13) + esc(SPINE.affiliation) + '</dd></div>' +
				'</dl>' +
				'<p class="faint">Read-only. Corrections are made at the source, not here. ' +
					'<a href="#edit" data-noop="1">Report a problem</a> <span class="proposal">Proposal</span></p>' +
			'</div>' +
		'</aside>';

		/* ---------------- right: the three sections ---------------- */

		var whySection = '<section class="card pad-lg edit-section" id="section-why">' +

				'Two or three short paragraphs is plenty.</p>' +

				'<label class="field-label" for="why">Your answer' + counterEl('c-why', d.why.length, LIMITS.why) + '</label>' +

		var issuesBody;

			issuesBody = '<ul class="issue-list-edit">' + d.issues.map(issueEditor).join('') + '</ul>';
		} else {
			issuesBody = '<div class="empty">' + icon('vote', 22) +
				'<span class="empty-title">No issues added yet</span>' +
				'<span class="empty-sub">Add the issues you are running on and say where you stand on each.</span>' +
			'</div>';
		}

		var addBtn = d.issues.length >= MAX_ISSUES ?
			'<p class="faint">' + MAX_ISSUES + ' is the maximum. Remove one to add another.</p>' :
			'<button type="button" class="btn btn-outline btn-sm" id="addIssue">' + icon('plus', 14) + ' Add an issue</button>';

		var issuesSection = '<section class="card pad-lg edit-section" id="section-issues">' +
			'<div class="section-head">' +
				'<h2 class="h-md">Campaign Issues</h2>' + publicChip +
			'</div>' +
			'<p class="muted section-guide">Name an issue, then say where you stand on it in a sentence or two. Most candidates list three to five.</p>' +
			issuesBody +
			'<p class="err" id="err-issues" hidden></p>' +
			'<div class="issue-add">' + addBtn + '</div>' +
		'</section>';

		var aboutSection = '<section class="card pad-lg edit-section" id="section-about">' +
			'<div class="section-head">' +
				'<h2 class="h-md">About Me</h2>' + publicChip +
			'</div>' +
			'<p class="muted section-guide">Your background, your work, and the experience you bring. Write it the way you would introduce yourself at a community meeting.</p>' +
			'<div class="field">' +
				'<label class="field-label" for="about">Your answer' + counterEl('c-about', d.about.length, LIMITS.about) + '</label>' +
				'<textarea class="textarea textarea-lg" id="about" data-model="draft.about" placeholder="I have spent…">' + esc(d.about) + '</textarea>' +
				'<p class="err" id="err-about" hidden></p>' +
			'</div>' +
		'</section>';

		return '<div class="page mid screen">' +
			'<div class="stack-lg">' +
				'<div class="stack-sm">' +
					'<button class="btn btn-ghost btn-sm" style="align-self:flex-start;margin-left:-14px" data-go="path">' + icon('back', 14) + ' Back</button>' +
					'<h1 class="h-xl">Complete your profile</h1>' +
					'<p class="lede">Add or update your information for voters. We’ve filled in what we already know, so you can make changes quickly.</p>' +
				'</div>' +

				'<div class="notice notice-gold">' + icon('lock', 20, 'notice-ico') +
					'<div class="notice-body"><b>This is a private draft.</b> Everything marked ' + publicChip +
					' appears on your public profile once you publish — and not before. Nothing is required to continue.</div></div>' +

				'<div class="edit-grid">' +
					sidebar +
					'<div class="edit-main">' +
						whySection +
						issuesSection +
						aboutSection +
						'<div class="btn-row actions split edit-actions">' +
							'<button class="btn btn-ghost" id="skipEdit">I’ll do this later</button>' +

						'</div>' +
					'</div>' +
				'</div>' +

				protoNote('Prototype. Nothing is saved to GoodParty.org. Both buttons go to the pledge step and keep whatever you have written.') +
			'</div>' +

	/* ================================================================== *
	 * SCREEN 5 — the People First Pledge.
	 *
	 * The three commitments and their full text are the approved copy from
	 * `PLEDGE_MODAL_COPY` in src/ui/PledgeModal.tsx. The short summaries on
	 * the cards are orientation only; the approved language is shown in full
	 * before anyone agrees, and nothing here invents a binding term.
	 * ================================================================== */

	var PLEDGE_INTRO = 'GoodParty.org only works with candidates and elected officials who agree to serve people first, independent of both major ' +
		'parties and big-money interests. Their stances on individual issues vary. They are eligible to take the pledge if they agree to be:';

	var PLEDGE_SUMMARIES = {
		'independent': 'Runs and serves outside both major parties.',
		'people-powered': 'Funded mainly by individuals, not PACs or corporations.',
		'anti-corruption': 'Open about donors, positions and progress.'
	};

	function claimingChip() {
		return '<div class="claiming-chip">' +
			'<span class="claiming-mark">' + SPINE.initials + '</span>' +
			'<span class="claiming-id">' +
				'<span class="claiming-name">' + esc(SPINE.fullName) + '</span>' +
				'<span class="claiming-meta">' + esc(SPINE.office) + ' · ' + esc(SPINE.districtShort) + ' · ' + esc(SPINE.affiliation) + '</span>' +
			'</span>' +
		'</div>';
	}

	function pledgeCards() {
		return '<div class="pledge-cards">' + PLEDGE_PILLARS.map(function (x) {
			return '<article class="pledge-card">' +
				'<span class="pillar-ico" style="background:' + x.bg + ';color:' + x.fg + '">' + icon(x.icon, 20) + '</span>' +
				'<h3 class="h-sm">' + esc(x.title) + '</h3>' +
				'<p class="muted">' + esc(PLEDGE_SUMMARIES[x.key]) + '</p>' +
			'</article>';
		}).join('') + '</div>';
	}

	function fullPledgeBlock() {
		var open = state.pledge.fullOpen;
		return '<div class="card full-pledge">' +
			'<button type="button" class="disclosure" id="fullPledgeToggle" aria-expanded="' + open + '">' +
				'<span class="disclosure-label">' + icon('doc', 16) + ' Read the full pledge</span>' +
				'<span class="disclosure-chev' + (open ? ' is-open' : '') + '">' + icon('arrow', 15) + '</span>' +
			'</button>' +
			'<div class="disclosure-body"' + (open ? '' : ' hidden') + ' id="fullPledgeBody">' +
				'<div class="full-pledge-head">' + heartStar(44) + '<h3 class="h-md">The People First Pledge</h3></div>' +
				'<p class="muted">' + esc(PLEDGE_INTRO) + '</p>' +
				PLEDGE_PILLARS.map(function (x) {
					return '<section class="full-pillar">' +
						'<h4 class="full-pillar-title">' +
							'<span class="pillar-ico" style="width:28px;height:28px;background:' + x.bg + ';color:' + x.fg + '">' + icon(x.icon, 15) + '</span>' +
							esc(x.title) +
						'</h4>' +
						'<p>' + esc(x.body) + '</p>' +
					'</section>';
				}).join('') +
				'<p class="faint">This is the pledge language published on GoodParty.org. It is shown here in full, unedited.</p>' +
			'</div>' +
		'</div>';
	}

	SCREENS.pledge = function () {
		var p = state.pledge;

		/* ---------- already recorded: show it, do not ask again ---------- */
		if (p.taken) {
			return '<div class="page mid screen">' +
				'<div class="stack-lg">' +
					claimingChip() +
					'<div class="card pad-lg">' +
						'<div class="stack" style="align-items:flex-start">' +
							'<span class="pill pill-green">' + icon('check', 12) + ' Pledge recorded</span>' +
							'<h1 class="h-lg">You have taken the People First Pledge</h1>' +
							'<p class="lede">Signed by ' + esc(SPINE.fullName) + (p.takenOn ? ' on ' + esc(p.takenOn) : '') + '. ' +
								'There is nothing to do again here.</p>' +
							fullPledgeBlock() +
							'<div class="btn-row actions" style="width:100%;justify-content:space-between">' +
								'<button class="btn btn-ghost" data-go="edit">' + icon('back', 15) + ' Back to editing</button>' +
								'<button class="btn btn-primary btn-lg" data-go="verify">Continue ' + icon('arrow', 15) + '</button>' +
							'</div>' +
						'</div>' +
					'</div>' +
					protoNote('Prototype. Nothing is recorded with GoodParty.org.') +
				'</div>' +
			'</div>';
		}

		/* ---------- role not yet established ---------- */
		var roleChoice = '';
		if (!state.role) {
			roleChoice = '<div class="card pad-lg">' +
				'<div class="stack">' +
					'<div class="stack-sm">' +
						'<h2 class="h-md">First, who is taking this pledge?</h2>' +
						'<p class="muted">The pledge is a personal commitment, so only the candidate can make it.</p>' +
					'</div>' +
					'<label class="radio-card"><input type="radio" name="claimRole" data-role="candidate">' +
						'<span class="check-body"><span class="check-title">I am ' + esc(SPINE.fullName) + '</span>' +
						'<span class="check-sub">You will read and sign the pledge yourself.</span></span></label>' +
					'<label class="radio-card"><input type="radio" name="claimRole" data-role="rep">' +
						'<span class="check-body"><span class="check-title">I manage this profile for ' + esc(SPINE.firstName) + '</span>' +
						'<span class="check-sub">Campaign staff, a volunteer, or anyone else authorized to edit.</span></span></label>' +
					'<p class="err" id="err-role" hidden></p>' +
				'</div>' +
			'</div>';

			return '<div class="page mid screen">' +
				'<div class="stack-lg">' +
					claimingChip() +
					'<div class="stack-sm">' +
						'<button class="btn btn-ghost btn-sm" style="align-self:flex-start;margin-left:-14px" data-go="edit">' + icon('back', 14) + ' Back</button>' +
						'<h1 class="h-xl">Put people first</h1>' +
						'<p class="lede">The People First Pledge is a commitment to serve people first, independent of both major political parties and big-money interests.</p>' +
					'</div>' +
					pledgeCards() +
					roleChoice +
					protoNote('Prototype. Nothing is recorded with GoodParty.org.') +
				'</div>' +
			'</div>';
		}

		/* ---------- a representative cannot pledge for the candidate ---------- */
		if (state.role === 'rep') {
			var requested = p.consentRequested;
			return '<div class="page mid screen">' +
				'<div class="stack-lg">' +
					claimingChip() +
					'<div class="stack-sm">' +
						'<button class="btn btn-ghost btn-sm" style="align-self:flex-start;margin-left:-14px" data-go="edit">' + icon('back', 14) + ' Back</button>' +
						'<h1 class="h-xl">Put people first</h1>' +
						'<p class="lede">The People First Pledge is a commitment to serve people first, independent of both major political parties and big-money interests.</p>' +
					'</div>' +

					'<div class="notice notice-gold">' + icon('warn', 20, 'notice-ico') +
						'<div class="notice-body"><b>' + esc(SPINE.firstName) + ' has to take this pledge personally.</b> ' +
						'You can manage the profile, but nobody can pledge on a candidate’s behalf — it is a statement GoodParty.org publishes about them by name.</div></div>' +

					pledgeCards() +
					fullPledgeBlock() +

					'<div class="card pad-lg">' +
						'<div class="stack">' +
							'<h2 class="h-md">' + (requested ? 'Consent request recorded' : 'Ask ' + esc(SPINE.firstName) + ' to sign') + '</h2>' +
							(requested ?
								'<div class="notice notice-green">' + icon('check', 20, 'notice-ico') +
									'<div class="notice-body">We will ask ' + esc(SPINE.fullName) + ' to review and sign the pledge. ' +
									'You can carry on without it — the profile simply publishes without the pledge mark.</div></div>' :
								'<p class="muted">We can send ' + esc(SPINE.firstName) + ' a link to read and sign the pledge themselves. ' +
								'Your profile edits are unaffected either way. <span class="proposal">Proposal</span></p>') +
							'<div class="btn-row actions" style="width:100%;justify-content:space-between">' +
								'<button class="btn btn-ghost" id="changeRole">Change who is claiming</button>' +
								'<div class="btn-row">' +
									(requested ? '' : '<button class="btn btn-outline" id="requestConsent">Send ' + esc(SPINE.firstName) + ' the pledge</button>') +
									'<button class="btn btn-primary btn-lg" data-go="verify">Continue without the pledge ' + icon('arrow', 15) + '</button>' +
								'</div>' +
							'</div>' +
						'</div>' +
					'</div>' +
					protoNote('Prototype. No request is sent. Whether the production feature emails the candidate, queues a task, or does something else is still open. <span class="proposal">Proposal</span>') +
				'</div>' +
			'</div>';
		}

		/* ---------- the candidate themselves ---------- */
		var checks = PLEDGE_PILLARS.map(function (x) {
			return '<li>' + icon('check', 15) + '<span><b>' + esc(x.title) + '</b> — ' + esc(PLEDGE_SUMMARIES[x.key]) + '</span></li>';
		}).join('');

		return '<div class="page mid screen">' +
			'<div class="stack-lg">' +
				claimingChip() +
				'<div class="stack-sm">' +
					'<button class="btn btn-ghost btn-sm" style="align-self:flex-start;margin-left:-14px" data-go="edit">' + icon('back', 14) + ' Back</button>' +
					'<h1 class="h-xl">Put people first</h1>' +
					'<p class="lede">The People First Pledge is a commitment to serve people first, independent of both major political parties and big-money interests.</p>' +
				'</div>' +

				pledgeCards() +

				'<div class="card pad-lg eligibility">' +
					'<div style="display:flex;gap:13px;align-items:flex-start">' +
						'<span style="flex:none;color:var(--green);margin-top:1px">' + icon('shield', 22) + '</span>' +
						'<div class="stack-sm" style="min-width:0">' +
							'<h2 class="h-sm">' + esc(SPINE.fullName) + ' is eligible to take this pledge</h2>' +
							'<p class="muted">Eligibility is read from the affiliation on file: <b>' + esc(SPINE.affiliation) + '</b>. ' +
								'A Democratic or Republican line on any current affiliation makes a candidate ineligible, as does a filing recorded as a partisan candidacy.</p>' +
							'<p class="faint">Affiliation wrong? It is corrected at the source, not here. ' +
								'<a href="#pledge" data-noop="1">Get help with eligibility</a> <span class="proposal">Proposal</span></p>' +
						'</div>' +
					'</div>' +
				'</div>' +

				fullPledgeBlock() +

				'<div class="card pad-lg">' +
					'<div class="stack-sm">' +
						'<div class="mark-row">' + heartStar(40) + '<h2 class="h-md">What this shows on your profile</h2></div>' +
						'<p class="muted">Taking the pledge adds the Heart &amp; Star mark to your public profile and the line ' +
							'“This candidate took the People First Pledge…”. Leaving it adds nothing — your profile still publishes.</p>' +
						'<p class="faint">GoodParty.org may remove the mark if a candidate later accepts a major-party endorsement.</p>' +
					'</div>' +
				'</div>' +

				'<div class="card pad-lg">' +
					'<div class="stack">' +
						'<h2 class="h-md">Agree and sign</h2>' +
						'<ul class="agree-list">' + checks + '</ul>' +
						'<label class="check agree-check' + (allPledgeAgreed() ? ' is-on' : '') + '">' +
							'<input type="checkbox" id="pledgeAgree" data-pledge-all' + (allPledgeAgreed() ? ' checked' : '') + '>' +
							'<span class="check-body"><span class="check-sub">I have read the full pledge above and I agree to all three commitments.</span></span>' +
						'</label>' +
						'<p class="err" id="err-pledgeAgree" hidden></p>' +

						'<div class="field">' +
							'<label class="field-label" for="sig">Sign with your full name</label>' +
							'<input class="input" id="sig" data-model="pledge.signature" value="' + esc(p.signature) + '" placeholder="' + esc(SPINE.fullName) + '" autocomplete="off">' +
							'<p class="field-hint">Must match ' + esc(SPINE.fullName) + '.</p>' +
							'<p class="err" id="err-sig" hidden></p>' +
						'</div>' +
					'</div>' +
				'</div>' +

				'<div class="btn-row actions split">' +
					'<button class="btn btn-ghost" id="changeRole">Change who is claiming</button>' +
					'<button class="btn btn-primary btn-lg" id="pledgeSubmit">Take the pledge and continue ' + icon('arrow', 15) + '</button>' +
				'</div>' +

				protoNote('Prototype. Nothing is recorded. In the live product a signed pledge is reviewed by GoodParty.org before the mark appears. <span class="proposal">Proposal</span>') +
			'</div>' +
		'</div>';
	};

	function allPledgeAgreed() {
		return PLEDGE_PILLARS.every(function (x) { return state.pledge.agreed[x.key]; });
	}

	function setAllPledge(on) {
		PLEDGE_PILLARS.forEach(function (x) { state.pledge.agreed[x.key] = on; });
	}

	/* ================================================================== *
	 * SCREEN 6 — identity and profile-ownership verification.
	 *
	 * No verification method is settled. Everything below the profile
	 * summary is a proposal for review, not a description of something
	 * that exists.
	 * ================================================================== */

	function verifySummaryCard() {
		var meta = verifyStatusMeta();
		return '<div class="card verify-summary">' +
			'<div class="auth-person">' +
				'<span class="auth-mark">' + SPINE.initials + '</span>' +
				'<span class="auth-person-id">' +
					'<span class="auth-person-name">' + esc(SPINE.fullName) + '</span>' +
					'<span class="auth-person-office">' + esc(SPINE.office) + ' — ' + esc(SPINE.district) + '</span>' +
				'</span>' +
			'</div>' +
			'<dl class="auth-facts">' +
				'<div><dt>Affiliation</dt><dd>' + esc(SPINE.affiliation) + '</dd></div>' +
				'<div><dt>Claiming as</dt><dd>' + (state.role === 'rep' ? 'Authorized manager' : state.role === 'candidate' ? 'The candidate' : '—') + '</dd></div>' +
				'<div><dt>Pledge</dt><dd>' + (state.pledge.taken ?
					'<span class="pill pill-gold">' + icon('star', 12) + ' Taken</span>' :
					'<span class="faint">Not taken</span>') + '</dd></div>' +
				'<div><dt>Access</dt><dd><span class="pill ' + meta.cls + '">' + icon(meta.icon, 12) + ' ' + esc(meta.label) + '</span></dd></div>' +
			'</dl>' +
			'<p class="faint">Your draft is saved and stays private whatever happens here.</p>' +
		'</div>';
	}

	/* Prototype-only state switcher, so the three review states can be seen
	   without anyone actually being verified. */
	function verifySimControls() {
		var opts = [
			{ id: 'unverified', label: 'Not submitted' },
			{ id: 'pending', label: 'Pending' },
			{ id: 'approved', label: 'Approved' },
			{ id: 'more-info', label: 'More info needed' }
		];
		return '<div class="sim-box">' +
			'<p class="sim-title">' + icon('info', 13) + ' Prototype control — not a production feature</p>' +
			'<p class="sim-sub">Jump the verification request to any state for review.</p>' +
			'<div class="sim-row">' + opts.map(function (o) {
				return '<button type="button" class="sim-btn' + (state.verify.status === o.id ? ' is-on' : '') + '" data-sim-verify="' + o.id + '">' + esc(o.label) + '</button>';
			}).join('') + '</div>' +
		'</div>';
	}

	function verifyHeader(back) {
		return '<div class="stack-sm">' +
			(back ? '<button class="btn btn-ghost btn-sm" style="align-self:flex-start;margin-left:-14px" data-go="' + back + '">' + icon('back', 14) + ' Back</button>' : '') +
			'<h1 class="h-xl">Verify it’s really you</h1>' +
			'<p class="lede">Before publishing changes, we need to confirm you’re ' + esc(SPINE.fullName) + ' or someone authorized to manage this profile. ' +
				'This helps protect candidate information from unauthorized edits.</p>' +
		'</div>';
	}

	SCREENS.verify = function () {
		var v = state.verify;

		/* ---------------- 1. pending ---------------- */
		if (v.status === 'pending') {
			return '<div class="page mid screen">' +
				'<div class="stack-lg">' +
					verifyHeader(null) +
					'<div class="card pad-lg">' +
						'<div class="stack" style="align-items:flex-start">' +
							'<span class="pill pill-gold">' + icon('clock', 12) + ' Verification pending</span>' +
							'<h2 class="h-md">Your request is with our team</h2>' +
							'<p class="muted">A person at GoodParty.org reviews each request. We will email ' +
								'<b>' + esc(state.account.email || 'the address on your account') + '</b> when there is a decision. ' +
								'We cannot promise a turnaround time yet. <span class="proposal">Proposal</span></p>' +
							'<div class="notice notice-gold" style="width:100%">' + icon('lock', 20, 'notice-ico') +
								'<div class="notice-body"><b>Your draft is saved and still private.</b> Keep editing as much as you like — ' +
								'nothing publishes until this is approved.</div></div>' +
							'<div class="btn-row actions" style="width:100%;justify-content:space-between">' +
								'<button class="btn btn-ghost" data-go="edit">' + icon('pencil', 15) + ' Back to my draft</button>' +
								'<button class="btn btn-outline" data-go="preview">See what will publish</button>' +
							'</div>' +
						'</div>' +
					'</div>' +
					verifySimControls() +
					protoNote('Prototype. No request was submitted and no identity is being checked.') +
				'</div>' +
			'</div>';
		}

		/* ---------------- 2. approved ---------------- */
		if (v.status === 'approved') {
			return '<div class="page mid screen">' +
				'<div class="stack-lg">' +
					verifyHeader(null) +
					'<div class="card pad-lg">' +
						'<div class="stack" style="align-items:flex-start">' +
							'<span class="ok-mark" style="width:52px;height:52px">' + icon('check', 26) + '</span>' +
							'<h2 class="h-md">You are authorized to manage this profile</h2>' +
							'<p class="muted">' + esc(SPINE.fullName) + '’s profile is yours to edit and publish. ' +
								'You will not have to do this again.</p>' +
							'<div class="btn-row actions" style="width:100%;justify-content:space-between">' +
								'<button class="btn btn-ghost" data-go="edit">' + icon('pencil', 15) + ' Keep editing</button>' +
								'<button class="btn btn-primary btn-lg" data-go="preview">Continue to publishing ' + icon('arrow', 15) + '</button>' +
							'</div>' +
						'</div>' +
					'</div>' +
					verifySimControls() +
					protoNote('Prototype. No identity was verified.') +
				'</div>' +
			'</div>';
		}

		/* ---------------- 3. more information needed ---------------- */
		if (v.status === 'more-info') {
			return '<div class="page mid screen">' +
				'<div class="stack-lg">' +
					verifyHeader(null) +
					'<div class="card pad-lg">' +
						'<div class="stack" style="align-items:flex-start">' +
							'<span class="pill pill-red">' + icon('alert', 12) + ' More information needed</span>' +
							'<h2 class="h-md">We could not confirm this from what you sent</h2>' +
							'<p class="muted">The details we received did not match the candidate filing for ' + esc(SPINE.district) + '. ' +
								'That is common and usually easy to clear up — often it is a different email address or a name recorded differently on the filing.</p>' +
							'<div class="notice notice-gold" style="width:100%">' + icon('lock', 20, 'notice-ico') +

								'<button class="btn btn-ghost" data-go="edit">Back to my draft</button>' +

					'</div>' +

					protoNote('Prototype. No request was reviewed and no identity was checked.') +
				'</div>' +
			'</div>';

		/* ---------------- 0. not submitted ---------------- */
		var roleBlock;
		if (state.role) {

				'<div class="card-head">' +
					'<div><h2 class="h-sm">You are claiming as</h2>' +
					'<p class="muted" style="margin-top:4px">' + (state.role === 'rep' ?
						'Someone authorized to manage ' + esc(SPINE.firstName) + '’s profile.' :
						esc(SPINE.fullName) + ', the candidate.') + '</p></div>' +
					'<button class="btn btn-outline btn-sm" id="changeRole">Change</button>' +
				'</div>' +
			'</div>';
		} else {
			roleBlock = '<div class="card pad-lg">' +
				'<div class="stack">' +
					'<h2 class="h-md">Which are you?</h2>' +
					'<label class="radio-card"><input type="radio" name="claimRole" data-role="candidate">' +
						'<span class="check-body"><span class="check-title">I’m this candidate</span>' +
						'<span class="check-sub">You are ' + esc(SPINE.fullName) + '.</span></span></label>' +
					'<label class="radio-card"><input type="radio" name="claimRole" data-role="rep">' +
						'<span class="check-body"><span class="check-title">I’m authorized to manage this profile</span>' +
						'<span class="check-sub">Campaign staff, a volunteer, or anyone else acting for the candidate.</span></span></label>' +
					'<p class="err" id="err-role" hidden></p>' +
				'</div>' +
			'</div>';
		}

		var proposed = [
			'You tell us which email address or phone number appears on your candidate filing.',
			'We send a one-time code to it, or ask for a document if neither is reachable.',
			'A person at GoodParty.org checks the result against the filing for ' + SPINE.districtShort + ' and approves or comes back to you.'
		];

		return '<div class="page mid screen">' +
			'<div class="stack-lg">' +
				verifyHeader('pledge') +
				verifySummaryCard() +
				roleBlock +

				'<div class="card pad-lg">' +
					'<div class="stack">' +
						'<div class="section-head">' +
							'<h2 class="h-md">How verification would work</h2>' +
							'<span class="proposal">Proposed</span>' +
						'</div>' +
						'<div class="notice notice-blue">' + icon('info', 20, 'notice-ico') +
							'<div class="notice-body"><b>This process is not finalized.</b> No provider has been chosen and no government ID, ' +
							'EIN or third-party check is in place today. The steps below are a proposal to review, not a description of what exists.</div></div>' +
						'<ol class="next-steps">' + proposed.map(function (t, i) {
							return '<li><span class="next-n">' + (i + 1) + '</span><span>' + esc(t) + '</span></li>';
						}).join('') + '</ol>' +
						'<p class="faint">We will not know how long review takes until the process is settled, so this screen does not promise a turnaround.</p>' +
					'</div>' +
				'</div>' +

				'<div class="btn-row actions split">' +
					'<button class="btn btn-ghost" data-go="preview">I’ll do this later</button>' +
					'<button class="btn btn-primary btn-lg" id="verifySubmit">Submit verification request ' + icon('arrow', 15) + '</button>' +
				'</div>' +

				verifySimControls() +
				protoNote('Prototype. Nothing is submitted, no identity is checked, and no code or document is sent anywhere.') +
			'</div>' +
		'</div>';

	/* ================================================================== *
	 * SCREEN 7 — review and publish. Publishing is gated on BOTH the
	 * pledge requirement and verified profile access; neither alone is
	 * enough, and neither is a finished profile.
	 * ================================================================== */

	var PUBLIC_URL = 'goodparty.org/people/jordan-avery';

	function sectionEdit(heading, body, empty) {
		return '<section class="review-section">' +
			'<div class="review-head">' +
				'<h3 class="h-sm">' + esc(heading) + '</h3>' +
				'<button class="btn btn-ghost btn-sm" data-go="edit">' + icon('pencil', 13) + ' Edit</button>' +
			'</div>' +
			(body || '<p class="placeholder-prompt">' + esc(empty) + '</p>') +
		'</section>';
	}

	SCREENS.preview = function () {
		var d = state.draft;
		var issues = filledIssues();
		var hasAny = !!d.why.trim() || !!d.about.trim() || issues.length > 0;
		var meta = verifyStatusMeta();

		/* ---------------- the gate ---------------- */
		var gate, action;
		if (!pledgeSatisfied()) {
			gate = '<div class="notice notice-gold">' + icon('star', 20, 'notice-ico') +
				'<div class="notice-body"><b>Finish the pledge step first.</b> We need to know whether you are taking the People First Pledge ' +
				'before this profile can publish. Your changes are saved meanwhile. ' +
				'<button class="btn btn-sm btn-outline" style="margin-top:9px" data-go="pledge">Go to the pledge</button></div></div>';
			action = '<button class="btn btn-lg" disabled style="opacity:0.55">Publish changes</button>';
		} else if (!accessVerified()) {
			if (state.verify.status === 'pending') {
				gate = '<div class="notice notice-gold">' + icon('clock', 20, 'notice-ico') +
					'<div class="notice-body"><b>Verification pending.</b> Your changes are saved but they are not public. ' +
					'Publishing unlocks when your access is approved.</div></div>';
				action = '<button class="btn btn-lg" disabled style="opacity:0.55">' + icon('clock', 15) + ' Waiting on verification</button>';
			} else if (state.verify.status === 'more-info') {
				gate = '<div class="notice notice-red">' + icon('alert', 20, 'notice-ico') +
					'<div class="notice-body"><b>Verification needs more information.</b> Your changes are saved but not public. ' +
					'<button class="btn btn-sm btn-outline" style="margin-top:9px" data-go="verify">Continue verification</button></div></div>';
				action = '<button class="btn btn-lg" disabled style="opacity:0.55">Publish changes</button>';
			} else {
				gate = '<div class="notice notice-red">' + icon('lock', 20, 'notice-ico') +
					'<div class="notice-body"><b>Verify your access to publish.</b> You can review and keep editing meanwhile. ' +
					'<button class="btn btn-sm btn-outline" style="margin-top:9px" data-go="verify">Verify now</button></div></div>';
				action = '<button class="btn btn-lg" disabled style="opacity:0.55">Publish changes</button>';
			}
		} else if (state.publish.moderation) {
			gate = '<div class="notice notice-blue">' + icon('info', 20, 'notice-ico') +
				'<div class="notice-body"><b>These updates go to review first.</b> Some content is checked by GoodParty.org before it ' +
				'appears publicly, so this submits your changes rather than publishing them straight away. <span class="proposal">Proposal</span></div></div>';
			action = '<button class="btn btn-primary btn-lg" id="publishBtn">Submit updates for review</button>';
		} else {
			gate = '<div class="notice notice-green">' + icon('shield', 20, 'notice-ico') +
				'<div class="notice-body"><b>You are verified.</b> Publishing makes these changes visible to voters right away.</div></div>';
			action = '<button class="btn btn-primary btn-lg" id="publishBtn">Publish changes</button>';
		}

		/* ---------------- the preview ---------------- */
		var pledgeLine = state.pledge.taken ?
			'<div class="hero-callout review-callout"><span class="hero-callout-mark" style="color:var(--gold)">' + icon('star', 24) + '</span>' +
				'<span>This candidate took the <b>People First Pledge</b>, promising to serve people first, independent of both major parties and big-money interests.</span></div>' :
			'<div class="hero-callout review-callout"><span class="hero-callout-mark" style="color:var(--on-navy-muted)">' + icon('star', 24) + '</span>' +
				'<span>This candidate has not yet taken the <b>People First Pledge</b> to serve people first, independent of both major parties and big-money interests.</span></div>';

		var whyBody = d.why.trim() ? '<p class="authored-text">' + esc(d.why) + '</p>' : null;
		var issuesBody = issues.length ?
			'<ul class="issue-list">' + issues.map(function (i) {
				return '<li>' + icon('check', 16) + '<span><b>' + esc(i.title) + '</b>' +
					(i.position.trim() ? '<br><span class="issue-position">' + esc(i.position) + '</span>' : '') + '</span></li>';
			}).join('') + '</ul>' : null;
		var aboutBody = d.about.trim() ? '<p class="authored-text">' + esc(d.about) + '</p>' : null;

		var skippedNote = hasAny ? '' :
			'<div class="notice notice-blue">' + icon('pencil', 20, 'notice-ico') +
				'<div class="notice-body"><b>You have not added any content yet.</b> You can still finish claiming the profile — ' +
				'it just publishes with all three sections empty, exactly as it reads today. ' +
				'<button class="btn btn-sm btn-outline" style="margin-top:9px" data-go="edit">Add your details</button></div></div>';

		return '<div class="page mid screen">' +
			'<div class="stack-lg">' +
				'<div class="stack-sm">' +
					'<button class="btn btn-ghost btn-sm" style="align-self:flex-start;margin-left:-14px" data-go="verify">' + icon('back', 14) + ' Back</button>' +
					'<h1 class="h-xl">Review your profile</h1>' +
					'<p class="lede">Take a final look at the information voters will see on your public profile.</p>' +
				'</div>' +

				gate +
				skippedNote +

				'<div class="card flush review-frame">' +
					'<div class="review-bar">' +
						icon('eye', 16) + '<span class="review-bar-label">Preview</span>' +
						'<span class="review-url">' + esc(PUBLIC_URL) + '</span>' +
						'<span class="pill pill-gold review-bar-pill">' + icon('lock', 12) + ' Not public yet</span>' +
					'</div>' +

					'<div class="review-hero">' +
						'<span class="review-avatar">' + SPINE.initials + '</span>' +
						'<div class="review-hero-text">' +
							'<h2 class="h-md">' + esc(SPINE.fullName) + '</h2>' +
							'<p class="review-office">' + esc(SPINE.office) + '</p>' +
							'<p class="review-district">' + esc(SPINE.district) + '</p>' +
						'</div>' +
					'</div>' +
					'<div class="review-callout-wrap">' + pledgeLine + '</div>' +

					'<div class="review-body">' +
						sectionEdit('Why I’m Running for Office', whyBody, SPINE.fullName + ' has not filled out this section yet.') +
						sectionEdit('Campaign Issues', issuesBody, SPINE.fullName + ' has not shared their top campaign issues yet.') +
						sectionEdit('About Me', aboutBody, SPINE.fullName + ' has not filled out this section yet.') +
					'</div>' +
				'</div>' +

				'<div class="card pad-lg">' +
					'<h2 class="h-md" style="margin-bottom:10px">Before you publish</h2>' +
					'<div>' +
						'<div class="summary-row"><span class="summary-k">Profile address</span><span class="summary-v"><code class="url-code">' + esc(PUBLIC_URL) + '</code><br><span class="faint">Unchanged. Publishing never moves your page.</span></span></div>' +
						'<div class="summary-row"><span class="summary-k">People First Pledge</span><span class="summary-v">' +
							(state.pledge.taken ? '<span class="pill pill-gold">' + icon('star', 12) + ' Recorded</span>' :
							 state.role === 'rep' ? '<span class="faint">Not taken — a manager cannot pledge for the candidate</span>' :
							 '<span class="pill pill-red">' + icon('alert', 12) + ' Step not finished</span>') + '</span></div>' +
						'<div class="summary-row"><span class="summary-k">Profile access</span><span class="summary-v"><span class="pill ' + meta.cls + '">' + icon(meta.icon, 12) + ' ' + esc(meta.label) + '</span></span></div>' +
					'</div>' +
				'</div>' +

				'<div class="btn-row actions split">' +
					'<button class="btn btn-ghost" data-go="edit">' + icon('back', 15) + ' Back to editing</button>' +
					action +
				'</div>' +

				protoNote('Prototype. Nothing is published to goodparty.org — publishing only updates this prototype.') +
			'</div>' +
		'</div>';
	};

	 * profile's completion status, and does not claim the candidate was

<title>Claim Your Profile</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Open+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout concept: a fixed candidate rail pins Jordan Avery's identity to every
   screen; one centred column below it carries a single focused action per step. */
:root {
	--font-display: 'Outfit', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
	--font-body: 'Open Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;

	--bg: hsl(33 60% 97%);
	--surface: hsl(0 0% 100%);
	--surface-2: hsl(33 40% 98%);
	--surface-3: hsl(220 20% 96%);
	--fg: hsl(222 47% 11%);
	--fg-muted: hsl(220 14% 42%);
	--fg-faint: hsl(220 12% 56%);
	--border: hsl(220 16% 88%);
	--border-strong: hsl(220 14% 76%);

	--navy: hsl(220 58% 10%);
	--navy-2: hsl(224 59% 19%);
	--navy-3: hsl(220 58% 35%);
	--on-navy: hsl(0 0% 100%);
	--on-navy-muted: hsl(214 40% 78%);

	--accent: hsl(221 83% 53%);
	--accent-hover: hsl(221 83% 46%);
	--accent-soft: hsl(212 100% 96%);
	--accent-border: hsl(214 67% 82%);
	--on-accent: hsl(0 0% 100%);

	--gold: hsl(43 81% 51%);
	--gold-soft: hsl(44 100% 89%);
	--gold-fg: hsl(39 86% 25%);
	--gold-border: hsl(44 100% 57%);

	--red: hsl(349 83% 47%);
	--red-soft: hsl(0 100% 95%);
	--red-border: hsl(0 100% 84%);

	--green: hsl(159 46% 42%);
	--green-soft: hsl(151 45% 91%);
	--green-border: hsl(153 44% 79%);

	--lavender-soft: hsl(269 100% 93%);
	--lavender: hsl(262 71% 55%);

	--claim-g1: hsl(0 0% 100%);
	--claim-g2: hsl(0 100% 95%);
	--claim-g3: hsl(213 97% 87%);
	--claim-border: hsl(214 67% 82%);
	--claim-fg: hsl(222 47% 11%);
	--ring: hsl(221 83% 53% / 0.35);
	--shadow-sm: 0 1px 3px hsl(222 47% 11% / 0.08), 0 1px 2px hsl(222 47% 11% / 0.04);
	--shadow-md: 0 4px 14px hsl(222 47% 11% / 0.08), 0 2px 4px hsl(222 47% 11% / 0.04);
	--shadow-lg: 0 18px 40px hsl(222 47% 11% / 0.14), 0 4px 10px hsl(222 47% 11% / 0.06);

	--r-sm: 8px;
	--r-md: 12px;
	--r-lg: 16px;
	--r-xl: 24px;
	--r-2xl: 32px;
	--rail-h: 68px;
}

@media (prefers-color-scheme: dark) {
	:root:not([data-theme="light"]) {
		color-scheme: dark;
		--bg: hsl(222 50% 7%);
		--surface: hsl(222 42% 11%);
		--surface-2: hsl(222 40% 13%);
		--surface-3: hsl(222 36% 17%);
		--fg: hsl(210 30% 96%);
		--fg-muted: hsl(214 20% 72%);
		--fg-faint: hsl(214 15% 58%);
		--border: hsl(222 28% 22%);
		--border-strong: hsl(222 24% 32%);
		--navy: hsl(222 52% 9%);
		--navy-2: hsl(224 48% 16%);
		--navy-3: hsl(220 50% 30%);
		--on-navy: hsl(0 0% 100%);
		--on-navy-muted: hsl(214 32% 74%);
		--accent: hsl(217 92% 66%);
		--accent-hover: hsl(217 92% 74%);
		--accent-soft: hsl(222 44% 18%);
		--accent-border: hsl(220 40% 34%);
		--on-accent: hsl(222 60% 8%);
		--gold: hsl(44 90% 62%);
		--gold-soft: hsl(40 40% 18%);
	--gold-fg: hsl(44 90% 72%);
		--gold-border: hsl(42 60% 36%);
		--red: hsl(352 76% 62%);
		--red-soft: hsl(350 40% 18%);
		--red-border: hsl(350 42% 36%);
		--green: hsl(153 48% 55%);
		--green-soft: hsl(165 32% 15%);
		--green-border: hsl(162 32% 30%);
		--lavender-soft: hsl(262 36% 22%);
		--lavender: hsl(266 90% 78%);
		--claim-g1: hsl(222 42% 15%);
	--claim-g2: hsl(350 30% 17%);
	--claim-g3: hsl(216 45% 22%);
	--claim-border: hsl(220 40% 34%);
	--claim-fg: hsl(210 30% 96%);
	--ring: hsl(217 92% 66% / 0.4);
		--shadow-sm: 0 1px 3px hsl(0 0% 0% / 0.4);
		--shadow-md: 0 4px 14px hsl(0 0% 0% / 0.45);
		--shadow-lg: 0 18px 40px hsl(0 0% 0% / 0.55);
	}
}

:root[data-theme="dark"] {
	color-scheme: dark;
	--bg: hsl(222 50% 7%);
	--surface: hsl(222 42% 11%);
	--surface-2: hsl(222 40% 13%);
	--surface-3: hsl(222 36% 17%);
	--fg: hsl(210 30% 96%);
	--fg-muted: hsl(214 20% 72%);
	--fg-faint: hsl(214 15% 58%);
	--border: hsl(222 28% 22%);
	--border-strong: hsl(222 24% 32%);
	--navy: hsl(222 52% 9%);
	--navy-2: hsl(224 48% 16%);
	--navy-3: hsl(220 50% 30%);
	--on-navy: hsl(0 0% 100%);
	--on-navy-muted: hsl(214 32% 74%);
	--accent: hsl(217 92% 66%);
	--accent-hover: hsl(217 92% 74%);
	--accent-soft: hsl(222 44% 18%);
	--accent-border: hsl(220 40% 34%);
	--on-accent: hsl(222 60% 8%);
	--gold: hsl(44 90% 62%);
	--gold-soft: hsl(40 40% 18%);
	--gold-fg: hsl(44 90% 72%);
	--gold-border: hsl(42 60% 36%);
	--red: hsl(352 76% 62%);
	--red-soft: hsl(350 40% 18%);
	--red-border: hsl(350 42% 36%);
	--green: hsl(153 48% 55%);
	--green-soft: hsl(165 32% 15%);
	--green-border: hsl(162 32% 30%);
	--lavender-soft: hsl(262 36% 22%);
	--lavender: hsl(266 90% 78%);
	--claim-g1: hsl(222 42% 15%);
	--claim-g2: hsl(350 30% 17%);
	--claim-g3: hsl(216 45% 22%);
	--claim-border: hsl(220 40% 34%);
	--claim-fg: hsl(210 30% 96%);
	--ring: hsl(217 92% 66% / 0.4);
	--shadow-sm: 0 1px 3px hsl(0 0% 0% / 0.4);
	--shadow-md: 0 4px 14px hsl(0 0% 0% / 0.45);
	--shadow-lg: 0 18px 40px hsl(0 0% 0% / 0.55);
}

* { box-sizing: border-box; }

body {
	margin: 0;
	background: var(--bg);
	color: var(--fg);
	font-family: var(--font-body);
	font-size: 16px;
	line-height: 1.5;
	-webkit-font-smoothing: antialiased;
}

body::before {
	content: "";
	position: fixed;
	inset: 0 0 auto;
	height: env(safe-area-inset-top, 0px);
	z-index: 60;
	background: var(--navy);
}

h1, h2, h3, h4 { font-family: var(--font-display); font-weight: 600; margin: 0; text-wrap: balance; line-height: 1.25; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }

:focus-visible { outline: 3px solid var(--ring); outline-offset: 2px; border-radius: 4px; }

/* ---------- candidate rail (pinned to every screen) ---------- */
.rail {
	position: sticky;
	top: env(safe-area-inset-top, 0px);
	z-index: 50;
	background: var(--navy);
	color: var(--on-navy);
	border-bottom: 1px solid hsl(0 0% 100% / 0.1);
}
.rail-inner {
	max-width: 1180px;
	margin: 0 auto;
	min-height: var(--rail-h);
	display: flex;
	align-items: center;
	gap: 14px;
	padding-left: max(16px, env(safe-area-inset-left, 0px));
	padding-right: max(16px, env(safe-area-inset-right, 0px));
	padding-block: 10px;
}
.rail-mark {
	width: 42px; height: 42px; flex: none;
	border-radius: 999px;
	display: grid; place-items: center;
	font-family: var(--font-display);
	font-weight: 600; font-size: 15px;
	letter-spacing: 0.02em;
	background: linear-gradient(145deg, var(--navy-3), var(--navy-2));
	border: 2px solid hsl(0 0% 100% / 0.22);
	color: var(--on-navy);
}
.rail-mark.has-photo { background: var(--gold); color: var(--navy); border-color: var(--gold); }
.rail-id { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 1px; }
.rail-name { font-family: var(--font-display); font-weight: 600; font-size: 15px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rail-meta { font-size: 12.5px; color: var(--on-navy-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rail-right { display: flex; align-items: center; gap: 8px; flex: none; }
.rail-status {
	font-size: 11.5px; font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase;
	padding: 4px 10px; border-radius: 999px; white-space: nowrap;
	background: hsl(0 0% 100% / 0.1); color: var(--on-navy-muted); border: 1px solid hsl(0 0% 100% / 0.18);
}
.rail-status.is-draft { background: var(--gold-soft); color: hsl(39 86% 25%); border-color: var(--gold-border); }
.rail-status.is-live { background: var(--green-soft); color: hsl(170 66% 18%); border-color: var(--green-border); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .rail-status.is-draft { color: hsl(44 90% 72%); } :root:not([data-theme="light"]) .rail-status.is-live { color: hsl(153 48% 68%); } }
:root[data-theme="dark"] .rail-status.is-draft { color: hsl(44 90% 72%); }
:root[data-theme="dark"] .rail-status.is-live { color: hsl(153 48% 68%); }
.rail-theme {
	width: 34px; height: 34px; border-radius: 999px; display: grid; place-items: center;
	background: hsl(0 0% 100% / 0.08); border: 1px solid hsl(0 0% 100% / 0.18);
	color: var(--on-navy); cursor: pointer;
}
.rail-theme:hover { background: hsl(0 0% 100% / 0.16); }
@media (max-width: 620px) { .rail-meta-long { display: none; } }

/* ---------- step bar ---------- */
.steps { background: var(--surface); border-bottom: 1px solid var(--border); }
.steps-inner {
	max-width: 1180px; margin: 0 auto;
	display: flex; align-items: center; gap: 6px;
	padding-left: max(16px, env(safe-area-inset-left, 0px));
	padding-right: max(16px, env(safe-area-inset-right, 0px));
	padding-block: 10px;
	overflow-x: auto; scrollbar-width: none;
}
.steps-inner::-webkit-scrollbar { display: none; }
.step { display: flex; align-items: center; gap: 7px; flex: none; padding: 4px 2px; }
.step-dot {
	width: 21px; height: 21px; border-radius: 999px; flex: none;
	display: grid; place-items: center;
	font-size: 11px; font-weight: 700; font-family: var(--font-display);
	background: var(--surface-3); color: var(--fg-faint); border: 1px solid var(--border);
}
.step-label { font-size: 12.5px; color: var(--fg-faint); white-space: nowrap; font-weight: 500; }
.step.is-active .step-dot { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.step.is-active .step-label { color: var(--fg); font-weight: 600; }
.step.is-done .step-dot { background: var(--green); color: #fff; border-color: var(--green); }
.step.is-done .step-label { color: var(--fg-muted); }
.step-sep { width: 14px; height: 1px; background: var(--border-strong); flex: none; }

/* ---------- page shell ---------- */
.page {
	max-width: 1180px; margin: 0 auto;
	padding-left: max(16px, env(safe-area-inset-left, 0px));
	padding-right: max(16px, env(safe-area-inset-right, 0px));
	padding-block: 28px 72px;
}
.page.narrow { max-width: 760px; }
.page.mid { max-width: 940px; }

.stack { display: flex; flex-direction: column; gap: 18px; }
.stack-lg { display: flex; flex-direction: column; gap: 26px; }
.stack-sm { display: flex; flex-direction: column; gap: 10px; }

.screen { animation: enter 0.28s cubic-bezier(0.165, 0.84, 0.44, 1) both; }
@keyframes enter { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .screen { animation: none; } * { transition-duration: 0.01ms !important; } }

/* ---------- typography ---------- */
.eyebrow { font-family: var(--font-display); font-size: 12px; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; color: var(--fg-faint); }
.h-xl { font-size: clamp(28px, 5vw, 40px); }
.h-lg { font-size: clamp(24px, 4vw, 32px); }
.h-md { font-size: clamp(20px, 3vw, 24px); }
.h-sm { font-size: 17px; }
.lede { font-size: clamp(16px, 2vw, 18px); color: var(--fg-muted); max-width: 62ch; }
.muted { color: var(--fg-muted); font-size: 14.5px; }
.faint { color: var(--fg-faint); font-size: 13px; }

/* ---------- cards ---------- */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 22px; }
.card.pad-lg { padding: clamp(22px, 4vw, 34px); }
.card.flush { padding: 0; overflow: hidden; }
.card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; flex-wrap: wrap; }

/* ---------- buttons ---------- */
.btn {
	display: inline-flex; align-items: center; justify-content: center; gap: 8px;
	border-radius: 999px; border: 1px solid transparent; cursor: pointer;
	font-family: var(--font-body); font-weight: 600; font-size: 14px;
	padding: 0 22px; height: 44px; white-space: nowrap;
	transition: background-color 0.18s ease, color 0.18s ease, border-color 0.18s ease, transform 0.12s ease, opacity 0.18s ease;
}
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: var(--on-accent); }
.btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
.btn-navy { background: var(--navy-2); color: #fff; }
.btn-navy:hover:not(:disabled) { background: var(--navy-3); }
.btn-outline { background: transparent; color: var(--fg); border-color: var(--border-strong); }
.btn-outline:hover:not(:disabled) { background: var(--surface-3); }
.btn-ghost { background: transparent; color: var(--fg-muted); padding: 0 14px; }
.btn-ghost:hover:not(:disabled) { background: var(--surface-3); color: var(--fg); }
.btn-lg { height: 50px; font-size: 15px; padding: 0 28px; }
.btn-sm { height: 36px; font-size: 13px; padding: 0 16px; }
.btn-block { width: 100%; }
.btn-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn-row.end { justify-content: flex-end; }
.btn-row.split { justify-content: space-between; }
@media (max-width: 560px) {
	.btn-row.actions { flex-direction: column-reverse; align-items: stretch; }
	.btn-row.actions .btn { width: 100%; }
}

.spinner { width: 15px; height: 15px; border-radius: 999px; border: 2px solid currentColor; border-top-color: transparent; animation: spin 0.7s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- pills / chips ---------- */
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface-3); color: var(--fg-muted); white-space: nowrap; }
.pill-blue { background: var(--accent-soft); border-color: var(--accent-border); color: var(--accent); }
.pill-gold { background: var(--gold-soft); border-color: var(--gold-border); color: hsl(39 86% 28%); }
.pill-green { background: var(--green-soft); border-color: var(--green-border); color: hsl(170 66% 20%); }
.pill-red { background: var(--red-soft); border-color: var(--red-border); color: var(--red); }
.pill-lav { background: var(--lavender-soft); border-color: var(--lavender); color: var(--lavender); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .pill-gold { color: var(--gold); } :root:not([data-theme="light"]) .pill-green { color: var(--green); } }
:root[data-theme="dark"] .pill-gold { color: var(--gold); }
:root[data-theme="dark"] .pill-green { color: var(--green); }
.pill-row { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }

/* "proposal" marker for unconfirmed implementation detail */
.proposal {
	display: inline-flex; align-items: center; gap: 4px;
	font-size: 10.5px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase;
	padding: 2px 7px; border-radius: 4px;
	background: var(--lavender-soft); color: var(--lavender);
	border: 1px dashed var(--lavender);
	vertical-align: middle;
}

/* ---------- notices ---------- */
.notice { display: flex; gap: 11px; padding: 14px 16px; border-radius: var(--r-md); border: 1px solid var(--border); background: var(--surface-3); font-size: 14.5px; align-items: flex-start; }
.notice-ico { flex: none; width: 20px; height: 20px; margin-top: 1px; }
.notice-gold { background: var(--gold-soft); border-color: var(--gold-border); }
.notice-blue { background: var(--accent-soft); border-color: var(--accent-border); }
.notice-green { background: var(--green-soft); border-color: var(--green-border); }
.notice-red { background: var(--red-soft); border-color: var(--red-border); }
.notice b { font-weight: 700; }
.notice-body { min-width: 0; }

/* ---------- forms ---------- */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field-label { font-size: 13.5px; font-weight: 600; color: var(--fg); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.field-hint { font-size: 12.5px; color: var(--fg-faint); }
.input, .textarea, .select {
	width: 100%; background: var(--surface); color: var(--fg);
	border: 1px solid var(--border-strong); border-radius: var(--r-sm);
	padding: 11px 13px; font-size: 15px; font-family: var(--font-body);
	transition: border-color 0.15s ease, box-shadow 0.15s ease;
}
.input:focus, .textarea:focus, .select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--ring); }
.textarea { min-height: 128px; resize: vertical; line-height: 1.55; }
.input[aria-invalid="true"], .textarea[aria-invalid="true"] { border-color: var(--red); }
.input[aria-invalid="true"]:focus, .textarea[aria-invalid="true"]:focus { box-shadow: 0 0 0 3px hsl(349 83% 47% / 0.25); }
.input:disabled, .select:disabled { background: var(--surface-3); color: var(--fg-muted); cursor: not-allowed; }
.err { font-size: 12.5px; color: var(--red); font-weight: 600; display: flex; gap: 5px; align-items: center; }
.err[hidden] { display: none !important; }
.counter { font-size: 12px; color: var(--fg-faint); font-variant-numeric: tabular-nums; }
.counter.over { color: var(--red); font-weight: 600; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 620px) { .grid-2 { grid-template-columns: 1fr; } }

.locked {
	display: flex; align-items: center; gap: 10px;
	background: var(--surface-3); border: 1px solid var(--border);
	border-radius: var(--r-sm); padding: 11px 13px; font-size: 15px; color: var(--fg);
}
.locked-ico { flex: none; color: var(--fg-faint); }
.locked-val { min-width: 0; overflow-wrap: anywhere; }

.check { display: flex; gap: 12px; align-items: flex-start; cursor: pointer; padding: 14px; border: 1px solid var(--border); border-radius: var(--r-md); background: var(--surface); transition: border-color 0.15s ease, background-color 0.15s ease; }
.check:hover { border-color: var(--border-strong); }
.check.is-on { border-color: var(--accent); background: var(--accent-soft); }
.check input { margin: 0; width: 19px; height: 19px; flex: none; accent-color: var(--accent); margin-top: 2px; cursor: pointer; }
.check-body { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.check-title { font-weight: 600; font-size: 15px; font-family: var(--font-display); }
.check-sub { font-size: 13.5px; color: var(--fg-muted); line-height: 1.5; }

.radio-card { display: flex; gap: 12px; align-items: flex-start; cursor: pointer; padding: 16px; border: 1px solid var(--border); border-radius: var(--r-md); background: var(--surface); transition: border-color 0.15s ease, background-color 0.15s ease; }
.radio-card:hover { border-color: var(--border-strong); }
.radio-card.is-on { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 1px var(--accent); }
.radio-card input { margin: 0; width: 18px; height: 18px; flex: none; accent-color: var(--accent); margin-top: 3px; cursor: pointer; }

/* ---------- choose a path ---------- */
.selected-candidate {
	display: flex; align-items: center; gap: 12px;
	background: var(--surface); border: 1px solid var(--border);
	border-radius: var(--r-md); padding: 12px 16px;
}
.selected-mark {
	width: 40px; height: 40px; flex: none; border-radius: 999px;
	display: grid; place-items: center;
	font-family: var(--font-display); font-weight: 600; font-size: 14px; color: #fff;
	background: linear-gradient(145deg, var(--navy-3), var(--navy-2));
}
.selected-id { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.selected-name { font-family: var(--font-display); font-weight: 600; font-size: 16px; }
.selected-meta { font-size: 13.5px; color: var(--fg-muted); overflow-wrap: anywhere; }

.choice-card { padding: 18px; }
.choice-card .check-body { gap: 6px; }
.choice-card .check-title { font-size: 17px; }
.choice-who { font-size: 14px; font-weight: 600; color: var(--accent); }
.choice-card.is-on .choice-who { color: var(--accent); }
.choice-steps {
	list-style: none; margin: 8px 0 0; padding: 0;
	display: flex; flex-wrap: wrap; gap: 7px 10px;
}
.choice-steps li {
	display: flex; align-items: center; gap: 6px;
	font-size: 13px; color: var(--fg-muted);
	background: var(--surface-3); border: 1px solid var(--border);

	function icon(name, size, cls) {
		var d = ICONS[name] || '';
		var s = size || 18;
		return '<svg class="' + (cls || '') + '" width="' + s + '" height="' + s + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
			'stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + d + '</svg>';
	}

	function esc(s) {
		return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
			return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
		});
	}

	/* ------------------------------------------------------------------ *
	 * Routing. The screen name lives in the hash so the browser's own back
	 * and forward buttons work; everything the user typed lives in `state`,
	 * so moving between screens never loses it.
	 * ------------------------------------------------------------------ */
	var SCREENS = {};
	var VALID = ['profile', 'path', 'account', 'edit', 'pledge', 'verify', 'preview', 'done', 'voter-review', 'voter-sent'];

	function go(name) {
		if (location.hash.slice(1) === name) { render(); return; }
		location.hash = name;
	}

	function current() {
		var h = location.hash.slice(1);
		return VALID.indexOf(h) >= 0 ? h : 'profile';
	}

	window.addEventListener('hashchange', function () {
		state.screen = current();
		render();
		window.scrollTo({ top: 0, behavior: 'instant' in document.documentElement.style ? 'instant' : 'auto' });
	});

	/* ---------------- derived status ---------------- */

	function profileStatus() {
		if (state.publish.published) return { label: 'Claimed', cls: 'is-live' };
		if (state.pledge.taken || state.draft.saved || state.draft.touched || state.account.loggedIn) return { label: 'Draft — private', cls: 'is-draft' };
		return { label: 'Unclaimed', cls: '' };
	}

	var LIMITS = { why: 1000, about: 1500, issueTitle: 70, issuePosition: 300 };
	var MAX_ISSUES = 6;

	/* An issue row counts only once it has a title; rows left entirely blank
	   are dropped on save rather than nagged about. */
	function filledIssues() {
		return state.draft.issues.filter(function (i) { return i.title.trim(); });
	}

	function issueRowIsBlank(i) {
		return !i.title.trim() && !i.position.trim();
	}

	/* Three sections, each either added or not. Nothing here is required. */
	function sectionsAdded() {
		return [!!state.draft.why.trim(), filledIssues().length > 0, !!state.draft.about.trim()];
	}

	function addedCount() {
		return sectionsAdded().filter(Boolean).length;
	}

	function newIssue() {
		return { id: 'iss-' + (Date.now().toString(36)) + Math.random().toString(36).slice(2, 6), title: '', position: '' };
	}

	function verifyStatusLabel() {
		if (state.verify.status === 'verified') return 'Verified';
		if (state.verify.status === 'pending') return 'In review';
		return 'Not verified';
	}

	/* ---------------- chrome ---------------- */

	function updateRail() {
		var st = profileStatus();
		var el = document.getElementById('railStatus');
		el.textContent = st.label;
		el.className = 'rail-status ' + st.cls;
		var mark = document.getElementById('railMark');
		mark.textContent = SPINE.initials;
	}

	var CANDIDATE_STEPS = [
		{ id: 'account', label: 'Account' },
		{ id: 'edit', label: 'Profile' },
		{ id: 'pledge', label: 'Pledge' },
		{ id: 'verify', label: 'Verify' },
		{ id: 'preview', label: 'Publish' }
	];
	var VOTER_STEPS = [
		{ id: 'voter-review', label: 'Review request' },
		{ id: 'voter-sent', label: 'Confirmation' }
	];

	function renderSteps() {
		var host = document.getElementById('stepBar');
		var scr = state.screen;
		var steps = null;
		if (CANDIDATE_STEPS.some(function (s) { return s.id === scr; }) || (scr === 'done' && state.path === 'candidate')) {
			steps = CANDIDATE_STEPS;
		} else if (VOTER_STEPS.some(function (s) { return s.id === scr; })) {
			steps = VOTER_STEPS;
		}
		if (!steps) { host.innerHTML = ''; return; }

		var activeIdx = steps.map(function (s) { return s.id; }).indexOf(scr);
		if (scr === 'done') activeIdx = steps.length;

		var html = steps.map(function (s, i) {
			var done = i < activeIdx;
			var active = i === activeIdx;
			var cls = 'step' + (active ? ' is-active' : done ? ' is-done' : '');
			var dot = done ? icon('check', 12) : String(i + 1);
			return '<div class="' + cls + '"><span class="step-dot">' + dot + '</span><span class="step-label">' + esc(s.label) + '</span></div>' +
				(i < steps.length - 1 ? '<span class="step-sep"></span>' : '');
		}).join('');

		host.innerHTML = '<nav class="steps" aria-label="Progress"><div class="steps-inner">' + html + '</div></nav>';
	}

	var toastTimer = null;
	function toast(msg, ico) {
		var host = document.getElementById('toastHost');
		host.innerHTML = '<div class="toast" role="status">' + icon(ico || 'check', 16) + '<span>' + esc(msg) + '</span></div>';
		clearTimeout(toastTimer);
		toastTimer = setTimeout(function () { host.innerHTML = ''; }, 3200);
	}

	function protoNote(text) {
		return '<p class="prototype-note">' + icon('info', 14) + '<span>' + text + '</span></p>';
	}

	/* ---------------- shared partials ---------------- */

	/* ------------------------------------------------------------------ *
	 * The public profile, rebuilt against the live /people/* page:
	 * a midnight hero band with the portrait straddling its lower edge,
	 * then a two-column content well — sticky sidebar on the left, a
	 * column of separate white cards on the right with the cream page
	 * showing through the gaps.
	 * ------------------------------------------------------------------ */

	function heroBlock() {
		var published = state.publish.published;
		var pledged = state.pledge.taken;

		var calloutText = pledged ?
			'This candidate took the <b>People First Pledge</b>, promising to serve people first, independent of both major parties and big-money interests.' :
			'This candidate has not yet taken the <b>People First Pledge</b> to serve people first, independent of both major parties and big-money interests.';

		return '<section class="hero">' +
			'<div class="hero-inner">' +
				'<div class="hero-avatar">' + SPINE.initials + '</div>' +
				'<div class="hero-text">' +
					'<div class="pill-row">' +
						'<span class="hero-tag">Candidate</span>' +
						(published ? '<span class="pill pill-green">Claimed</span>' : '') +
					'</div>' +
					'<div class="hero-name-office">' +
						'<h1 class="hero-name">' + esc(SPINE.fullName) + '</h1>' +
						'<p class="hero-office">' + esc(SPINE.office) + '</p>' +
						'<p class="hero-district">' + esc(SPINE.district) + '</p>' +
					'</div>' +
					'<div class="hero-callout">' +
						'<span class="hero-callout-mark" style="color:' + (pledged ? 'var(--gold)' : 'var(--on-navy-muted)') + '">' + icon('star', 26) + '</span>' +
						'<span>' + calloutText + '</span>' +
					'</div>' +
				'</div>' +
			'</div>' +
		'</section>';
	}

	/* The sidebar's rows, in the order the live profile card lists them:
	   Election Date, Political Affiliation, then the pledge row. */
	function sidebarBlock() {
		var pledged = state.pledge.taken;
		var rows = '';

		rows += '<div class="side-block">' +
			'<dt class="side-label">Election Date</dt>' +
			'<dd class="side-value">' + icon('calendar', 17) + '<span>' + esc(SPINE.electionDate) + '</span></dd>' +
		'</div>';

		rows += '<div class="side-block">' +
			'<dt class="side-label">Political Affiliation</dt>' +
			'<dd class="side-value">' + icon('flag', 17) + '<span>' + esc(SPINE.affiliation) + '</span></dd>' +
		'</div>';

		rows += '<div class="side-block">' +
			'<dt class="side-label">' + (pledged ? 'Took the People First Pledge' : 'People First Pledge') + '</dt>' +
			'<dd class="side-value">' +
				'<span style="color:' + (pledged ? 'var(--gold)' : 'var(--fg-faint)') + '">' + icon('star', 17) + '</span>' +
				'<span' + (pledged ? '' : ' style="color:var(--fg-faint)"') + '>' + (pledged ? 'Signed on November 10, 2026' : 'Not yet taken') + '</span>' +
			'</dd>' +
		'</div>';

		rows += '<div class="side-block"><dt class="side-label">Contact</dt>' +
			'<dd class="side-value" style="color:var(--fg-faint)">' + icon('mail', 17) + '<span>No contact details yet</span></dd></div>';

		return '<aside class="profile-side"><dl class="side-card">' + rows + '</dl></aside>';
	}

	/* A card holding one or two sections. The first heading is the large
	   one; a second section inside the same card steps down a size, the
	   way the live profile bundles Why with Campaign Issues. */
	function profileCard(sections) {
		return '<article class="card profile-card">' + sections.map(function (sec, i) {
			return '<section class="profile-section">' +
				'<h2 class="' + (i === 0 ? 'section-heading' : 'section-subheading') + '">' + esc(sec.heading) + '</h2>' +
				sec.content +
			'</section>';
		}).join('') + '</article>';
	}

	function placeholder(text) {
		return '<p class="placeholder-prompt">' + esc(text) + '</p>';
	}

	function authoredDisclaimer() {
		return '<p class="authored-disclaimer">These statements come from ' + esc(SPINE.fullName) +
			' and do not reflect any positions or stances on individual issues held by GoodParty.org.</p>';
	}

	/* ================================================================== *
	 * SCREEN 1 — the public candidate profile. Entry point for the whole
	 * prototype, and the place every path returns to.
	 * ================================================================== */
	SCREENS.profile = function () {
		var published = state.publish.published;
		var d = state.draft;
		var resumable = !published && (d.saved || state.account.loggedIn);

		/* ---- the claim callout, first in the card column ---- */
		var claimCard = '';
		if (!published) {
			claimCard = '<article class="claim-card">' +
				'<div class="claim-text">' +
					'<h2 class="section-heading">This profile is incomplete.</h2>' +
					'<p class="claim-body">Are you ' + esc(SPINE.fullName) + '? Claim your profile and share your top priorities with voters. ' +
					'Not ' + esc(SPINE.fullName) + '? Ask this candidate to complete their profile today.</p>' +
				'</div>' +
				'<button class="btn btn-navy btn-lg claim-cta" data-go="path">' +
					(resumable ? 'Continue where you left off' : 'Get started') + ' ' + icon('ext', 16) +
				'</button>' +
			'</article>';
		} else {
			claimCard = '<article class="card profile-card"><div class="profile-section">' +
				'<div class="card-head">' +
					'<div><h2 class="section-subheading">Your profile</h2>' +
					'<p class="muted" style="margin-top:4px">You claimed this page. Edits stay private until you publish them.</p></div>' +
					'<button class="btn btn-outline btn-sm" data-go="edit">' + icon('pencil', 14) + ' Edit profile</button>' +
				'</div>' +
			'</div></article>';
		}

		/* ---- banners ---- */
		var banner = '';
		if (published) {
			banner = '<div class="notice notice-green">' + icon('check', 20, 'notice-ico') +
				'<div class="notice-body"><b>Your profile is live.</b> Voters in ' + esc(SPINE.district) +
				' can now see your profile. Changes you make stay private until you publish them.</div></div>';
		} else if (resumable) {
			banner = '<div class="notice notice-gold">' + icon('clock', 20, 'notice-ico') +
				'<div class="notice-body"><b>You have an unfinished draft.</b> Nothing you have written is public yet.</div></div>';
		}

		/* ---- Why I'm Running + Campaign Issues (one card) ---- */
		var whyContent = published && d.why.trim() ?
			'<p class="authored-text">' + esc(d.why) + '</p>' :
			placeholder(SPINE.fullName + ' has not filled out this section yet.');

		var shownIssues = published ? filledIssues() : [];
		var issuesContent;
		if (shownIssues.length) {
			issuesContent = '<ul class="issue-list">' + shownIssues.map(function (i) {
				return '<li>' + icon('check', 16) + '<span><b>' + esc(i.title) + '</b>' +
					(i.position.trim() ? '<br><span class="issue-position">' + esc(i.position) + '</span>' : '') + '</span></li>';
			}).join('') + '</ul>' + authoredDisclaimer();
		} else {
			issuesContent = placeholder(SPINE.fullName + ' has not shared their top campaign issues yet.');
		}

		var platformCard = profileCard([
			{ heading: 'Why I’m Running for Office', content: whyContent },
			{ heading: 'Campaign Issues', content: issuesContent }
		]);

		/* ---- About Me + Recent Experience (one card) ---- */
		var aboutContent = published && d.about.trim() ?
			'<p class="authored-text">' + esc(d.about) + '</p>' + authoredDisclaimer() :
			placeholder(SPINE.fullName + ' has not filled out this section yet.');

		var experienceContent = '<ul class="experience-list">' +
			'<li>' + icon('briefcase', 17) +
				'<span><b>' + esc(SPINE.office) + '</b><br><span class="faint">' + esc(SPINE.district) + ' · ' + esc(SPINE.electionDate) + '</span></span>' +
			'</li>' +
		'</ul>';

		var aboutCard = profileCard([
			{ heading: 'About Me', content: aboutContent },
			{ heading: 'Recent Experience', content: experienceContent }
		]);

		/* ---- About this position ---- */
		var positionCard = profileCard([{
			heading: 'About This Position',
			content: '<p class="muted" style="color:var(--fg)">Members of the U.S. House of Representatives serve two-year terms and represent ' +
				'a single congressional district. ' + esc(SPINE.districtShort) + ' covers Minneapolis and several neighbouring communities.</p>'
		}]);

		/* ---- District Information ---- */
		var districtCard = profileCard([{
			heading: 'District Information',
			content: '<div class="map-stub">' + icon('pin', 20) + '<span style="margin-left:6px">' + esc(SPINE.districtShort) + ' voter density</span></div>' +
				'<p class="faint" style="margin-top:10px">Source: ' + esc(SPINE.source) + '</p>'
		}]);

		return '<div class="page profile-page screen">' +
			heroBlock() +
			'<div class="profile-grid">' +
				sidebarBlock() +
				'<div class="profile-column">' +
					(banner ? banner : '') +
					claimCard +
					platformCard +
					aboutCard +
					positionCard +
					districtCard +
					protoNote('Prototype. Jordan Avery is a fictional candidate and this page is not connected to GoodParty.org. Items marked <span class="proposal">Proposal</span> are design suggestions, not confirmed behaviour.') +
				'</div>' +
			'</div>' +
		'</div>';
	};

	/* ================================================================== *
	 * SCREEN 2 — choose a path. Two selectable cards and one Continue
	 * button; the profile being acted on is named at the top so there is
	 * never any doubt whose page this is.
	 * ================================================================== */
	SCREENS.path = function () {
		var chosen = state.path;

		var options = [
			{
				id: 'candidate',
				title: 'Claim this profile',
				who: 'I’m ' + SPINE.fullName + ' or someone authorized to manage this profile.',
				detail: 'Four short steps. You can stop and finish later.',
				steps: ['Create an account', 'Update the profile', 'Take the pledge', 'Verify your identity']
			},
			{
				id: 'voter',
				title: 'Ask ' + SPINE.fullName + ' to complete this profile',
				who: 'I’m a voter who wants to learn more about this candidate.',
				detail: 'You’ll send a request asking ' + SPINE.firstName + ' to add their background and campaign priorities. No account needed.',
				steps: null
			}
		];

		var cards = options.map(function (o) {
			var on = chosen === o.id;
			var steps = o.steps ?
				'<ol class="choice-steps">' + o.steps.map(function (st, i) {
					return '<li><span class="choice-step-n">' + (i + 1) + '</span>' + esc(st) + '</li>';
				}).join('') + '</ol>' : '';
			return '<label class="radio-card choice-card' + (on ? ' is-on' : '') + '">' +
				'<input type="radio" name="pathChoice" data-path="' + o.id + '"' + (on ? ' checked' : '') + '>' +
				'<span class="check-body">' +
					'<span class="check-title">' + esc(o.title) + '</span>' +
					'<span class="choice-who">' + esc(o.who) + '</span>' +
					'<span class="check-sub">' + esc(o.detail) + '</span>' +
					steps +
				'</span>' +
			'</label>';
		}).join('');

		return '<div class="page narrow screen">' +
			'<div class="stack-lg">' +

				'<div class="selected-candidate">' +
					'<span class="selected-mark">' + SPINE.initials + '</span>' +
					'<span class="selected-id">' +
						'<span class="selected-name">' + esc(SPINE.fullName) + '</span>' +
						'<span class="selected-meta">' + esc(SPINE.office) + ' · ' + esc(SPINE.district) + '</span>' +
					'</span>' +
				'</div>' +

				'<div class="stack-sm">' +
					'<h1 class="h-xl">How would you like to continue?</h1>' +
					'<p class="lede">Choose what you’d like to do with ' + esc(SPINE.fullName) + '’s profile.</p>' +
				'</div>' +

				'<div class="stack" role="radiogroup" aria-label="How would you like to continue?">' + cards + '</div>' +

				'<div class="stack-sm">' +
					'<div class="btn-row actions split">' +
						'<button class="btn btn-ghost" data-go="profile">' + icon('back', 15) + ' Back to profile</button>' +
						'<button class="btn btn-primary btn-lg" id="pathContinue"' + (chosen ? '' : ' disabled') + '>Continue ' + icon('arrow', 15) + '</button>' +
					'</div>' +
					'<p class="faint" id="pathHint"' + (chosen ? ' hidden' : '') + ' style="text-align:right">Choose an option to continue.</p>' +
				'</div>' +

				protoNote('Prototype. Nothing on either path creates an account, sends a request, or verifies anyone.') +
			'</div>' +
		'</div>';
	};

	/* ================================================================== *
	 * SCREEN 3 — create an account, or sign in. Two columns on desktop:
	 * the profile being claimed on the left, the form on the right.
	 * ================================================================== */
	SCREENS.account = function () {
		var a = state.account;
		var signup = a.mode === 'signup';

		/* ---------- left: what is being claimed, and what follows ---------- */
		var nextSteps = ['Update your profile.', 'Take the People First Pledge.', 'Verify your identity before publishing.'];

		var summary = '<aside class="auth-summary">' +
			'<div class="card auth-preview">' +
				'<p class="eyebrow">Claiming</p>' +
				'<div class="auth-person">' +
					'<span class="auth-mark">' + SPINE.initials + '</span>' +
					'<span class="auth-person-id">' +
						'<span class="auth-person-name">' + esc(SPINE.fullName) + '</span>' +

					'<label class="field-label" for="lastName">Last name</label>' +

					'<p class="err" id="err-lastName" hidden></p>' +

				'<input type="checkbox" id="terms" data-terms' + (a.terms ? ' checked' : '') + '>' +
				'<span class="check-body"><span class="check-sub">I agree to GoodParty.org’s ' +

		var form = '<div class="card pad-lg auth-form">' +

					'<h2 class="h-md">' + (signup ? 'Create your account' : 'Sign in') + '</h2>' +

					'<p class="err" id="err-email" hidden></p>' +

				'<div class="field">' +
					'<label class="field-label" for="password">Password</label>' +

						'<button type="button" id="pwToggle" class="pw-toggle" aria-label="Show password">' + icon('eye', 17) + '</button>' +

					(signup ? '<p class="field-hint">At least 8 characters.</p>' : '') +

	/* ================================================================== *
	 * SCREEN 4 — the profile editor. Everything editable sits on one
	 * screen in three sections. None of it is required to move on.
	 * ================================================================== */

	/* Set when a re-render should land the caret somewhere specific, so
	   adding an issue puts you straight in its title field. */
	var pendingFocus = null;

	function counterEl(id, used, max) {
		var over = used > max;
		return '<span class="counter' + (over ? ' over' : '') + '" id="' + id + '">' + used + ' / ' + max + '</span>';
	}

	function issueEditor(issue, index) {
		var titleUsed = issue.title.length;
		var posUsed = issue.position.length;
		return '<li class="issue-row" data-issue-row="' + issue.id + '">' +
			'<div class="issue-row-head">' +
				'<span class="issue-n">Issue ' + (index + 1) + '</span>' +
				'<button type="button" class="issue-remove" data-remove-issue="' + issue.id + '" aria-label="Remove issue ' + (index + 1) + '">' +
					icon('x', 14) + '<span>Remove</span>' +
				'</button>' +
			'</div>' +
			'<div class="field">' +
				'<label class="field-label" for="it-' + issue.id + '">Issue' +
					counterEl('c-it-' + issue.id, titleUsed, LIMITS.issueTitle) + '</label>' +
				'<input class="input" id="it-' + issue.id + '" data-issue-title="' + issue.id + '" value="' + esc(issue.title) + '" placeholder="Healthcare costs">' +
				'<p class="err" id="err-it-' + issue.id + '" hidden></p>' +
			'</div>' +
			'<div class="field">' +
				'<label class="field-label" for="ip-' + issue.id + '">Your position' +
					counterEl('c-ip-' + issue.id, posUsed, LIMITS.issuePosition) + '</label>' +
				'<textarea class="textarea textarea-sm" id="ip-' + issue.id + '" data-issue-position="' + issue.id + '" placeholder="What you would do about it.">' + esc(issue.position) + '</textarea>' +
				'<p class="err" id="err-ip-' + issue.id + '" hidden></p>' +
			'</div>' +
		'</li>';
	}

	SCREENS.edit = function () {

		var added = sectionsAdded();
		var count = addedCount();

		var progressRows = [
			{ label: 'Why I’m Running', on: added[0] },
			{ label: 'Campaign Issues', on: added[1] },
			{ label: 'About Me', on: added[2] }
		].map(function (r) {
			return '<li class="prog-row' + (r.on ? ' is-on' : '') + '">' +
				'<span class="prog-tick">' + (r.on ? icon('check', 12) : '') + '</span>' +
				'<span>' + esc(r.label) + '</span>' +
			'</li>';
		}).join('');

		var sidebar = '<aside class="edit-side">' +
			'<div class="card edit-person">' +
				'<div class="auth-person">' +
					'<span class="auth-mark">' + SPINE.initials + '</span>' +
					'<span class="auth-person-id">' +
						'<span class="auth-person-name">' + esc(SPINE.fullName) + '</span>' +
						'<span class="auth-person-office">' + esc(SPINE.office) + '</span>' +
					'</span>' +
				'</div>' +
				'<p class="edit-district">' + esc(SPINE.district) + '</p>' +
				'<div class="edit-status">' +

				'</div>' +
			'</div>' +

			'<div class="card edit-progress">' +
				'<div class="prog-head">' +
					'<h2 class="h-sm">Your progress</h2>' +

				'<div class="prog-bar" role="progressbar" aria-valuenow="' + count + '" aria-valuemin="0" aria-valuemax="3" aria-label="Sections added">' +
					'<span style="width:' + (count / 3 * 100) + '%"></span>' +
				'</div>' +
				'<ul class="prog-list">' + progressRows + '</ul>' +
				'<p class="save-state" id="saveState">' + (d.saved ? icon('check', 13) + '<span>Draft saved</span>' : icon('lock', 13) + '<span>Saved privately as you type</span>') + '</p>' +
			'</div>' +

			'<div class="card edit-locked">' +
				'<h2 class="h-sm">From public records</h2>' +
				'<dl class="locked-list">' +
					'<div><dt>Office</dt><dd>' + icon('lock', 13) + esc(SPINE.office) + '</dd></div>' +
					'<div><dt>District</dt><dd>' + icon('lock', 13) + esc(SPINE.district) + '</dd></div>' +
					'<div><dt>Election</dt><dd>' + icon('lock', 13) + esc(SPINE.electionDate) + '</dd></div>' +
					'<div><dt>Affiliation</dt><dd>' + icon('lock', 13) + esc(SPINE.affiliation) + '</dd></div>' +
				'</dl>' +
				'<p class="faint">Read-only. Corrections are made at the source, not here. ' +
					'<a href="#edit" data-noop="1">Report a problem</a> <span class="proposal">Proposal</span></p>' +
			'</div>' +
		'</aside>';

		/* ---------------- right: the three sections ---------------- */
		var publicChip = '<span class="pill pill-blue public-chip">' + icon('eye', 12) + ' Public</span>';

		var whySection = '<section class="card pad-lg edit-section" id="section-why">' +
			'<div class="section-head">' +
				'<h2 class="h-md">Why I’m Running for Office</h2>' + publicChip +
			'</div>' +
			'<p class="muted section-guide">Share what made you decide to run and what you want to change. Voters read this section first. ' +
				'Two or three short paragraphs is plenty.</p>' +
			'<div class="field">' +
				'<label class="field-label" for="why">Your answer' + counterEl('c-why', d.why.length, LIMITS.why) + '</label>' +
				'<textarea class="textarea textarea-lg" id="why" data-model="draft.why" placeholder="I am running because…">' + esc(d.why) + '</textarea>' +
				'<p class="err" id="err-why" hidden></p>' +
			'</div>' +
		'</section>';

		var issuesBody;
		if (d.issues.length) {
			issuesBody = '<ul class="issue-list-edit">' + d.issues.map(issueEditor).join('') + '</ul>';
		} else {
			issuesBody = '<div class="empty">' + icon('vote', 22) +
				'<span class="empty-title">No issues added yet</span>' +
				'<span class="empty-sub">Add the issues you are running on and say where you stand on each.</span>' +
			'</div>';
		}

		var addBtn = d.issues.length >= MAX_ISSUES ?
			'<p class="faint">' + MAX_ISSUES + ' is the maximum. Remove one to add another.</p>' :
			'<button type="button" class="btn btn-outline btn-sm" id="addIssue">' + icon('plus', 14) + ' Add an issue</button>';

		var issuesSection = '<section class="card pad-lg edit-section" id="section-issues">' +

				'<h2 class="h-md">Campaign Issues</h2>' + publicChip +

			issuesBody +
			'<p class="err" id="err-issues" hidden></p>' +
			'<div class="issue-add">' + addBtn + '</div>' +

		var aboutSection = '<section class="card pad-lg edit-section" id="section-about">' +
			'<div class="section-head">' +
				'<h2 class="h-md">About Me</h2>' + publicChip +
			'</div>' +
			'<p class="muted section-guide">Your background, your work, and the experience you bring. Write it the way you would introduce yourself at a community meeting.</p>' +
			'<div class="field">' +
				'<label class="field-label" for="about">Your answer' + counterEl('c-about', d.about.length, LIMITS.about) + '</label>' +
				'<textarea class="textarea textarea-lg" id="about" data-model="draft.about" placeholder="I have spent…">' + esc(d.about) + '</textarea>' +
				'<p class="err" id="err-about" hidden></p>' +
			'</div>' +

		return '<div class="page mid screen">' +
			'<div class="stack-lg">' +
				'<div class="stack-sm">' +
					'<button class="btn btn-ghost btn-sm" style="align-self:flex-start;margin-left:-14px" data-go="path">' + icon('back', 14) + ' Back</button>' +
					'<h1 class="h-xl">Complete your profile</h1>' +
					'<p class="lede">Add or update your information for voters. We’ve filled in what we already know, so you can make changes quickly.</p>' +

				'<div class="notice notice-gold">' + icon('lock', 20, 'notice-ico') +
					'<div class="notice-body"><b>This is a private draft.</b> Everything marked ' + publicChip +
					' appears on your public profile once you publish — and not before. Nothing is required to continue.</div></div>' +

				'<div class="edit-grid">' +
					sidebar +
					'<div class="edit-main">' +
						whySection +
						issuesSection +
						aboutSection +

						'</div>' +

				'</div>' +

				protoNote('Prototype. Nothing is saved to GoodParty.org. Both buttons go to the pledge step and keep whatever you have written.') +
			'</div>' +
		'</div>';

	/* ================================================================== *
	 * SCREEN 5 — the People First Pledge. Eligibility is shown before the
	 * commitments, because a partisan affiliation disqualifies outright.
	 * ================================================================== */
	SCREENS.pledge = function () {
		var p = state.pledge;
		var allAgreed = PLEDGE_PILLARS.every(function (x) { return p.agreed[x.key]; });

		var pillars = PLEDGE_PILLARS.map(function (x) {
			var on = p.agreed[x.key];
			return '<label class="check' + (on ? ' is-on' : '') + '" style="align-items:flex-start">' +
				'<input type="checkbox" data-pledge="' + x.key + '"' + (on ? ' checked' : '') + '>' +
				'<span class="check-body">' +
					'<span style="display:flex;align-items:center;gap:10px;margin-bottom:4px">' +
						'<span class="pillar-ico" style="width:32px;height:32px;background:' + x.bg + ';color:' + x.fg + '">' + icon(x.icon, 17) + '</span>' +
						'<span class="check-title">' + esc(x.title) + '</span>' +
					'</span>' +
					'<span class="check-sub">' + esc(x.body) + '</span>' +
				'</span>' +
			'</label>';
		}).join('');

		return '<div class="page mid screen">' +
			'<div class="stack-lg">' +
				'<div class="stack-sm">' +
					'<button class="btn btn-ghost btn-sm" style="align-self:flex-start;margin-left:-14px" data-go="edit">' + icon('back', 14) + ' Back</button>' +
					'<span class="eyebrow">Step 3 of 5</span>' +
					'<h1 class="h-xl">The People First Pledge</h1>' +
					'<p class="lede">GoodParty.org only works with candidates and elected officials who agree to serve people first, ' +
					'independent of both major parties and big-money interests. Their stances on individual issues vary. ' +
					'They are eligible to take the pledge if they agree to be:</p>' +
				'</div>' +

				'<div class="card pad-lg" style="background:var(--green-soft);border-color:var(--green-border)">' +
					'<div style="display:flex;gap:14px;align-items:flex-start">' +
						'<span style="flex:none;color:var(--green);margin-top:2px">' + icon('shield', 24) + '</span>' +
						'<div class="stack-sm" style="min-width:0">' +
							'<h2 class="h-sm">' + esc(SPINE.fullName) + ' is eligible</h2>' +
							'<p class="muted">Eligibility is checked against the affiliation on file before the pledge is offered.</p>' +
							'<dl style="margin:6px 0 0">' +
								'<div class="side-row" style="border-color:var(--green-border)"><dt>Affiliation</dt><dd>' + esc(SPINE.affiliation) + ' ' + '<span class="pill pill-green" style="margin-left:4px">Passes</span></dd></div>' +
								'<div class="side-row" style="border-color:var(--green-border)"><dt>The rule</dt><dd style="font-weight:400">A Democratic or Republican line on <em>any</em> current party affiliation disqualifies a candidate, as does a filing recorded as a partisan candidacy.</dd></div>' +
							'</dl>' +
						'</div>' +
					'</div>' +
				'</div>' +

				'<div class="card pad-lg">' +
					'<div class="stack">' +
						'<h2 class="h-md">Agree to all three commitments</h2>' +
						pillars +
						'<p class="err" id="err-pledge" hidden></p>' +

						'<hr class="divider">' +

						'<div class="field">' +
							'<label class="field-label" for="sig">Type your full name to sign</label>' +
							'<input class="input" id="sig" data-model="pledge.signature" value="' + esc(p.signature) + '" placeholder="' + esc(SPINE.fullName) + '" autocomplete="off">' +
							'<p class="field-hint">Must match ' + esc(SPINE.fullName) + '.</p>' +
							'<p class="err" id="err-sig" hidden></p>' +
						'</div>' +
					'</div>' +
				'</div>' +

				'<div class="notice notice-blue">' + icon('info', 20, 'notice-ico') +
					'<div class="notice-body">Taking the pledge adds the Heart &amp; Star mark to your profile. ' +
					'GoodParty.org may remove it if a candidate later accepts a major-party endorsement.</div></div>' +

				'<div class="btn-row actions split">' +
					'<button class="btn btn-ghost" data-go="edit">' + icon('back', 15) + ' Back to profile editing</button>' +
					'<button class="btn btn-primary btn-lg" id="pledgeSubmit"' + (allAgreed ? '' : '') + '>Take the pledge ' + icon('arrow', 15) + '</button>' +
				'</div>' +

				protoNote('Nothing is recorded. In the live product a signed pledge is reviewed by GoodParty.org before the mark appears. <span class="proposal">Proposal</span>') +
			'</div>' +
		'</div>';
	};

	/* ================================================================== *
	 * SCREEN 6 — identity verification. The requirement is stated plainly;
	 * the methods themselves are proposals.
	 * ================================================================== */
	SCREENS.verify = function () {
		var v = state.verify;

		if (v.status === 'pending') {
			return '<div class="page narrow screen">' +
				'<div class="stack-lg">' +
					'<div class="card pad-lg" style="text-align:center">' +
						'<div class="stack" style="align-items:center">' +
							'<span class="ok-mark" style="background:var(--gold-soft);border-color:var(--gold-border);color:var(--gold)">' + icon('clock', 30) + '</span>' +
							'<h1 class="h-lg">We are checking your identity</h1>' +
							'<p class="lede" style="text-align:center">Most checks finish in a few minutes. We will email ' +
							'<b>' + esc(v.contactShown || state.account.email || 'your address') + '</b> as soon as it is done.</p>' +
							'<div class="notice notice-gold" style="text-align:left;width:100%">' + icon('lock', 20, 'notice-ico') +
								'<div class="notice-body">Your draft is saved and still private. You can keep editing while you wait, but you cannot publish until the check clears.</div></div>' +
							'<div class="btn-row actions" style="justify-content:center">' +
								'<button class="btn btn-outline" data-go="edit">Keep editing</button>' +
								'<button class="btn btn-primary" id="simulateVerified">Simulate: check cleared</button>' +
							'</div>' +
						'</div>' +
					'</div>' +
					protoNote('No identity is verified. The button above moves the prototype on so you can see the next screen.') +
				'</div>' +
			'</div>';
		}

		var methods = [
			{ id: 'email', icon: 'mail', title: 'Official campaign email', sub: 'We send a code to an address on your filing or campaign domain. Fastest when it is available.' },
			{ id: 'phone', icon: 'phone', title: 'Phone number on file', sub: 'We text a six-digit code to the number from your candidate filing.' },
			{ id: 'doc', icon: 'id', title: 'Upload a document', sub: 'A government ID or a copy of your filing receipt, reviewed by a person at GoodParty.org.' }
		];

		var cards = methods.map(function (m) {
			var on = v.method === m.id;
			return '<label class="radio-card' + (on ? ' is-on' : '') + '">' +
				'<input type="radio" name="vmethod" data-verify="' + m.id + '"' + (on ? ' checked' : '') + '>' +
				'<span class="check-body">' +
					'<span style="display:flex;align-items:center;gap:9px;flex-wrap:wrap">' +
						'<span style="color:var(--accent)">' + icon(m.icon, 17) + '</span>' +
						'<span class="check-title">' + esc(m.title) + '</span>' +
						'<span class="proposal">Proposal</span>' +
					'</span>' +
					'<span class="check-sub" style="margin-top:3px">' + esc(m.sub) + '</span>' +
				'</span>' +
			'</label>';
		}).join('');

		var detail = '';
		if (v.method === 'phone') {
			detail = '<div class="field" style="margin-top:4px">' +
				'<label class="field-label" for="vphone">Phone number</label>' +
				'<input class="input" id="vphone" data-model="verify.phone" value="' + esc(v.phone) + '" placeholder="(612) 555-0147" autocomplete="tel">' +
				'<p class="err" id="err-vphone" hidden></p></div>';
		} else if (v.method === 'doc') {
			detail = '<div class="field" style="margin-top:4px">' +

	/* ================================================================== *
	 * Validation helpers
	 * ================================================================== */
	function setErr(id, msg) {
		var el = document.getElementById('err-' + id);
		if (!el) return;
		el.innerHTML = icon('alert', 13) + '<span>' + esc(msg) + '</span>';
		el.hidden = false;
		var input = document.getElementById(id);
		if (input) input.setAttribute('aria-invalid', 'true');
	}

	function clearErr(id) {
		var el = document.getElementById('err-' + id);
		if (el) { el.hidden = true; el.textContent = ''; }
		var input = document.getElementById(id);
		if (input) input.removeAttribute('aria-invalid');
	}

	function focusFirstError() {
		var el = document.querySelector('[aria-invalid="true"]');
		if (!el) {
			var firstErr = document.querySelector('.err:not([hidden])');
			if (firstErr) {
				var box = firstErr.previousElementSibling && firstErr.previousElementSibling.querySelector('input');
				el = box || firstErr;
			}
		}
		if (el && el.focus) el.focus();
		if (el && el.scrollIntoView) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
	}

	function validEmail(v) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.trim()); }

	function busy(btn, label) {
		if (!btn) return function () {};
		var original = btn.innerHTML;
		btn.disabled = true;
		btn.innerHTML = '<span class="spinner"></span><span>' + esc(label) + '</span>';
		return function () { btn.disabled = false; btn.innerHTML = original; };
	}

	function setPath(obj, path, value) {
		var parts = path.split('.');
		var ref = obj;
		for (var i = 0; i < parts.length - 1; i++) ref = ref[parts[i]];
		ref[parts[parts.length - 1]] = value;
	}

	/* ---------------- editor helpers ---------------- */

	function findIssue(id) {
		for (var i = 0; i < state.draft.issues.length; i++) {
			if (state.draft.issues[i].id === id) return state.draft.issues[i];
		}
		return null;
	}

	function setCounter(id, used, max) {
		var el = document.getElementById(id);
		if (!el) return;
		el.textContent = used + ' / ' + max;
		el.className = 'counter' + (used > max ? ' over' : '');
	}

	/* Keeps the sidebar progress honest while typing, without re-rendering
	   the form underneath the caret. */
	function updateProgress() {
		var count = addedCount();
		var added = sectionsAdded();
		var bar = document.querySelector('.prog-bar span');
		if (bar) bar.style.width = (count / 3 * 100) + '%';
		var pb = document.querySelector('.prog-bar');
		if (pb) pb.setAttribute('aria-valuenow', String(count));
		var head = document.querySelector('.prog-head .faint');
		if (head) head.textContent = count + ' of 3';
		document.querySelectorAll('.prog-row').forEach(function (row, i) {
			row.classList.toggle('is-on', !!added[i]);
			var tick = row.querySelector('.prog-tick');
			if (tick) tick.innerHTML = added[i] ? icon('check', 12) : '';
		});
	}

	/* Draft autosave. The indicator is the whole point: it is how the screen
	   says "this is private and already kept" without a banner per field. */
	var saveTimer = null;
	function setSaveState(html) {
		var el = document.getElementById('saveState');
		if (el) el.innerHTML = html;
	}

	function commitDraft() {
		state.draft.saved = true;
		state.draft.savedAt = Date.now();
		setSaveState(icon('check', 13) + '<span>Draft saved</span>');
		updateProgress();
	}

	function markDirty() {
		updateProgress();
		setSaveState('<span class="spinner spinner-xs"></span><span>Saving\u2026</span>');
		clearTimeout(saveTimer);
		saveTimer = setTimeout(commitDraft, 650);
	}

	/* ================================================================== *
	 * Render + wiring
	 * ================================================================== */
	function render() {
		state.screen = current();
		// Already signed in? The account screen has nothing left to ask.
		// `replace` keeps it out of history so Back never bounces off it.
		if (state.screen === 'account' && state.account.loggedIn) {
			location.replace('#edit');
			return;
		}
		var fn = SCREENS[state.screen] || SCREENS.profile;
		document.getElementById('app').innerHTML = fn();
		renderSteps();
		updateRail();
		wire();
		if (pendingFocus) {
			var target = document.getElementById(pendingFocus);
			pendingFocus = null;
			if (target) { target.focus(); target.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
		}
	}

	function wire() {
		var app = document.getElementById('app');

		// plain navigation
		app.querySelectorAll('[data-go]').forEach(function (b) {
			b.addEventListener('click', function () { go(b.getAttribute('data-go')); });
		});

		// choose a path: selecting a card only records the choice
		app.querySelectorAll('[data-path]').forEach(function (r) {
			r.addEventListener('change', function () {
				state.path = r.getAttribute('data-path');
				app.querySelectorAll('.choice-card').forEach(function (c) {
					c.classList.toggle('is-on', c.contains(r));
				});
				var cont = document.getElementById('pathContinue');
				if (cont) cont.disabled = false;
				var hint = document.getElementById('pathHint');
				if (hint) hint.hidden = true;
			});
		});

		var pathContinue = document.getElementById('pathContinue');
		if (pathContinue) pathContinue.addEventListener('click', function () {
			if (!state.path) return;
			go(state.path === 'candidate' ? (state.account.loggedIn ? 'edit' : 'account') : 'voter-review');
		});

		// two-way binding; typing is never lost moving backward or forward
		app.querySelectorAll('[data-model]').forEach(function (el) {
			el.addEventListener('input', function () {
				setPath(state, el.getAttribute('data-model'), el.value);
				if (el.id) clearErr(el.id);
				if (el.id === 'why' || el.id === 'about') {
					state.draft.touched = true;
					var max = el.id === 'why' ? LIMITS.why : LIMITS.about;
					setCounter('c-' + el.id, el.value.length, max);
					markDirty();
				}
				if (el.id === 'vNote') {
					var p = document.getElementById('notePreview');
					if (p) { p.hidden = !el.value.trim(); p.textContent = el.value; }
				}
				if (el.getAttribute('data-model').indexOf('draft.') === 0) state.draft.touched = true;
			});
		});

		// ---- account ----
		app.querySelectorAll('[data-mode]').forEach(function (t) {
			t.addEventListener('click', function () { state.account.mode = t.getAttribute('data-mode'); render(); });
		});

		var termsBox = app.querySelector('[data-terms]');
		if (termsBox) termsBox.addEventListener('change', function () {
			state.account.terms = termsBox.checked;
			termsBox.closest('.check').classList.toggle('is-on', termsBox.checked);
			clearErr('terms');
		});

		var ssoGoogle = document.getElementById('ssoGoogle');
		if (ssoGoogle) ssoGoogle.addEventListener('click', function () {
			var restore = busy(ssoGoogle, 'Connecting');
			setTimeout(function () {
				restore();
				state.account.loggedIn = true;
				state.path = 'candidate';
				toast('Signed in with Google');
				location.replace('#edit');
			}, 1100);
		});

		var pwToggle = document.getElementById('pwToggle');
		if (pwToggle) pwToggle.addEventListener('click', function () {
			var inp = document.getElementById('password');
			var showing = inp.type === 'text';
			inp.type = showing ? 'password' : 'text';
			pwToggle.innerHTML = icon(showing ? 'eye' : 'eyeOff', 17);
			pwToggle.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
		});

		var accountSubmit = document.getElementById('accountSubmit');
		if (accountSubmit) accountSubmit.addEventListener('click', function () {
			var a = state.account, ok = true;
			if (a.mode === 'signup') {
				if (!a.firstName.trim()) { setErr('firstName', 'Enter your first name.'); ok = false; }
				if (!a.lastName.trim()) { setErr('lastName', 'Enter your last name.'); ok = false; }
			}
			if (!a.email.trim()) { setErr('email', 'Enter your email address.'); ok = false; }
			else if (!validEmail(a.email)) { setErr('email', 'That does not look like an email address.'); ok = false; }
			if (!a.password) { setErr('password', 'Enter a password.'); ok = false; }
			else if (a.mode === 'signup' && a.password.length < 8) { setErr('password', 'Use at least 8 characters.'); ok = false; }
			if (a.mode === 'signup' && !a.terms) { setErr('terms', 'Agree to the terms to create an account.'); ok = false; }
			if (!ok) { focusFirstError(); return; }

			var restore = busy(accountSubmit, a.mode === 'signup' ? 'Creating your account' : 'Signing in');
			setTimeout(function () {
				restore();
				state.account.loggedIn = true;
				state.path = 'candidate';
				toast(a.mode === 'signup' ? 'Account created' : 'Signed in');
				// Replace, not push: you cannot go back to creating an account
				// once you have one, so #account leaves the history stack.
				location.replace('#edit');
			}, 1100);
		});

		// ---- edit ----
		app.querySelectorAll('[data-issue-title]').forEach(function (el) {
			el.addEventListener('input', function () {
				var issue = findIssue(el.getAttribute('data-issue-title'));
				if (!issue) return;
				issue.title = el.value;
				state.draft.touched = true;
				setCounter('c-it-' + issue.id, el.value.length, LIMITS.issueTitle);
				clearErr('it-' + issue.id);
				clearErr('issues');
				updateProgress();
				markDirty();
			});
		});

		app.querySelectorAll('[data-issue-position]').forEach(function (el) {
			el.addEventListener('input', function () {
				var issue = findIssue(el.getAttribute('data-issue-position'));
				if (!issue) return;
				issue.position = el.value;
				state.draft.touched = true;
				setCounter('c-ip-' + issue.id, el.value.length, LIMITS.issuePosition);
				clearErr('ip-' + issue.id);
				markDirty();
			});
		});

		var addIssue = document.getElementById('addIssue');
		if (addIssue) addIssue.addEventListener('click', function () {
			if (state.draft.issues.length >= MAX_ISSUES) return;
			var issue = newIssue();
			state.draft.issues.push(issue);
			state.draft.touched = true;
			pendingFocus = 'it-' + issue.id;
			render();
		});

		app.querySelectorAll('[data-remove-issue]').forEach(function (b) {
			b.addEventListener('click', function () {
				var id = b.getAttribute('data-remove-issue');
				state.draft.issues = state.draft.issues.filter(function (i) { return i.id !== id; });
				state.draft.touched = true;
				markDirty();
				render();
			});
		});

		function saveDraft(btn, then) {
			var restore = busy(btn, 'Saving');
			setTimeout(function () {
				restore();
				commitDraft();
				then();
			}, 700);
		}

		var skipEdit = document.getElementById('skipEdit');
		if (skipEdit) skipEdit.addEventListener('click', function () {
			// Skipping still keeps the work: the draft is committed either way.
			commitDraft();
			state.draft.skipped = addedCount() < 3;
			toast('Draft saved. You can finish this any time.', 'lock');
			go('pledge');
		});

		var editContinue = document.getElementById('editContinue');
		if (editContinue) editContinue.addEventListener('click', function () {
			var ok = true;
			if (state.draft.why.length > LIMITS.why) {
				setErr('why', 'That is ' + state.draft.why.length + ' characters. Trim it to ' + LIMITS.why + ' or fewer.'); ok = false;
			}
			if (state.draft.about.length > LIMITS.about) {
				setErr('about', 'That is ' + state.draft.about.length + ' characters. Trim it to ' + LIMITS.about + ' or fewer.'); ok = false;
			}
			state.draft.issues.forEach(function (i) {
				if (issueRowIsBlank(i)) return;
				if (!i.title.trim()) { setErr('it-' + i.id, 'Give this issue a name, or remove it.'); ok = false; }
				else if (i.title.length > LIMITS.issueTitle) { setErr('it-' + i.id, 'Keep the name under ' + LIMITS.issueTitle + ' characters.'); ok = false; }
				if (i.position.length > LIMITS.issuePosition) { setErr('ip-' + i.id, 'That is ' + i.position.length + ' characters. Trim it to ' + LIMITS.issuePosition + ' or fewer.'); ok = false; }
			});
			if (!ok) { focusFirstError(); return; }

			saveDraft(editContinue, function () {
				state.draft.skipped = false;
				go('pledge');
			});
		});

		var saveLater2 = document.getElementById('saveLater2');
		if (saveLater2) saveLater2.addEventListener('click', function () {
			saveDraft(saveLater2, function () { go('profile'); });
		});

		// ---- pledge ----
		app.querySelectorAll('[data-pledge]').forEach(function (cb) {
			cb.addEventListener('change', function () {
				state.pledge.agreed[cb.getAttribute('data-pledge')] = cb.checked;
				cb.closest('.check').classList.toggle('is-on', cb.checked);
				clearErr('pledge');
			});
		});

		var pledgeSubmit = document.getElementById('pledgeSubmit');
		if (pledgeSubmit) pledgeSubmit.addEventListener('click', function () {
			var ok = true;
			var missing = PLEDGE_PILLARS.filter(function (x) { return !state.pledge.agreed[x.key]; });
			if (missing.length) {
				setErr('pledge', 'Agree to all three commitments to take the pledge. Still to confirm: ' + missing.map(function (m) { return m.title; }).join(', ') + '.');
				ok = false;
			}
			var sig = state.pledge.signature.trim();
			if (!sig) { setErr('sig', 'Type your full name to sign.'); ok = false; }
			else if (sig.toLowerCase() !== SPINE.fullName.toLowerCase()) { setErr('sig', 'The signature must match ' + SPINE.fullName + ' exactly.'); ok = false; }
			if (!ok) { focusFirstError(); return; }

			var restore = busy(pledgeSubmit, 'Recording your pledge');
			setTimeout(function () {
				restore();
				state.pledge.taken = true;
				toast('Pledge taken', 'star');
				go('verify');
			}, 1100);
		});

		// ---- verify ----
		app.querySelectorAll('[data-verify]').forEach(function (r) {
			r.addEventListener('change', function () {
				state.verify.method = r.getAttribute('data-verify');
				clearErr('verify');
				render();
			});
		});

		var docBtn = document.getElementById('docBtn');
		if (docBtn) docBtn.addEventListener('click', function () {
			var restore = busy(docBtn, 'Uploading');
			setTimeout(function () {
				restore();
				state.verify.doc = 'filing-receipt.pdf';
				clearErr('doc');
				render();
			}, 900);
		});

		var verifySubmit = document.getElementById('verifySubmit');
		if (verifySubmit) verifySubmit.addEventListener('click', function () {
			var v = state.verify, ok = true;
			if (!v.method) { setErr('verify', 'Choose how you want to verify.'); ok = false; }
			if (v.method === 'phone') {
				var digits = v.phone.replace(/\D/g, '');
				if (!v.phone.trim()) { setErr('vphone', 'Enter the phone number on your filing.'); ok = false; }
				else if (digits.length < 10) { setErr('vphone', 'Enter a 10-digit phone number.'); ok = false; }
			}
			if (v.method === 'doc' && !v.doc) { setErr('doc', 'Choose a file to upload.'); ok = false; }
			if (!ok) { focusFirstError(); return; }

			var restore = busy(verifySubmit, 'Submitting');
			setTimeout(function () {
				restore();
				state.verify.submitted = true;
				state.verify.status = 'pending';
				state.verify.contactShown = v.method === 'phone' ? v.phone : state.account.email;
				render();
			}, 1200);
		});

		var verifyLater = document.getElementById('verifyLater');
		if (verifyLater) verifyLater.addEventListener('click', function () {
			toast('You can verify any time. Publishing stays locked until then.', 'clock');
			go('preview');
		});

		var simulateVerified = document.getElementById('simulateVerified');
		if (simulateVerified) simulateVerified.addEventListener('click', function () {
			var restore = busy(simulateVerified, 'Finishing check');
			setTimeout(function () {
				restore();
				state.verify.status = 'verified';
				toast('Identity verified', 'shield');
				go('preview');
			}, 900);
		});

		// ---- publish ----
		var publishBtn = document.getElementById('publishBtn');
		if (publishBtn) publishBtn.addEventListener('click', function () {
			var restore = busy(publishBtn, 'Publishing');
			setTimeout(function () {
				restore();
				state.publish.published = true;
				go('done');
			}, 1400);
		});

		// ---- voter ----
		var sendRequest = document.getElementById('sendRequest');
		if (sendRequest) sendRequest.addEventListener('click', function () {
			var v = state.voter, ok = true;
			if (!v.firstName.trim()) { setErr('vFirst', 'Enter your first name.'); ok = false; }
			if (!v.lastName.trim()) { setErr('vLast', 'Enter your last name.'); ok = false; }
			if (!v.email.trim()) { setErr('vEmail', 'Enter your email address.'); ok = false; }
			else if (!validEmail(v.email)) { setErr('vEmail', 'That does not look like an email address.'); ok = false; }
			if (!ok) { focusFirstError(); return; }

			var restore = busy(sendRequest, 'Sending');
			setTimeout(function () {
				restore();
				state.voter.sent = true;
				go('voter-sent');
			}, 1200);
		});

		// non-navigating demo links
		app.querySelectorAll('[data-noop]').forEach(function (a) {
			a.addEventListener('click', function (e) {
				e.preventDefault();
				toast('Not part of this prototype yet.', 'info');
			});
		});
	}

	/* ---------------- theme toggle ---------------- */
	document.getElementById('themeBtn').addEventListener('click', function () {
		var root = document.documentElement;
		var now = root.getAttribute('data-theme');
		var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
		var isDark = now === 'dark' || (!now && systemDark);
		root.setAttribute('data-theme', isDark ? 'light' : 'dark');
	});

	/* ---------------- boot ---------------- */
	if (!location.hash || VALID.indexOf(location.hash.slice(1)) < 0) {
		if (location.hash) { location.replace('#profile'); }
	}
	render();
})();
</script>

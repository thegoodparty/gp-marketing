<title>Claim Your Profile</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Open+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout concept: a fixed candidate rail pins Jordan Avery's identity to every
   screen; one centred column below it carries a single focused action per step. */
:root {
	--font-display: 'Outfit', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
	--font-body: 'Open Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;

	--bg: hsl(33 60% 97%);
	--surface: hsl(0 0% 100%);
	--surface-2: hsl(33 40% 98%);
	--surface-3: hsl(220 20% 96%);
	--fg: hsl(222 47% 11%);
	--fg-muted: hsl(220 14% 42%);
	--fg-faint: hsl(220 12% 56%);
	--border: hsl(220 16% 88%);
	--border-strong: hsl(220 14% 76%);

	--navy: hsl(220 58% 10%);
	--navy-2: hsl(224 59% 19%);
	--navy-3: hsl(220 58% 35%);
	--on-navy: hsl(0 0% 100%);
	--on-navy-muted: hsl(214 40% 78%);

	--accent: hsl(221 83% 53%);
	--accent-hover: hsl(221 83% 46%);
	--accent-soft: hsl(212 100% 96%);
	--accent-border: hsl(214 67% 82%);
	--on-accent: hsl(0 0% 100%);

	--gold: hsl(43 81% 51%);
	--gold-soft: hsl(44 100% 89%);
	--gold-border: hsl(44 100% 57%);

	--red: hsl(349 83% 47%);
	--red-soft: hsl(0 100% 95%);
	--red-border: hsl(0 100% 84%);

	--green: hsl(159 46% 42%);
	--green-soft: hsl(151 45% 91%);
	--green-border: hsl(153 44% 79%);

	--lavender-soft: hsl(269 100% 93%);
	--lavender: hsl(262 71% 55%);

	--ring: hsl(221 83% 53% / 0.35);
	--shadow-sm: 0 1px 3px hsl(222 47% 11% / 0.08), 0 1px 2px hsl(222 47% 11% / 0.04);
	--shadow-md: 0 4px 14px hsl(222 47% 11% / 0.08), 0 2px 4px hsl(222 47% 11% / 0.04);
	--shadow-lg: 0 18px 40px hsl(222 47% 11% / 0.14), 0 4px 10px hsl(222 47% 11% / 0.06);

	--r-sm: 8px;
	--r-md: 12px;
	--r-lg: 16px;
	--r-xl: 24px;
	--r-2xl: 32px;
	--rail-h: 68px;
}

@media (prefers-color-scheme: dark) {
	:root:not([data-theme="light"]) {
		color-scheme: dark;
		--bg: hsl(222 50% 7%);
		--surface: hsl(222 42% 11%);
		--surface-2: hsl(222 40% 13%);
		--surface-3: hsl(222 36% 17%);
		--fg: hsl(210 30% 96%);
		--fg-muted: hsl(214 20% 72%);
		--fg-faint: hsl(214 15% 58%);
		--border: hsl(222 28% 22%);
		--border-strong: hsl(222 24% 32%);
		--navy: hsl(222 52% 9%);
		--navy-2: hsl(224 48% 16%);
		--navy-3: hsl(220 50% 30%);
		--on-navy: hsl(0 0% 100%);
		--on-navy-muted: hsl(214 32% 74%);
		--accent: hsl(217 92% 66%);
		--accent-hover: hsl(217 92% 74%);
		--accent-soft: hsl(222 44% 18%);
		--accent-border: hsl(220 40% 34%);
		--on-accent: hsl(222 60% 8%);
		--gold: hsl(44 90% 62%);
		--gold-soft: hsl(40 40% 18%);
		--gold-border: hsl(42 60% 36%);
		--red: hsl(352 76% 62%);
		--red-soft: hsl(350 40% 18%);
		--red-border: hsl(350 42% 36%);
		--green: hsl(153 48% 55%);
		--green-soft: hsl(165 32% 15%);
		--green-border: hsl(162 32% 30%);
		--lavender-soft: hsl(262 36% 22%);
		--lavender: hsl(266 90% 78%);
		--ring: hsl(217 92% 66% / 0.4);
		--shadow-sm: 0 1px 3px hsl(0 0% 0% / 0.4);
		--shadow-md: 0 4px 14px hsl(0 0% 0% / 0.45);
		--shadow-lg: 0 18px 40px hsl(0 0% 0% / 0.55);
	}
}

:root[data-theme="dark"] {
	color-scheme: dark;
	--bg: hsl(222 50% 7%);
	--surface: hsl(222 42% 11%);
	--surface-2: hsl(222 40% 13%);
	--surface-3: hsl(222 36% 17%);
	--fg: hsl(210 30% 96%);
	--fg-muted: hsl(214 20% 72%);
	--fg-faint: hsl(214 15% 58%);
	--border: hsl(222 28% 22%);
	--border-strong: hsl(222 24% 32%);
	--navy: hsl(222 52% 9%);
	--navy-2: hsl(224 48% 16%);
	--navy-3: hsl(220 50% 30%);
	--on-navy: hsl(0 0% 100%);
	--on-navy-muted: hsl(214 32% 74%);
	--accent: hsl(217 92% 66%);
	--accent-hover: hsl(217 92% 74%);
	--accent-soft: hsl(222 44% 18%);
	--accent-border: hsl(220 40% 34%);
	--on-accent: hsl(222 60% 8%);
	--gold: hsl(44 90% 62%);
	--gold-soft: hsl(40 40% 18%);
	--gold-border: hsl(42 60% 36%);
	--red: hsl(352 76% 62%);
	--red-soft: hsl(350 40% 18%);
	--red-border: hsl(350 42% 36%);
	--green: hsl(153 48% 55%);
	--green-soft: hsl(165 32% 15%);
	--green-border: hsl(162 32% 30%);
	--lavender-soft: hsl(262 36% 22%);
	--lavender: hsl(266 90% 78%);
	--ring: hsl(217 92% 66% / 0.4);
	--shadow-sm: 0 1px 3px hsl(0 0% 0% / 0.4);
	--shadow-md: 0 4px 14px hsl(0 0% 0% / 0.45);
	--shadow-lg: 0 18px 40px hsl(0 0% 0% / 0.55);
}

* { box-sizing: border-box; }

body {
	margin: 0;
	background: var(--bg);
	color: var(--fg);
	font-family: var(--font-body);
	font-size: 16px;
	line-height: 1.5;
	-webkit-font-smoothing: antialiased;
}

body::before {
	content: "";
	position: fixed;
	inset: 0 0 auto;
	height: env(safe-area-inset-top, 0px);
	z-index: 60;
	background: var(--navy);
}

h1, h2, h3, h4 { font-family: var(--font-display); font-weight: 600; margin: 0; text-wrap: balance; line-height: 1.25; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }

:focus-visible { outline: 3px solid var(--ring); outline-offset: 2px; border-radius: 4px; }

/* ---------- candidate rail (pinned to every screen) ---------- */
.rail {
	position: sticky;
	top: env(safe-area-inset-top, 0px);
	z-index: 50;
	background: var(--navy);
	color: var(--on-navy);
	border-bottom: 1px solid hsl(0 0% 100% / 0.1);
}
.rail-inner {
	max-width: 1180px;
	margin: 0 auto;
	min-height: var(--rail-h);
	display: flex;
	align-items: center;
	gap: 14px;
	padding-left: max(16px, env(safe-area-inset-left, 0px));
	padding-right: max(16px, env(safe-area-inset-right, 0px));
	padding-block: 10px;
}
.rail-mark {
	width: 42px; height: 42px; flex: none;
	border-radius: 999px;
	display: grid; place-items: center;
	font-family: var(--font-display);
	font-weight: 600; font-size: 15px;
	letter-spacing: 0.02em;
	background: linear-gradient(145deg, var(--navy-3), var(--navy-2));
	border: 2px solid hsl(0 0% 100% / 0.22);
	color: var(--on-navy);
}
.rail-mark.has-photo { background: var(--gold); color: var(--navy); border-color: var(--gold); }
.rail-id { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 1px; }
.rail-name { font-family: var(--font-display); font-weight: 600; font-size: 15px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rail-meta { font-size: 12.5px; color: var(--on-navy-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rail-right { display: flex; align-items: center; gap: 8px; flex: none; }
.rail-status {
	font-size: 11.5px; font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase;
	padding: 4px 10px; border-radius: 999px; white-space: nowrap;
	background: hsl(0 0% 100% / 0.1); color: var(--on-navy-muted); border: 1px solid hsl(0 0% 100% / 0.18);
}
.rail-status.is-draft { background: var(--gold-soft); color: hsl(39 86% 25%); border-color: var(--gold-border); }
.rail-status.is-live { background: var(--green-soft); color: hsl(170 66% 18%); border-color: var(--green-border); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .rail-status.is-draft { color: hsl(44 90% 72%); } :root:not([data-theme="light"]) .rail-status.is-live { color: hsl(153 48% 68%); } }
:root[data-theme="dark"] .rail-status.is-draft { color: hsl(44 90% 72%); }
:root[data-theme="dark"] .rail-status.is-live { color: hsl(153 48% 68%); }
.rail-theme {
	width: 34px; height: 34px; border-radius: 999px; display: grid; place-items: center;
	background: hsl(0 0% 100% / 0.08); border: 1px solid hsl(0 0% 100% / 0.18);
	color: var(--on-navy); cursor: pointer;
}
.rail-theme:hover { background: hsl(0 0% 100% / 0.16); }
@media (max-width: 620px) { .rail-meta-long { display: none; } }

/* ---------- step bar ---------- */
.steps { background: var(--surface); border-bottom: 1px solid var(--border); }
.steps-inner {
	max-width: 1180px; margin: 0 auto;
	display: flex; align-items: center; gap: 6px;
	padding-left: max(16px, env(safe-area-inset-left, 0px));
	padding-right: max(16px, env(safe-area-inset-right, 0px));
	padding-block: 10px;
	overflow-x: auto; scrollbar-width: none;
}
.steps-inner::-webkit-scrollbar { display: none; }
.step { display: flex; align-items: center; gap: 7px; flex: none; padding: 4px 2px; }
.step-dot {
	width: 21px; height: 21px; border-radius: 999px; flex: none;
	display: grid; place-items: center;
	font-size: 11px; font-weight: 700; font-family: var(--font-display);
	background: var(--surface-3); color: var(--fg-faint); border: 1px solid var(--border);
}
.step-label { font-size: 12.5px; color: var(--fg-faint); white-space: nowrap; font-weight: 500; }
.step.is-active .step-dot { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.step.is-active .step-label { color: var(--fg); font-weight: 600; }
.step.is-done .step-dot { background: var(--green); color: #fff; border-color: var(--green); }
.step.is-done .step-label { color: var(--fg-muted); }
.step-sep { width: 14px; height: 1px; background: var(--border-strong); flex: none; }

/* ---------- page shell ---------- */
.page {
	max-width: 1180px; margin: 0 auto;
	padding-left: max(16px, env(safe-area-inset-left, 0px));
	padding-right: max(16px, env(safe-area-inset-right, 0px));
	padding-block: 28px 72px;
}
.page.narrow { max-width: 760px; }
.page.mid { max-width: 940px; }

.stack { display: flex; flex-direction: column; gap: 18px; }
.stack-lg { display: flex; flex-direction: column; gap: 26px; }
.stack-sm { display: flex; flex-direction: column; gap: 10px; }

.screen { animation: enter 0.28s cubic-bezier(0.165, 0.84, 0.44, 1) both; }
@keyframes enter { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .screen { animation: none; } * { transition-duration: 0.01ms !important; } }

/* ---------- typography ---------- */
.eyebrow { font-family: var(--font-display); font-size: 12px; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; color: var(--fg-faint); }
.h-xl { font-size: clamp(28px, 5vw, 40px); }
.h-lg { font-size: clamp(24px, 4vw, 32px); }
.h-md { font-size: clamp(20px, 3vw, 24px); }
.h-sm { font-size: 17px; }
.lede { font-size: clamp(16px, 2vw, 18px); color: var(--fg-muted); max-width: 62ch; }
.muted { color: var(--fg-muted); font-size: 14.5px; }
.faint { color: var(--fg-faint); font-size: 13px; }

/* ---------- cards ---------- */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 22px; }
.card.pad-lg { padding: clamp(22px, 4vw, 34px); }
.card.flush { padding: 0; overflow: hidden; }
.card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; flex-wrap: wrap; }

/* ---------- buttons ---------- */
.btn {
	display: inline-flex; align-items: center; justify-content: center; gap: 8px;
	border-radius: 999px; border: 1px solid transparent; cursor: pointer;
	font-family: var(--font-body); font-weight: 600; font-size: 14px;
	padding: 0 22px; height: 44px; white-space: nowrap;
	transition: background-color 0.18s ease, color 0.18s ease, border-color 0.18s ease, transform 0.12s ease, opacity 0.18s ease;
}
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: var(--on-accent); }
.btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
.btn-navy { background: var(--navy-2); color: #fff; }
.btn-navy:hover:not(:disabled) { background: var(--navy-3); }
.btn-outline { background: transparent; color: var(--fg); border-color: var(--border-strong); }
.btn-outline:hover:not(:disabled) { background: var(--surface-3); }
.btn-ghost { background: transparent; color: var(--fg-muted); padding: 0 14px; }
.btn-ghost:hover:not(:disabled) { background: var(--surface-3); color: var(--fg); }
.btn-lg { height: 50px; font-size: 15px; padding: 0 28px; }
.btn-sm { height: 36px; font-size: 13px; padding: 0 16px; }
.btn-block { width: 100%; }
.btn-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn-row.end { justify-content: flex-end; }
.btn-row.split { justify-content: space-between; }
@media (max-width: 560px) {
	.btn-row.actions { flex-direction: column-reverse; align-items: stretch; }
	.btn-row.actions .btn { width: 100%; }
}

.spinner { width: 15px; height: 15px; border-radius: 999px; border: 2px solid currentColor; border-top-color: transparent; animation: spin 0.7s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- pills / chips ---------- */
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface-3); color: var(--fg-muted); white-space: nowrap; }
.pill-blue { background: var(--accent-soft); border-color: var(--accent-border); color: var(--accent); }
.pill-gold { background: var(--gold-soft); border-color: var(--gold-border); color: hsl(39 86% 28%); }
.pill-green { background: var(--green-soft); border-color: var(--green-border); color: hsl(170 66% 20%); }
.pill-red { background: var(--red-soft); border-color: var(--red-border); color: var(--red); }
.pill-lav { background: var(--lavender-soft); border-color: var(--lavender); color: var(--lavender); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .pill-gold { color: var(--gold); } :root:not([data-theme="light"]) .pill-green { color: var(--green); } }
:root[data-theme="dark"] .pill-gold { color: var(--gold); }
:root[data-theme="dark"] .pill-green { color: var(--green); }
.pill-row { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }

/* "proposal" marker for unconfirmed implementation detail */
.proposal {
	display: inline-flex; align-items: center; gap: 4px;
	font-size: 10.5px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase;
	padding: 2px 7px; border-radius: 4px;
	background: var(--lavender-soft); color: var(--lavender);
	border: 1px dashed var(--lavender);
	vertical-align: middle;
}

/* ---------- notices ---------- */
.notice { display: flex; gap: 11px; padding: 14px 16px; border-radius: var(--r-md); border: 1px solid var(--border); background: var(--surface-3); font-size: 14.5px; align-items: flex-start; }
.notice-ico { flex: none; width: 20px; height: 20px; margin-top: 1px; }
.notice-gold { background: var(--gold-soft); border-color: var(--gold-border); }
.notice-blue { background: var(--accent-soft); border-color: var(--accent-border); }
.notice-green { background: var(--green-soft); border-color: var(--green-border); }
.notice-red { background: var(--red-soft); border-color: var(--red-border); }
.notice b { font-weight: 700; }
.notice-body { min-width: 0; }

/* ---------- forms ---------- */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field-label { font-size: 13.5px; font-weight: 600; color: var(--fg); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.field-hint { font-size: 12.5px; color: var(--fg-faint); }
.input, .textarea, .select {
	width: 100%; background: var(--surface); color: var(--fg);
	border: 1px solid var(--border-strong); border-radius: var(--r-sm);
	padding: 11px 13px; font-size: 15px; font-family: var(--font-body);
	transition: border-color 0.15s ease, box-shadow 0.15s ease;
}
.input:focus, .textarea:focus, .select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--ring); }
.textarea { min-height: 128px; resize: vertical; line-height: 1.55; }
.input[aria-invalid="true"], .textarea[aria-invalid="true"] { border-color: var(--red); }
.input[aria-invalid="true"]:focus, .textarea[aria-invalid="true"]:focus { box-shadow: 0 0 0 3px hsl(349 83% 47% / 0.25); }
.input:disabled, .select:disabled { background: var(--surface-3); color: var(--fg-muted); cursor: not-allowed; }
.err { font-size: 12.5px; color: var(--red); font-weight: 600; display: flex; gap: 5px; align-items: center; }
.err[hidden] { display: none !important; }
.counter { font-size: 12px; color: var(--fg-faint); font-variant-numeric: tabular-nums; }
.counter.over { color: var(--red); font-weight: 600; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 620px) { .grid-2 { grid-template-columns: 1fr; } }

.locked {
	display: flex; align-items: center; gap: 10px;
	background: var(--surface-3); border: 1px solid var(--border);
	border-radius: var(--r-sm); padding: 11px 13px; font-size: 15px; color: var(--fg);
}
.locked-ico { flex: none; color: var(--fg-faint); }
.locked-val { min-width: 0; overflow-wrap: anywhere; }

.check { display: flex; gap: 12px; align-items: flex-start; cursor: pointer; padding: 14px; border: 1px solid var(--border); border-radius: var(--r-md); background: var(--surface); transition: border-color 0.15s ease, background-color 0.15s ease; }
.check:hover { border-color: var(--border-strong); }
.check.is-on { border-color: var(--accent); background: var(--accent-soft); }
.check input { margin: 0; width: 19px; height: 19px; flex: none; accent-color: var(--accent); margin-top: 2px; cursor: pointer; }
.check-body { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.check-title { font-weight: 600; font-size: 15px; font-family: var(--font-display); }
.check-sub { font-size: 13.5px; color: var(--fg-muted); line-height: 1.5; }

.radio-card { display: flex; gap: 12px; align-items: flex-start; cursor: pointer; padding: 16px; border: 1px solid var(--border); border-radius: var(--r-md); background: var(--surface); transition: border-color 0.15s ease, background-color 0.15s ease; }
.radio-card:hover { border-color: var(--border-strong); }
.radio-card.is-on { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 1px var(--accent); }
.radio-card input { margin: 0; width: 18px; height: 18px; flex: none; accent-color: var(--accent); margin-top: 3px; cursor: pointer; }

/* ---------- tabs ---------- */
.tabs { display: flex; gap: 4px; background: var(--surface-3); padding: 4px; border-radius: 999px; width: fit-content; max-width: 100%; }
.tab { border: none; background: transparent; border-radius: 999px; padding: 9px 20px; font-size: 14px; font-weight: 600; color: var(--fg-muted); cursor: pointer; transition: background-color 0.18s ease, color 0.18s ease; }
.tab.is-on { background: var(--surface); color: var(--fg); box-shadow: var(--shadow-sm); }

/* ---------- profile page ---------- */
.hero { position: relative; background: var(--navy); color: var(--on-navy); border-radius: var(--r-xl); overflow: hidden; }
.hero::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse 80% 70% at 50% 120%, hsl(220 58% 35% / 0.85) 0%, transparent 70%); pointer-events: none; }
.hero-inner { position: relative; z-index: 1; display: flex; gap: clamp(18px, 4vw, 44px); align-items: center; padding: clamp(22px, 4vw, 40px); flex-wrap: wrap; }
.hero-avatar { width: clamp(90px, 18vw, 150px); height: clamp(90px, 18vw, 150px); border-radius: 999px; flex: none; display: grid; place-items: center; font-family: var(--font-display); font-size: clamp(30px, 6vw, 48px); font-weight: 600; background: linear-gradient(150deg, var(--navy-3), var(--navy-2)); border: 3px solid hsl(0 0% 100% / 0.2); position: relative; }
.hero-avatar.has-photo { background: linear-gradient(150deg, var(--gold), hsl(36 90% 56%)); color: var(--navy); border-color: hsl(0 0% 100% / 0.35); }
.hero-text { min-width: 0; flex: 1 1 280px; display: flex; flex-direction: column; gap: 12px; }
.hero-name { font-size: clamp(26px, 5vw, 42px); }
.hero-office { font-family: var(--font-display); font-weight: 500; font-size: clamp(16px, 2.4vw, 20px); color: var(--on-navy); }
.hero-district { font-size: 15px; color: var(--on-navy-muted); }
.hero-callout { display: flex; gap: 12px; align-items: center; border: 1px solid hsl(0 0% 100% / 0.22); background: hsl(0 0% 100% / 0.07); border-radius: var(--r-sm); padding: 13px 15px; font-size: 14.5px; color: var(--on-navy); }
.hero-callout-mark { flex: none; width: 34px; height: 34px; display: grid; place-items: center; }

.profile-grid { display: grid; grid-template-columns: 300px 1fr; gap: 22px; align-items: start; }
@media (max-width: 900px) { .profile-grid { grid-template-columns: 1fr; } }
.side-row { display: flex; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--border); font-size: 14px; align-items: flex-start; }
.side-row:last-child { border-bottom: none; }
.side-row dt { color: var(--fg-faint); flex: none; width: 92px; font-size: 13px; }
.side-row dd { margin: 0; min-width: 0; flex: 1; font-weight: 500; overflow-wrap: anywhere; }

.empty {
	border: 1.5px dashed var(--border-strong); border-radius: var(--r-md);
	padding: 24px 20px; text-align: center; color: var(--fg-faint);
	display: flex; flex-direction: column; gap: 8px; align-items: center;
	background: var(--surface-2);
}
.empty-title { font-family: var(--font-display); font-weight: 600; font-size: 15px; color: var(--fg-muted); }
.empty-sub { font-size: 13.5px; max-width: 46ch; }

.issue-chip { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; background: var(--accent-soft); border: 1px solid var(--accent-border); font-size: 14px; font-weight: 600; color: var(--fg); }
.issue-chip button { background: transparent; border: none; cursor: pointer; color: var(--fg-muted); display: grid; place-items: center; padding: 0; width: 16px; height: 16px; border-radius: 999px; }
.issue-chip button:hover { color: var(--red); }

.pledge-pillar { display: flex; gap: 14px; align-items: flex-start; padding: 16px; border-radius: var(--r-md); border: 1px solid var(--border); background: var(--surface); }
.pillar-ico { flex: none; width: 42px; height: 42px; border-radius: 999px; display: grid; place-items: center; }

.summary-row { display: flex; gap: 14px; justify-content: space-between; align-items: flex-start; padding: 13px 0; border-bottom: 1px solid var(--border); }
.summary-row:last-child { border-bottom: none; }
.summary-k { font-size: 13px; color: var(--fg-faint); flex: none; width: 128px; }
.summary-v { min-width: 0; flex: 1; font-size: 14.5px; overflow-wrap: anywhere; }

.ok-mark { width: 64px; height: 64px; border-radius: 999px; display: grid; place-items: center; background: var(--green-soft); border: 2px solid var(--green-border); color: var(--green); animation: pop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
@keyframes pop { from { transform: scale(0.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }

.skel { background: linear-gradient(90deg, var(--surface-3) 25%, var(--border) 50%, var(--surface-3) 75%); background-size: 200% 100%; animation: shim 1.4s ease-in-out infinite; border-radius: 6px; }
@keyframes shim { from { background-position: 200% 0; } to { background-position: -200% 0; } }

.divider { height: 1px; background: var(--border); border: none; margin: 0; }

.prototype-note {
	display: flex; gap: 10px; align-items: flex-start;
	font-size: 12.5px; color: var(--fg-faint); line-height: 1.5;
	border-top: 1px dashed var(--border-strong); padding-top: 14px; margin-top: 4px;
}

.map-stub { height: 140px; border-radius: var(--r-md); border: 1px solid var(--border); background:
	repeating-linear-gradient(45deg, var(--surface-3) 0 10px, var(--surface-2) 10px 20px); display: grid; place-items: center; color: var(--fg-faint); font-size: 13px; }

.toast {
	position: fixed; left: 50%; transform: translateX(-50%);
	bottom: calc(22px + env(safe-area-inset-bottom, 0px)); z-index: 80;
	background: var(--navy-2); color: #fff; border-radius: 999px;
	padding: 12px 22px; font-size: 14px; font-weight: 600; box-shadow: var(--shadow-lg);
	display: flex; gap: 9px; align-items: center; max-width: calc(100% - 32px);
	animation: toastin 0.3s cubic-bezier(0.165, 0.84, 0.44, 1) both;
}
@keyframes toastin { from { opacity: 0; transform: translate(-50%, 14px); } to { opacity: 1; transform: translate(-50%, 0); } }
</style>

<header class="rail">
	<div class="rail-inner">
		<div class="rail-mark" id="railMark">JA</div>
		<div class="rail-id">
			<div class="rail-name">Jordan Avery</div>
			<div class="rail-meta">
				<span>U.S. Congress</span>
				<span class="rail-meta-long"> &middot; Minnesota's 5th Congressional District &middot; Nonpartisan</span>
			</div>
		</div>
		<div class="rail-right">
			<span class="rail-status" id="railStatus">Unclaimed</span>
			<button class="rail-theme" id="themeBtn" type="button" aria-label="Switch between light and dark">
				<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
			</button>
		</div>
	</div>
</header>

<div id="stepBar"></div>
<main id="app" aria-live="polite"></main>
<div id="toastHost"></div>

<script>
(function () {
	'use strict';

	/* ------------------------------------------------------------------ *
	 * Mock data. Jordan Avery is a fictional candidate for this prototype.
	 * The spine fields (name, office, district, affiliation) stand in for
	 * ETL-sourced, read-only data; the overlay fields are what a claimant
	 * would edit. Biography and issue fields start EMPTY on purpose — the
	 * profile is unclaimed and incomplete, and nothing is invented here.
	 * ------------------------------------------------------------------ */
	var SPINE = {
		firstName: 'Jordan',
		lastName: 'Avery',
		fullName: 'Jordan Avery',
		initials: 'JA',
		office: 'U.S. Congress',
		district: "Minnesota's 5th Congressional District",
		districtShort: 'MN-05',
		state: 'Minnesota',
		affiliation: 'Nonpartisan',
		electionDate: 'November 3, 2026',
		seat: 'U.S. House of Representatives',
		level: 'Federal',
		source: 'BallotReady / state filings'
	};

	var PLEDGE_PILLARS = [
		{
			key: 'independent',
			title: 'Independent',
			bg: 'var(--accent-soft)',
			fg: 'var(--accent)',
			icon: 'heart',
			body: 'They run and serve as nonpartisan, independent, or third-party candidates, not as Democrats or Republicans. They don’t accept endorsements from either major party.'
		},
		{
			key: 'people-powered',
			title: 'People-powered',
			bg: 'var(--gold-soft)',
			fg: 'var(--gold)',
			icon: 'users',
			body: 'They raise most of their funding from individuals, not from political action committees (PACs), lobbyists, unions, or corporations. Once elected, they focus on their constituents’ problems, not on themselves or special interests.'
		},
		{
			key: 'anti-corruption',
			title: 'Anti-Corruption',
			bg: 'var(--lavender-soft)',
			fg: 'var(--lavender)',
			icon: 'star',
			body: 'They commit to being open, transparent, and accountable about their donors, positions, and progress. They answer only to the people they serve, and they stay connected and responsive to their constituents.'
		}
	];

	var ISSUE_OPTIONS = [
		'Healthcare costs', 'Housing affordability', 'Public education', 'Climate and energy',
		'Jobs and small business', 'Campaign finance reform', 'Public safety', 'Transit and infrastructure',
		'Veterans', 'Immigration', 'Food and agriculture', 'Broadband access'
	];

	/* ------------------------------------------------------------------ *
	 * State. Held in one object so that moving backward and forward
	 * through the flow never loses what was typed.
	 * ------------------------------------------------------------------ */
	var state = {
		screen: 'profile',
		path: null,
		busy: false,
		account: { mode: 'signup', firstName: '', lastName: '', email: '', password: '', loggedIn: false },
		draft: { bio: '', issues: [], website: '', email: '', phone: '', photo: false, touched: false, saved: false, skipped: false },
		pledge: { agreed: {}, signature: '', taken: false },
		verify: { method: null, phone: '', doc: '', submitted: false, status: 'unverified' },
		publish: { published: false, visitedPreview: false },
		voter: { firstName: '', lastName: '', email: '', note: '', sent: false, reviewed: false },
		errors: {}
	};

	PLEDGE_PILLARS.forEach(function (p) { state.pledge.agreed[p.key] = false; });

	/* ------------------------------------------------------------------ *
	 * Icons
	 * ------------------------------------------------------------------ */
	var ICONS = {
		heart: '<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>',
		users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
		star: '<path d="m12 2 3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14l-5-4.87 6.91-1.01L12 2Z"/>',
		check: '<path d="M20 6 9 17l-5-5"/>',
		lock: '<rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
		eye: '<path d="M2 12s3.64-7 10-7 10 7 10 7-3.64 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>',
		eyeOff: '<path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c6.36 0 10 7 10 7a18.5 18.5 0 0 1-2.16 3.19m-6.72 1.67A10.45 10.45 0 0 1 12 19c-6.36 0-10-7-10-7a18.45 18.45 0 0 1 5.06-5.94"/><path d="m2 2 20 20"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>',
		info: '<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>',
		warn: '<path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/><path d="M12 9v4M12 17h.01"/>',
		alert: '<circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/>',
		user: '<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
		vote: '<path d="m9 12 2 2 4-4"/><path d="M5 7c0-1.1.9-2 2-2h10a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2Z"/>',
		arrow: '<path d="M5 12h14M12 5l7 7-7 7"/>',
		back: '<path d="M19 12H5M12 19l-7-7 7-7"/>',
		ext: '<path d="M7 17 17 7M7 7h10v10"/>',
		mail: '<rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>',
		phone: '<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.1 9.9a16 16 0 0 0 6 6l1.26-1.26a2 2 0 0 1 2.11-.45c.9.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92Z"/>',
		id: '<rect width="18" height="14" x="3" y="5" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M14 10h4M14 14h2M5 17c.5-1.5 2-2 4-2s3.5.5 4 2"/>',
		doc: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/>',
		pencil: '<path d="M17 3a2.83 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>',
		send: '<path d="M22 2 11 13M22 2l-7 20-4-9-9-4Z"/>',
		clock: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
		globe: '<circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10Z"/>',
		pin: '<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>',
		plus: '<path d="M12 5v14M5 12h14"/>',
		x: '<path d="M18 6 6 18M6 6l12 12"/>',
		save: '<path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/><path d="M17 21v-8H7v8M7 3v5h8"/>',
		shield: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/><path d="m9 12 2 2 4-4"/>'
	};

	function icon(name, size, cls) {
		var d = ICONS[name] || '';
		var s = size || 18;
		return '<svg class="' + (cls || '') + '" width="' + s + '" height="' + s + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
			'stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + d + '</svg>';
	}

	function esc(s) {
		return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
			return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
		});
	}

	/* ------------------------------------------------------------------ *
	 * Routing. The screen name lives in the hash so the browser's own back
	 * and forward buttons work; everything the user typed lives in `state`,
	 * so moving between screens never loses it.
	 * ------------------------------------------------------------------ */
	var SCREENS = {};
	var VALID = ['profile', 'path', 'account', 'edit', 'pledge', 'verify', 'preview', 'done', 'voter-review', 'voter-sent'];

	function go(name) {
		if (location.hash.slice(1) === name) { render(); return; }
		location.hash = name;
	}

	function current() {
		var h = location.hash.slice(1);
		return VALID.indexOf(h) >= 0 ? h : 'profile';
	}

	window.addEventListener('hashchange', function () {
		state.screen = current();
		render();
		window.scrollTo({ top: 0, behavior: 'instant' in document.documentElement.style ? 'instant' : 'auto' });
	});

	/* ---------------- derived status ---------------- */

	function profileStatus() {
		if (state.publish.published) return { label: 'Claimed', cls: 'is-live' };
		if (state.pledge.taken || state.draft.saved || state.draft.touched || state.account.loggedIn) return { label: 'Draft — private', cls: 'is-draft' };
		return { label: 'Unclaimed', cls: '' };
	}

	function bioWordCount() {
		var t = state.draft.bio.trim();
		return t ? t.split(/\s+/).length : 0;
	}

	function draftComplete() {
		return bioWordCount() >= 20 && state.draft.issues.length >= 1;
	}

	function verifyStatusLabel() {
		if (state.verify.status === 'verified') return 'Verified';
		if (state.verify.status === 'pending') return 'In review';
		return 'Not verified';
	}

	/* ---------------- chrome ---------------- */

	function updateRail() {
		var st = profileStatus();
		var el = document.getElementById('railStatus');
		el.textContent = st.label;
		el.className = 'rail-status ' + st.cls;
		var mark = document.getElementById('railMark');
		mark.textContent = state.draft.photo ? SPINE.initials : SPINE.initials;
		mark.className = 'rail-mark' + (state.draft.photo ? ' has-photo' : '');
	}

	var CANDIDATE_STEPS = [
		{ id: 'account', label: 'Account' },
		{ id: 'edit', label: 'Profile' },
		{ id: 'pledge', label: 'Pledge' },
		{ id: 'verify', label: 'Verify' },
		{ id: 'preview', label: 'Publish' }
	];
	var VOTER_STEPS = [
		{ id: 'voter-review', label: 'Review request' },
		{ id: 'voter-sent', label: 'Confirmation' }
	];

	function renderSteps() {
		var host = document.getElementById('stepBar');
		var scr = state.screen;
		var steps = null;
		if (CANDIDATE_STEPS.some(function (s) { return s.id === scr; }) || (scr === 'done' && state.path === 'candidate')) {
			steps = CANDIDATE_STEPS;
		} else if (VOTER_STEPS.some(function (s) { return s.id === scr; })) {
			steps = VOTER_STEPS;
		}
		if (!steps) { host.innerHTML = ''; return; }

		var activeIdx = steps.map(function (s) { return s.id; }).indexOf(scr);
		if (scr === 'done') activeIdx = steps.length;

		var html = steps.map(function (s, i) {
			var done = i < activeIdx;
			var active = i === activeIdx;
			var cls = 'step' + (active ? ' is-active' : done ? ' is-done' : '');
			var dot = done ? icon('check', 12) : String(i + 1);
			return '<div class="' + cls + '"><span class="step-dot">' + dot + '</span><span class="step-label">' + esc(s.label) + '</span></div>' +
				(i < steps.length - 1 ? '<span class="step-sep"></span>' : '');
		}).join('');

		host.innerHTML = '<nav class="steps" aria-label="Progress"><div class="steps-inner">' + html + '</div></nav>';
	}

	var toastTimer = null;
	function toast(msg, ico) {
		var host = document.getElementById('toastHost');
		host.innerHTML = '<div class="toast" role="status">' + icon(ico || 'check', 16) + '<span>' + esc(msg) + '</span></div>';
		clearTimeout(toastTimer);
		toastTimer = setTimeout(function () { host.innerHTML = ''; }, 3200);
	}

	function protoNote(text) {
		return '<p class="prototype-note">' + icon('info', 14) + '<span>' + text + '</span></p>';
	}

	/* ---------------- shared partials ---------------- */

	function heroBlock() {
		var published = state.publish.published;
		var callout;
		if (state.pledge.taken) {
			callout = '<div class="hero-callout">' +
				'<span class="hero-callout-mark" style="color: var(--gold)">' + icon('star', 26) + '</span>' +
				'<span>This candidate took the <b>People First Pledge</b>, promising to serve people first, independent of both major parties and big-money interests.</span></div>';
		} else {
			callout = '<div class="hero-callout">' +
				'<span class="hero-callout-mark" style="color: var(--on-navy-muted)">' + icon('star', 26) + '</span>' +
				'<span>This candidate has not yet taken the <b>People First Pledge</b> to serve people first, independent of both major parties and big-money interests.</span></div>';
		}

		return '<section class="hero">' +
			'<div class="hero-inner">' +
				'<div class="hero-avatar' + (state.draft.photo ? ' has-photo' : '') + '">' + SPINE.initials + '</div>' +
				'<div class="hero-text">' +
					'<div class="pill-row">' +
						'<span class="pill" style="background: hsl(0 0% 100% / 0.12); border-color: hsl(0 0% 100% / 0.25); color: #fff;">Candidate</span>' +
						'<span class="pill" style="background: hsl(0 0% 100% / 0.12); border-color: hsl(0 0% 100% / 0.25); color: #fff;">' + esc(SPINE.affiliation) + '</span>' +
						(published ? '<span class="pill pill-green">Claimed profile</span>' : '') +
					'</div>' +
					'<div>' +
						'<h1 class="hero-name">' + esc(SPINE.fullName) + '</h1>' +
						'<p class="hero-office">' + esc(SPINE.office) + '</p>' +
						'<p class="hero-district">' + esc(SPINE.district) + '</p>' +
					'</div>' +
					callout +
				'</div>' +
			'</div>' +
		'</section>';
	}

	function sidebarBlock() {
		var rows = [
			['Office', SPINE.office],
			['Seat', SPINE.seat],
			['District', SPINE.district],
			['Level', SPINE.level],
			['Affiliation', SPINE.affiliation],
			['Election', SPINE.electionDate]
		];
		var contact = '';
		if (state.publish.published && (state.draft.website || state.draft.email)) {
			var bits = [];
			if (state.draft.website) bits.push(['Website', state.draft.website]);
			if (state.draft.email) bits.push(['Email', state.draft.email]);
			contact = '<hr class="divider"><dl style="margin:0">' + bits.map(function (r) {
				return '<div class="side-row"><dt>' + esc(r[0]) + '</dt><dd>' + esc(r[1]) + '</dd></div>';
			}).join('') + '</dl>';
		}
		return '<aside class="stack">' +
			'<div class="card">' +
				'<h2 class="h-sm" style="margin-bottom:6px">Office</h2>' +
				'<dl style="margin:0">' + rows.map(function (r) {
					return '<div class="side-row"><dt>' + esc(r[0]) + '</dt><dd>' + esc(r[1]) + '</dd></div>';
				}).join('') + '</dl>' +
				contact +
			'</div>' +
			'<div class="card">' +
				'<h2 class="h-sm" style="margin-bottom:10px">District</h2>' +
				'<div class="map-stub">' + icon('pin', 20) + '<span style="margin-left:6px">' + esc(SPINE.districtShort) + ' voter density</span></div>' +
				'<p class="faint" style="margin-top:9px">Source: ' + esc(SPINE.source) + '</p>' +
			'</div>' +
		'</aside>';
	}

	/* ================================================================== *
	 * SCREEN 1 — the unclaimed (or claimed) public profile. Entry point
	 * and the place every path returns to.
	 * ================================================================== */
	SCREENS.profile = function () {
		var published = state.publish.published;
		var resumable = !published && (state.draft.saved || state.account.loggedIn);

		var banner = '';
		if (published) {
			banner = '<div class="notice notice-green">' + icon('check', 20, 'notice-ico') +
				'<div class="notice-body"><b>Your profile is live.</b> Voters in ' + esc(SPINE.district) +
				' can now see your bio and priorities. You can edit it any time — changes stay private until you publish them.</div></div>';
		} else if (resumable) {
			banner = '<div class="notice notice-gold">' + icon('clock', 20, 'notice-ico') +
				'<div class="notice-body"><b>You have an unfinished draft.</b> Nothing you have written is public yet. ' +
				'Pick up where you left off whenever you are ready.</div></div>';
		}

		var bioCard;
		if (published && state.draft.bio.trim()) {
			bioCard = '<div class="card"><h2 class="h-md" style="margin-bottom:10px">About ' + esc(SPINE.firstName) + '</h2>' +
				'<p style="white-space:pre-wrap">' + esc(state.draft.bio) + '</p></div>';
		} else {
			bioCard = '<div class="card"><h2 class="h-md" style="margin-bottom:14px">About ' + esc(SPINE.firstName) + '</h2>' +
				'<div class="empty">' + icon('doc', 22) +
				'<span class="empty-title">No biography yet</span>' +
				'<span class="empty-sub">GoodParty.org builds this page from public election filings. ' +
				'A biography appears once ' + esc(SPINE.firstName) + ' claims the profile and adds one.</span></div></div>';
		}

		var issuesCard;
		if (published && state.draft.issues.length) {

				'<div class="pill-row">' + state.draft.issues.map(function (i) {
					return '<span class="issue-chip">' + esc(i) + '</span>';
				}).join('') + '</div></div>';
		} else {
			issuesCard = '<div class="card"><h2 class="h-md" style="margin-bottom:14px">Top priorities</h2>' +
				'<div class="empty">' + icon('vote', 22) +
				'<span class="empty-title">No priorities listed</span>' +
				'<span class="empty-sub">Voters look here first. This section fills in when the candidate adds the issues they are running on.</span></div></div>';
		}

		var claimCard = '';
		if (!published) {
			claimCard = '<div class="card pad-lg" style="background: linear-gradient(170deg, var(--surface) 0%, var(--accent-soft) 100%); border-color: var(--accent-border)">' +
				'<div class="stack">' +
					'<div>' +
						'<h2 class="h-lg">This profile is incomplete.</h2>' +
						'<p class="lede" style="margin-top:8px">Are you ' + esc(SPINE.fullName) + '? Claim your profile and share your top priorities with voters. ' +
						'Not ' + esc(SPINE.fullName) + '? Ask this candidate to complete their profile today.</p>' +
					'</div>' +
					'<div class="btn-row">' +
						'<button class="btn btn-navy btn-lg" data-go="path">' + (resumable ? 'Continue where you left off' : 'Get started') + ' ' + icon('ext', 16) + '</button>' +
					'</div>' +
				'</div>' +
			'</div>';
		} else {
			claimCard = '<div class="card"><div class="card-head">' +
				'<div><h2 class="h-sm">Manage your profile</h2><p class="muted" style="margin-top:4px">You claimed this profile. Edits stay private until you publish them.</p></div>' +
				'<button class="btn btn-outline btn-sm" data-go="edit">' + icon('pencil', 14) + ' Edit profile</button>' +
				'</div></div>';
		}

		return '<div class="page screen">' +
			'<div class="stack-lg">' +
				heroBlock() +
				(banner ? banner : '') +
				'<div class="profile-grid">' +
					sidebarBlock() +
					'<div class="stack">' + claimCard + bioCard + issuesCard + '</div>' +
				'</div>' +
				protoNote('Prototype. Jordan Avery is a fictional candidate and this page is not connected to GoodParty.org. Items marked <span class="proposal">Proposal</span> are design suggestions, not confirmed behaviour.') +
			'</div>' +
		'</div>';
	};

	/* ================================================================== *
	 * SCREEN 3 — sign up or log in.
	 * ================================================================== */

				'<div class="field">' +
					'<label class="field-label" for="firstName">First name</label>' +
					'<input class="input" id="firstName" data-model="account.firstName" value="' + esc(a.firstName) + '" autocomplete="given-name" placeholder="' + esc(SPINE.firstName) + '">' +

					'<label class="field-label" for="lastName">Last name</label>' +

					'<p class="err" id="err-lastName" hidden></p>' +

						'<div class="field">' +
							'<label class="field-label" for="email">Email address</label>' +
							'<input class="input" id="email" type="email" data-model="account.email" value="' + esc(a.email) + '" autocomplete="email" placeholder="you@example.com">' +
							'<p class="err" id="err-email" hidden></p>' +
						'</div>' +

						'<div class="field">' +
							'<label class="field-label" for="password">Password</label>' +

								'<input class="input" id="password" type="password" data-model="account.password" value="' + esc(a.password) + '" style="padding-right:46px" autocomplete="' + (signup ? 'new-password' : 'current-password') + '">' +
								'<button type="button" id="pwToggle" aria-label="Show password" style="position:absolute;right:6px;top:50%;transform:translateY(-50%);background:transparent;border:none;cursor:pointer;color:var(--fg-faint);width:34px;height:34px;display:grid;place-items:center;border-radius:6px">' + icon('eye', 17) + '</button>' +
							'</div>' +

				protoNote('No account is created and nothing is sent. Any email and a password of 8+ characters will continue.') +
			'</div>' +
		'</div>';
	};

	/* ================================================================== *
	 * SCREEN 4 — edit the prefilled profile. Everything already known is
	 * shown locked rather than asked for again.
	 * ================================================================== */
	SCREENS.edit = function () {
		var d = state.draft;
		var words = bioWordCount();

		var chips = d.issues.length ?
			'<div class="pill-row" style="margin-bottom:12px">' + d.issues.map(function (i) {
				return '<span class="issue-chip">' + esc(i) + '<button type="button" data-remove-issue="' + esc(i) + '" aria-label="Remove ' + esc(i) + '">' + icon('x', 13) + '</button></span>';
			}).join('') + '</div>' :
			'<div class="empty" style="margin-bottom:12px;padding:18px">' + icon('vote', 20) +
				'<span class="empty-title">No priorities chosen yet</span>' +
				'<span class="empty-sub">Pick up to five. Voters see these at the top of your profile.</span></div>';

		var available = ISSUE_OPTIONS.filter(function (i) { return d.issues.indexOf(i) < 0; });
		var picker = d.issues.length >= 5 ?
			'<p class="faint">Five is the maximum. Remove one to add another.</p>' :
			'<div class="pill-row">' + available.map(function (i) {
				return '<button type="button" class="pill" data-add-issue="' + esc(i) + '" style="cursor:pointer">' + icon('plus', 12) + ' ' + esc(i) + '</button>';
			}).join('') + '</div>';

		return '<div class="page mid screen">' +
			'<div class="stack-lg">' +
				'<div class="stack-sm">' +
					'<button class="btn btn-ghost btn-sm" style="align-self:flex-start;margin-left:-14px" data-go="account">' + icon('back', 14) + ' Back</button>' +
					'<h1 class="h-xl">Fill in your profile</h1>' +
					'<p class="lede">We have prefilled everything already on record. Add what only you can — your biography and the issues you are running on.</p>' +
				'</div>' +

				'<div class="notice notice-gold">' + icon('lock', 20, 'notice-ico') +
					'<div class="notice-body"><b>Private until you publish.</b> Nothing on this screen is visible to voters. ' +
					'Your profile keeps showing its current public version until you verify your identity and publish.</div></div>' +

				'<div class="card pad-lg">' +
					'<h2 class="h-md" style="margin-bottom:4px">From public records</h2>' +
					'<p class="muted" style="margin-bottom:16px">Sourced from ' + esc(SPINE.source) + '. We do not ask you to re-enter any of it.</p>' +
					'<div class="grid-2">' +
						'<div class="field"><span class="field-label">Name</span><div class="locked"><span class="locked-ico">' + icon('lock', 15) + '</span><span class="locked-val">' + esc(SPINE.fullName) + '</span></div></div>' +
						'<div class="field"><span class="field-label">Office</span><div class="locked"><span class="locked-ico">' + icon('lock', 15) + '</span><span class="locked-val">' + esc(SPINE.office) + '</span></div></div>' +
						'<div class="field"><span class="field-label">District</span><div class="locked"><span class="locked-ico">' + icon('lock', 15) + '</span><span class="locked-val">' + esc(SPINE.district) + '</span></div></div>' +
						'<div class="field"><span class="field-label">Affiliation</span><div class="locked"><span class="locked-ico">' + icon('lock', 15) + '</span><span class="locked-val">' + esc(SPINE.affiliation) + '</span></div></div>' +
					'</div>' +
					'<p class="faint" style="margin-top:12px">Something wrong here? ' +
						'<a href="#edit" data-noop="1">Tell us about it</a> — office and district data is corrected at the source, not on this page. ' +
						'<span class="proposal">Proposal</span></p>' +
				'</div>' +

				'<div class="card pad-lg">' +
					'<div class="stack">' +
						'<div>' +
							'<h2 class="h-md" style="margin-bottom:4px">Your biography</h2>' +
							'<p class="muted">Tell voters who you are and why you are running. Plain language works best.</p>' +
						'</div>' +
						'<div class="field">' +
							'<label class="field-label" for="bio">Biography' +
								'<span class="counter' + (words > 300 ? ' over' : '') + '" id="bioCount">' + words + ' / 300 words</span>' +
							'</label>' +
							'<textarea class="textarea" id="bio" data-model="draft.bio" placeholder="I am running for ' + esc(SPINE.office) + ' in ' + esc(SPINE.district) + ' because…">' + esc(d.bio) + '</textarea>' +
							'<p class="field-hint">At least 20 words. Nothing is prefilled here — we do not write biographies for candidates.</p>' +
							'<p class="err" id="err-bio" hidden></p>' +
						'</div>' +

						'<hr class="divider">' +

						'<div>' +
							'<h2 class="h-md" style="margin-bottom:4px">Top priorities</h2>' +
							'<p class="muted" style="margin-bottom:12px">Choose one to five issues.</p>' +
							chips + picker +
							'<p class="err" id="err-issues" hidden style="margin-top:10px"></p>' +
						'</div>' +

						'<hr class="divider">' +

						'<div>' +
							'<h2 class="h-md" style="margin-bottom:4px">Contact and links</h2>' +

								'<div class="field">' +

									'<input class="input" id="website" data-model="draft.website" value="' + esc(d.website) + '" placeholder="https://">' +
									'<p class="err" id="err-website" hidden></p>' +
								'</div>' +
								'<div class="field">' +
									'<label class="field-label" for="pubEmail">Public contact email</label>' +
									'<input class="input" id="pubEmail" type="email" data-model="draft.email" value="' + esc(d.email) + '" placeholder="hello@campaign.org">' +
									'<p class="err" id="err-pubEmail" hidden></p>' +
								'</div>' +
							'</div>' +
						'</div>' +

						'<hr class="divider">' +

						'<div>' +
							'<h2 class="h-md" style="margin-bottom:4px">Headshot</h2>' +
							'<p class="muted" style="margin-bottom:12px">Profiles with a photo get noticeably more attention from voters.</p>' +

					'<button class="btn btn-ghost" id="saveLater">' + icon('save', 15) + ' Save and finish later</button>' +
					'<div class="btn-row">' +
						'<button class="btn btn-outline" id="skipEdit">Skip for now</button>' +
						'<button class="btn btn-primary" id="editContinue">Continue to the pledge ' + icon('arrow', 15) + '</button>' +
					'</div>' +
				'</div>' +

				protoNote('Uploading a photo is simulated. "Skip for now" moves you forward with an empty profile; "Save and finish later" returns you to the profile with the draft kept.') +
			'</div>' +
		'</div>';
	};

	/* ================================================================== *
	 * SCREEN 5 — the People First Pledge. Eligibility is shown before the
	 * commitments, because a partisan affiliation disqualifies outright.
	 * ================================================================== */
	SCREENS.pledge = function () {
		var p = state.pledge;
		var allAgreed = PLEDGE_PILLARS.every(function (x) { return p.agreed[x.key]; });

		var pillars = PLEDGE_PILLARS.map(function (x) {
			var on = p.agreed[x.key];
			return '<label class="check' + (on ? ' is-on' : '') + '" style="align-items:flex-start">' +
				'<input type="checkbox" data-pledge="' + x.key + '"' + (on ? ' checked' : '') + '>' +
				'<span class="check-body">' +
					'<span style="display:flex;align-items:center;gap:10px;margin-bottom:4px">' +
						'<span class="pillar-ico" style="width:32px;height:32px;background:' + x.bg + ';color:' + x.fg + '">' + icon(x.icon, 17) + '</span>' +
						'<span class="check-title">' + esc(x.title) + '</span>' +
					'</span>' +
					'<span class="check-sub">' + esc(x.body) + '</span>' +
				'</span>' +
			'</label>';
		}).join('');

		return '<div class="page mid screen">' +
			'<div class="stack-lg">' +
				'<div class="stack-sm">' +
					'<button class="btn btn-ghost btn-sm" style="align-self:flex-start;margin-left:-14px" data-go="edit">' + icon('back', 14) + ' Back</button>' +
					'<span class="eyebrow">Step 3 of 5</span>' +
					'<h1 class="h-xl">The People First Pledge</h1>' +
					'<p class="lede">GoodParty.org only works with candidates and elected officials who agree to serve people first, ' +
					'independent of both major parties and big-money interests. Their stances on individual issues vary. ' +
					'They are eligible to take the pledge if they agree to be:</p>' +
				'</div>' +

				'<div class="card pad-lg" style="background:var(--green-soft);border-color:var(--green-border)">' +
					'<div style="display:flex;gap:14px;align-items:flex-start">' +
						'<span style="flex:none;color:var(--green);margin-top:2px">' + icon('shield', 24) + '</span>' +
						'<div class="stack-sm" style="min-width:0">' +
							'<h2 class="h-sm">' + esc(SPINE.fullName) + ' is eligible</h2>' +
							'<p class="muted">Eligibility is checked against the affiliation on file before the pledge is offered.</p>' +
							'<dl style="margin:6px 0 0">' +
								'<div class="side-row" style="border-color:var(--green-border)"><dt>Affiliation</dt><dd>' + esc(SPINE.affiliation) + ' ' + '<span class="pill pill-green" style="margin-left:4px">Passes</span></dd></div>' +
								'<div class="side-row" style="border-color:var(--green-border)"><dt>The rule</dt><dd style="font-weight:400">A Democratic or Republican line on <em>any</em> current party affiliation disqualifies a candidate, as does a filing recorded as a partisan candidacy.</dd></div>' +
							'</dl>' +
						'</div>' +
					'</div>' +
				'</div>' +

				'<div class="card pad-lg">' +
					'<div class="stack">' +
						'<h2 class="h-md">Agree to all three commitments</h2>' +
						pillars +
						'<p class="err" id="err-pledge" hidden></p>' +

						'<hr class="divider">' +

						'<div class="field">' +
							'<label class="field-label" for="sig">Type your full name to sign</label>' +
							'<input class="input" id="sig" data-model="pledge.signature" value="' + esc(p.signature) + '" placeholder="' + esc(SPINE.fullName) + '" autocomplete="off">' +
							'<p class="field-hint">Must match ' + esc(SPINE.fullName) + '.</p>' +
							'<p class="err" id="err-sig" hidden></p>' +
						'</div>' +
					'</div>' +
				'</div>' +

				'<div class="notice notice-blue">' + icon('info', 20, 'notice-ico') +
					'<div class="notice-body">Taking the pledge adds the Heart &amp; Star mark to your profile. ' +
					'GoodParty.org may remove it if a candidate later accepts a major-party endorsement.</div></div>' +

				'<div class="btn-row actions split">' +
					'<button class="btn btn-ghost" data-go="edit">' + icon('back', 15) + ' Back to profile editing</button>' +
					'<button class="btn btn-primary btn-lg" id="pledgeSubmit"' + (allAgreed ? '' : '') + '>Take the pledge ' + icon('arrow', 15) + '</button>' +
				'</div>' +

				protoNote('Nothing is recorded. In the live product a signed pledge is reviewed by GoodParty.org before the mark appears. <span class="proposal">Proposal</span>') +
			'</div>' +
		'</div>';
	};

	/* ================================================================== *
	 * SCREEN 6 — identity verification. The requirement is stated plainly;
	 * the methods themselves are proposals.
	 * ================================================================== */
	SCREENS.verify = function () {
		var v = state.verify;

		if (v.status === 'pending') {
			return '<div class="page narrow screen">' +
				'<div class="stack-lg">' +
					'<div class="card pad-lg" style="text-align:center">' +
						'<div class="stack" style="align-items:center">' +
							'<span class="ok-mark" style="background:var(--gold-soft);border-color:var(--gold-border);color:var(--gold)">' + icon('clock', 30) + '</span>' +
							'<h1 class="h-lg">We are checking your identity</h1>' +
							'<p class="lede" style="text-align:center">Most checks finish in a few minutes. We will email ' +

	/* ================================================================== *
	 * Validation helpers
	 * ================================================================== */
	function setErr(id, msg) {
		var el = document.getElementById('err-' + id);
		if (!el) return;
		el.innerHTML = icon('alert', 13) + '<span>' + esc(msg) + '</span>';
		el.hidden = false;
		var input = document.getElementById(id);
		if (input) input.setAttribute('aria-invalid', 'true');
	}

	function clearErr(id) {
		var el = document.getElementById('err-' + id);
		if (el) { el.hidden = true; el.textContent = ''; }
		var input = document.getElementById(id);
		if (input) input.removeAttribute('aria-invalid');
	}

	function focusFirstError() {
		var el = document.querySelector('[aria-invalid="true"]');
		if (el && el.focus) el.focus();
	}

	function validEmail(v) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.trim()); }

	function busy(btn, label) {
		if (!btn) return function () {};
		var original = btn.innerHTML;
		btn.disabled = true;
		btn.innerHTML = '<span class="spinner"></span><span>' + esc(label) + '</span>';
		return function () { btn.disabled = false; btn.innerHTML = original; };
	}

	function setPath(obj, path, value) {
		var parts = path.split('.');
		var ref = obj;
		for (var i = 0; i < parts.length - 1; i++) ref = ref[parts[i]];
		ref[parts[parts.length - 1]] = value;
	}

	/* ================================================================== *
	 * Render + wiring
	 * ================================================================== */
	function render() {
		state.screen = current();
		var fn = SCREENS[state.screen] || SCREENS.profile;
		document.getElementById('app').innerHTML = fn();
		renderSteps();
		updateRail();
		wire();
	}

	function wire() {
		var app = document.getElementById('app');

		// plain navigation
		app.querySelectorAll('[data-go]').forEach(function (b) {
			b.addEventListener('click', function () { go(b.getAttribute('data-go')); });
		});

		// choose a path
		app.querySelectorAll('[data-path]').forEach(function (b) {
			b.addEventListener('click', function () {
				state.path = b.getAttribute('data-path');
				go(state.path === 'candidate' ? (state.account.loggedIn ? 'edit' : 'account') : 'voter-review');
			});
		});

		// two-way binding; typing is never lost moving backward or forward
		app.querySelectorAll('[data-model]').forEach(function (el) {
			el.addEventListener('input', function () {
				setPath(state, el.getAttribute('data-model'), el.value);
				if (el.id) clearErr(el.id);
				if (el.id === 'bio') {
					state.draft.touched = true;
					var c = document.getElementById('bioCount');
					var w = bioWordCount();
					if (c) { c.textContent = w + ' / 300 words'; c.className = 'counter' + (w > 300 ? ' over' : ''); }
				}
				if (el.id === 'vNote') {
					var p = document.getElementById('notePreview');
					if (p) { p.hidden = !el.value.trim(); p.textContent = el.value; }
				}
				if (el.getAttribute('data-model').indexOf('draft.') === 0) state.draft.touched = true;
			});
		});

		// ---- account ----
		app.querySelectorAll('[data-mode]').forEach(function (t) {
			t.addEventListener('click', function () { state.account.mode = t.getAttribute('data-mode'); render(); });
		});

		var pwToggle = document.getElementById('pwToggle');
		if (pwToggle) pwToggle.addEventListener('click', function () {
			var inp = document.getElementById('password');
			var showing = inp.type === 'text';
			inp.type = showing ? 'password' : 'text';
			pwToggle.innerHTML = icon(showing ? 'eye' : 'eyeOff', 17);
			pwToggle.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
		});

		var accountSubmit = document.getElementById('accountSubmit');
		if (accountSubmit) accountSubmit.addEventListener('click', function () {
			var a = state.account, ok = true;
			if (a.mode === 'signup') {
				if (!a.firstName.trim()) { setErr('firstName', 'Enter your first name.'); ok = false; }
				if (!a.lastName.trim()) { setErr('lastName', 'Enter your last name.'); ok = false; }
			}
			if (!a.email.trim()) { setErr('email', 'Enter your email address.'); ok = false; }
			else if (!validEmail(a.email)) { setErr('email', 'That does not look like an email address.'); ok = false; }
			if (!a.password) { setErr('password', 'Enter a password.'); ok = false; }
			else if (a.mode === 'signup' && a.password.length < 8) { setErr('password', 'Use at least 8 characters.'); ok = false; }
			if (!ok) { focusFirstError(); return; }

			var restore = busy(accountSubmit, a.mode === 'signup' ? 'Creating your account' : 'Logging in');
			setTimeout(function () {
				restore();
				state.account.loggedIn = true;
				state.path = 'candidate';
				toast(a.mode === 'signup' ? 'Account created' : 'Logged in');
				go('edit');
			}, 1100);
		});

		// ---- edit ----
		app.querySelectorAll('[data-add-issue]').forEach(function (b) {
			b.addEventListener('click', function () {
				var v = b.getAttribute('data-add-issue');
				if (state.draft.issues.length >= 5 || state.draft.issues.indexOf(v) >= 0) return;
				state.draft.issues.push(v);
				state.draft.touched = true;
				clearErr('issues');
				render();
			});
		});
		app.querySelectorAll('[data-remove-issue]').forEach(function (b) {
			b.addEventListener('click', function () {
				var v = b.getAttribute('data-remove-issue');
				state.draft.issues = state.draft.issues.filter(function (i) { return i !== v; });
				state.draft.touched = true;
				render();
			});
		});

		var photoBtn = document.getElementById('photoBtn');
		if (photoBtn) photoBtn.addEventListener('click', function () {
			if (state.draft.photo) { state.draft.photo = false; render(); return; }
			var restore = busy(photoBtn, 'Uploading');
			setTimeout(function () {
				restore();
				state.draft.photo = true;
				state.draft.touched = true;
				toast('Headshot added');
				render();
			}, 900);
		});

		function saveDraft(btn, then) {
			var restore = busy(btn, 'Saving');
			setTimeout(function () {
				restore();
				state.draft.saved = true;
				toast('Draft saved. It stays private.', 'lock');
				then();
			}, 800);
		}

		var saveLater = document.getElementById('saveLater');
		if (saveLater) saveLater.addEventListener('click', function () {
			saveDraft(saveLater, function () { go('profile'); });
		});

		var saveLater2 = document.getElementById('saveLater2');
		if (saveLater2) saveLater2.addEventListener('click', function () {
			saveDraft(saveLater2, function () { go('profile'); });
		});

		var skipEdit = document.getElementById('skipEdit');
		if (skipEdit) skipEdit.addEventListener('click', function () {
			state.draft.skipped = true;
			toast('Skipped for now. You can come back to this.', 'clock');
			go('pledge');
		});

		var editContinue = document.getElementById('editContinue');
		if (editContinue) editContinue.addEventListener('click', function () {
			var d = state.draft, ok = true;
			var w = bioWordCount();
			if (!d.bio.trim()) { setErr('bio', 'Add a biography, or choose "Skip for now" to come back to it.'); ok = false; }
			else if (w < 20) { setErr('bio', 'Write at least 20 words so voters get a real introduction. You have ' + w + '.'); ok = false; }
			else if (w > 300) { setErr('bio', 'That is ' + w + ' words. Trim it to 300 or fewer.'); ok = false; }
			if (!d.issues.length) { setErr('issues', 'Choose at least one priority, or skip for now.'); ok = false; }
			if (d.website.trim() && !/^https?:\/\/.+\..+/.test(d.website.trim())) { setErr('website', 'Start the address with https:// and include a domain.'); ok = false; }
			if (d.email.trim() && !validEmail(d.email)) { setErr('pubEmail', 'That does not look like an email address.'); ok = false; }
			if (!ok) { focusFirstError(); return; }

			var restore = busy(editContinue, 'Saving draft');
			setTimeout(function () {
				restore();
				state.draft.saved = true;
				state.draft.skipped = false;
				go('pledge');
			}, 800);
		});

		// ---- pledge ----
		app.querySelectorAll('[data-pledge]').forEach(function (cb) {
			cb.addEventListener('change', function () {
				state.pledge.agreed[cb.getAttribute('data-pledge')] = cb.checked;
				cb.closest('.check').classList.toggle('is-on', cb.checked);
				clearErr('pledge');
			});
		});

		var pledgeSubmit = document.getElementById('pledgeSubmit');
		if (pledgeSubmit) pledgeSubmit.addEventListener('click', function () {
			var ok = true;
			var missing = PLEDGE_PILLARS.filter(function (x) { return !state.pledge.agreed[x.key]; });
			if (missing.length) {
				setErr('pledge', 'Agree to all three commitments to take the pledge. Still to confirm: ' + missing.map(function (m) { return m.title; }).join(', ') + '.');
				ok = false;
			}
			var sig = state.pledge.signature.trim();
			if (!sig) { setErr('sig', 'Type your full name to sign.'); ok = false; }
			else if (sig.toLowerCase() !== SPINE.fullName.toLowerCase()) { setErr('sig', 'The signature must match ' + SPINE.fullName + ' exactly.'); ok = false; }
			if (!ok) { focusFirstError(); return; }

			var restore = busy(pledgeSubmit, 'Recording your pledge');
			setTimeout(function () {
				restore();
				state.pledge.taken = true;
				toast('Pledge taken', 'star');
				go('verify');
			}, 1100);
		});

		// ---- verify ----
		app.querySelectorAll('[data-verify]').forEach(function (r) {
			r.addEventListener('change', function () {
				state.verify.method = r.getAttribute('data-verify');
				clearErr('verify');
				render();
			});
		});

		var docBtn = document.getElementById('docBtn');
		if (docBtn) docBtn.addEventListener('click', function () {
			var restore = busy(docBtn, 'Uploading');
			setTimeout(function () {
				restore();
				state.verify.doc = 'filing-receipt.pdf';
				clearErr('doc');
				render();
			}, 900);
		});

		var verifySubmit = document.getElementById('verifySubmit');
		if (verifySubmit) verifySubmit.addEventListener('click', function () {
			var v = state.verify, ok = true;
			if (!v.method) { setErr('verify', 'Choose how you want to verify.'); ok = false; }
			if (v.method === 'phone') {
				var digits = v.phone.replace(/\D/g, '');
				if (!v.phone.trim()) { setErr('vphone', 'Enter the phone number on your filing.'); ok = false; }
				else if (digits.length < 10) { setErr('vphone', 'Enter a 10-digit phone number.'); ok = false; }
			}
			if (v.method === 'doc' && !v.doc) { setErr('doc', 'Choose a file to upload.'); ok = false; }
			if (!ok) { focusFirstError(); return; }

			var restore = busy(verifySubmit, 'Submitting');
			setTimeout(function () {
				restore();
				state.verify.submitted = true;
				state.verify.status = 'pending';
				state.verify.contactShown = v.method === 'phone' ? v.phone : state.account.email;
				render();
			}, 1200);
		});

		var verifyLater = document.getElementById('verifyLater');
		if (verifyLater) verifyLater.addEventListener('click', function () {
			toast('You can verify any time. Publishing stays locked until then.', 'clock');
			go('preview');
		});

		var simulateVerified = document.getElementById('simulateVerified');
		if (simulateVerified) simulateVerified.addEventListener('click', function () {
			var restore = busy(simulateVerified, 'Finishing check');
			setTimeout(function () {
				restore();
				state.verify.status = 'verified';
				toast('Identity verified', 'shield');
				go('preview');
			}, 900);
		});

		// ---- publish ----
		var publishBtn = document.getElementById('publishBtn');
		if (publishBtn) publishBtn.addEventListener('click', function () {
			var restore = busy(publishBtn, 'Publishing');
			setTimeout(function () {
				restore();
				state.publish.published = true;
				go('done');
			}, 1400);
		});

		// ---- voter ----
		var sendRequest = document.getElementById('sendRequest');
		if (sendRequest) sendRequest.addEventListener('click', function () {
			var v = state.voter, ok = true;
			if (!v.firstName.trim()) { setErr('vFirst', 'Enter your first name.'); ok = false; }
			if (!v.lastName.trim()) { setErr('vLast', 'Enter your last name.'); ok = false; }
			if (!v.email.trim()) { setErr('vEmail', 'Enter your email address.'); ok = false; }
			else if (!validEmail(v.email)) { setErr('vEmail', 'That does not look like an email address.'); ok = false; }
			if (!ok) { focusFirstError(); return; }

			var restore = busy(sendRequest, 'Sending');
			setTimeout(function () {
				restore();
				state.voter.sent = true;
				go('voter-sent');
			}, 1200);
		});

		// non-navigating demo links
		app.querySelectorAll('[data-noop]').forEach(function (a) {
			a.addEventListener('click', function (e) {
				e.preventDefault();
				toast('Not part of this prototype yet.', 'info');
			});
		});
	}

	/* ---------------- theme toggle ---------------- */
	document.getElementById('themeBtn').addEventListener('click', function () {
		var root = document.documentElement;
		var now = root.getAttribute('data-theme');
		var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
		var isDark = now === 'dark' || (!now && systemDark);
		root.setAttribute('data-theme', isDark ? 'light' : 'dark');
	});

	/* ---------------- boot ---------------- */
	if (!location.hash || VALID.indexOf(location.hash.slice(1)) < 0) {
		if (location.hash) { location.replace('#profile'); }
	}
	render();
})();
</script>

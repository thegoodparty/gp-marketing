name: CI

on:
  pull_request:
    branches-ignore: [master]
  push:
    branches: [develop]
  workflow_dispatch:
  # Vercel emits deployment_status events; the smoke job crawls production
  # after every successful Production deployment.
  deployment_status:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Sanity contract tests
        run: bun run test:integration:contracts
        env:
          SANITY_TEST_DATASET: ${{ vars.SANITY_TEST_DATASET || 'production' }}
          # SANITY_TEST_TOKEN is optional — only needed for private datasets.
          SANITY_TEST_TOKEN: ${{ secrets.SANITY_TEST_TOKEN }}

  e2e:
    name: E2E & Visual regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      deployments: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Tests run against the PR's own Vercel Preview deployment, so failures
      # reflect this PR's code. The E2E_BASE_URL repo variable, if set, overrides
      # (used by workflow_dispatch runs).
      - name: Resolve target URL (PR preview)
        run: |
          TARGET=$(bun run scripts/resolve-preview-url.ts "${{ github.event.pull_request.head.sha || github.sha }}")
          echo "Testing against: $TARGET"
          echo "E2E_BASE_URL=$TARGET" >> "$GITHUB_ENV"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      - name: Run page health E2E tests
        run: bun run test:e2e
        env:
          SANITY_TEST_DATASET: ${{ vars.SANITY_TEST_DATASET || 'production' }}

      # Non-blocking until baselines are committed to e2e/snapshots/ and have
      # proven stable — then remove continue-on-error to make this a gate.
      - name: Run visual regression tests
        continue-on-error: true
        run: bun run test:e2e:visual
        env:
          SANITY_TEST_DATASET: ${{ vars.SANITY_TEST_DATASET || 'production' }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 14

      - name: Upload visual diff artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs-${{ github.run_id }}
          path: |
            test-results/
            e2e/snapshots/
          retention-days: 14

  smoke:
    name: Post-deploy smoke crawl
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Runs automatically after every successful Vercel Production deployment
    # (master branch), or manually via workflow_dispatch.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'deployment_status' &&
       github.event.deployment_status.state == 'success' &&
       github.event.deployment_status.environment == 'Production')
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve target URL
        run: |
          TARGET="${{ github.event.deployment_status.environment_url || vars.SMOKE_BASE_URL || 'https://goodparty.org' }}"
          echo "Crawling: $TARGET"
          echo "SMOKE_TARGET=$TARGET" >> "$GITHUB_ENV"

      - name: Smoke crawl
        run: bun run smoke "$SMOKE_TARGET" --sample 100
        env:
          SMOKE_SAMPLE: ${{ vars.SMOKE_SAMPLE || '100' }}
          SMOKE_CONCURRENCY: ${{ vars.SMOKE_CONCURRENCY || '8' }}

      # HTTP-only sitemap contract checks; belongs here (not the PR gate)
      # because robots.txt and sitemap <loc> origins are only correct on the
      # production origin, not on preview deployments.
      - name: Sitemap contract tests
        run: bun run test:e2e:sitemap
        env:
          E2E_BASE_URL: ${{ env.SMOKE_TARGET }}
